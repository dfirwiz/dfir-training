<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">UA 주장과 실제 실행을 대조</title><desc id="desc">아래: 주장과 근거를 대조하는 방향
