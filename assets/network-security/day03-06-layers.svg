<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">자료 표현과 암호화 보호층</title><desc id="desc">아래: 표현·보호층의 검토 순서
모든 변환이 필수인 처리 절차 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">자료 표현과 암호화 보호층</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="160" text-anchor="middle">변환은 사건마다 다름</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="285" text-anchor="middle">파일 보호 ≠ 전송 보호</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="410" text-anchor="middle">불투명한 내용은 미확인</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">원본 자료와 식별 정보</text><text x="200.0" y="112.0" text-anchor="middle">파일 · 객체 · 바이트 · 출처</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">묶음·압축·파일 암호화 등</text><text x="200.0" y="237.0" text-anchor="middle">선택한 처리에 따라 표현 변화</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">전송 구간의 보호</text><text x="200.0" y="362.0" text-anchor="middle">TLS 등 · 종단과 관측 위치</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">관측 바이트와 다른 기록</text><text x="200.0" y="487.0" text-anchor="middle">해석 가능한 범위만 결론으로</text><text class="label" x="200" y="528" text-anchor="middle">아래: 표현·보호층의 검토 순서</text><text class="label" x="200" y="548" text-anchor="middle">모든 변환이 필수인 처리 절차 아님</text></svg>