<svg xmlns="http://www.w3.org/2000/svg" width="400" height="645" viewBox="0 0 400 645" role="img" aria-labelledby="title desc"><title id="title">인증 발급과 서비스의 역할</title><desc id="desc">아래: 역할을 나눈 개념적 방향
