<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">저장과 실행의 다른 경계</title><desc id="desc">아래: 조사 단계의 방향
모든 제품의 고정 검사 순서는 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">저장과 실행의 다른 경계</text><polyline points="70,128 70,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="160" text-anchor="middle">쓰기 금지와 같은 기능 아님</text><polyline points="70,253 70,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="285" text-anchor="middle">실제 이벤트 의미를 확인</text><polyline points="70,378 70,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="410" text-anchor="middle">다른 경로와 행위를 추가 조사</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">파일 내려받기·저장</text><text x="200.0" y="112.0" text-anchor="middle">디스크에 존재한다는 관측</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">실행·코드 로딩의 검사</text><text x="200.0" y="237.0" text-anchor="middle">대상 종류·적용 정책·모드</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">허용·감사·차단의 근거</text><text x="200.0" y="362.0" text-anchor="middle">같은 단어라도 채널·범위 확인</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">후속 프로세스·자료·통신</text><text x="200.0" y="487.0" text-anchor="middle">허용 ≠ 무해 · 차단 ≠ 전체 예방</text><text class="label" x="200" y="528" text-anchor="middle">아래: 조사 단계의 방향</text><text class="label" x="200" y="548" text-anchor="middle">모든 제품의 고정 검사 순서는 아님</text></svg>