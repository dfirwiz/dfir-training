<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">계정 이름과 실행 문맥 구별</title><desc id="desc">아래: 접근 질문의 순서
자체 목록 비교는 실제 ACL 검사가 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">계정 이름과 실행 문맥 구별</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="160" text-anchor="middle">같은 이름도 구별</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="285" text-anchor="middle">권한은 대상별로</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="410" text-anchor="middle">가능성과 수행을 분리</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">어느 계정·그룹인가</text><text x="200.0" y="112.0" text-anchor="middle">관리자 구성원이라는 주장</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">실제 프로세스의 토큰·제약</text><text x="200.0" y="237.0" text-anchor="middle">필터링 · 상승 · 서비스 설정</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">대상과 요청한 동작</text><text x="200.0" y="362.0" text-anchor="middle">읽기 · 쓰기 · 시스템 변경</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">허용 범위와 실제 결과</text><text x="200.0" y="487.0" text-anchor="middle">로컬 권한 ≠ 다른 호스트 권한</text><text class="label" x="200" y="528" text-anchor="middle">아래: 접근 질문의 순서</text><text class="label" x="200" y="548" text-anchor="middle">자체 목록 비교는 실제 ACL 검사가 아님</text></svg>