<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">높은 권한의 소비 경계 조사</title><desc id="desc">아래: 조사 질문 순서
구성 후보 ≠ 실제 권한 상승 성공</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">높은 권한의 소비 경계 조사</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="160" text-anchor="middle">입력 통제 확인</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="285" text-anchor="middle">높은 문맥인지 확인</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="410" text-anchor="middle">가능성과 수행 구별</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">입력을 누가 바꿀 수 있나</text><text x="200.0" y="112.0" text-anchor="middle">파일 · 폴더 · 실행 설정</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">누가 그 입력을 소비하나</text><text x="200.0" y="237.0" text-anchor="middle">실제 계정 · 토큰 · 요청 동작</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">어떤 조건으로 소비됐나</text><text x="200.0" y="362.0" text-anchor="middle">시작 · 로그온 · 서비스 · 작업</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">무엇이 실제로 성공했나</text><text x="200.0" y="487.0" text-anchor="middle">변경 · 문맥 · 결과 · 승인</text><text class="label" x="200" y="528" text-anchor="middle">아래: 조사 질문 순서</text><text class="label" x="200" y="548" text-anchor="middle">구성 후보 ≠ 실제 권한 상승 성공</text></svg>