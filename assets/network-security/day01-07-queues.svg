<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">경보 생성과 담당을 연결하기</title><desc id="desc">위 두 상자: 서로 다른 생성 경로
