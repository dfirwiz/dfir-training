<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">이벤트에서 조사 항목으로</title><desc id="desc">아래: 처리 순서 · 공격 단계 아님
