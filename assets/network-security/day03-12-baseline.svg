<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">파일 변화와 승인 근거</title><desc id="desc">아래: 분석 순서
가상 목록은 운영 파일 실측이 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">파일 변화와 승인 근거</text><polyline points="70,128 70,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="160" text-anchor="middle">기준선 자체의 신뢰도 확인</text><polyline points="70,253 70,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="285" text-anchor="middle">부재와 수집 실패를 구별</text><polyline points="70,378 70,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="410" text-anchor="middle">배포·계정·프로세스 기록 확인</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">기준선의 시점과 출처</text><text x="200.0" y="112.0" text-anchor="middle">내용·소유자·권한·수집 범위</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">현재 상태를 따로 관측</text><text x="200.0" y="237.0" text-anchor="middle">실제 수집 성공·감시 범위 확인</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">바뀐 내용과 속성 비교</text><text x="200.0" y="362.0" text-anchor="middle">같은 바이트에도 권한 변경 가능</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">변경 승인·행위자 대조</text><text x="200.0" y="487.0" text-anchor="middle">변화 ≠ 공격 · 시간 일치만으론 부족</text><text class="label" x="200" y="528" text-anchor="middle">아래: 분석 순서</text><text class="label" x="200" y="548" text-anchor="middle">가상 목록은 운영 파일 실측이 아님</text></svg>