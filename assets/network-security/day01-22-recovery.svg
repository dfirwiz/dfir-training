<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">복구 상태는 한 칸이 아닙니다</title><desc id="desc">아래: 구별해야 할 상태의 예
일부 자금 압수 ≠ 전체 피해 회복</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">복구 상태는 한 칸이 아닙니다</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">복구 준비</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">운영 절차와 연결</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">검토 계속</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">원인 · 접근 · 범위 조사</text><text x="200.0" y="112.0" text-anchor="middle">관측 · 미확인 · 증거 보존</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">필요한 환경 복구와 검증</text><text x="200.0" y="237.0" text-anchor="middle">계정 · 시스템 · 안전 조건</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">서비스 복귀와 현장 확인</text><text x="200.0" y="362.0" text-anchor="middle">단계별 시작 · 실제 공급</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">잔여 위험과 조사 마무리</text><text x="200.0" y="487.0" text-anchor="middle">자료 노출 · 다른 접근 · 기록</text><text class="label" x="200" y="528" text-anchor="middle">아래: 구별해야 할 상태의 예</text><text class="label" x="200" y="548" text-anchor="middle">일부 자금 압수 ≠ 전체 피해 회복</text></svg>