<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">메일의 발신 주장을 나누어 읽기</title><desc id="desc">아래: 확인 순서 · 모든 주소는 가상
SPF는 표시 이름의 사람을 검증하지 않음</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">메일의 발신 주장을 나누어 읽기</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">서로 다른 출처</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">같은 수신 구간?</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">추가 근거 연결</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">화면 이름 · 메시지 From</text><text x="200.0" y="112.0" text-anchor="middle">익숙한 이름 ≠ 사람 인증</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">SMTP 봉투 · HELO 신원</text><text x="200.0" y="237.0" text-anchor="middle">무슨 도메인을 검사했나?</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">수신 연결 상대 · DNS 정책</text><text x="200.0" y="362.0" text-anchor="middle">허용된 발송 호스트인가?</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">표시 도메인 · 실제 행위 대조</text><text x="200.0" y="487.0" text-anchor="middle">내용 · 승인 · 영향은 별도</text><text class="label" x="200" y="528" text-anchor="middle">아래: 확인 순서 · 모든 주소는 가상</text><text class="label" x="200" y="548" text-anchor="middle">SPF는 표시 이름의 사람을 검증하지 않음</text></svg>