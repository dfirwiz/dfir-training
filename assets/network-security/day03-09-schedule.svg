<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">연결 주장과 가상 일정의 비교</title><desc id="desc">아래: 자체 JSON 비교 순서
