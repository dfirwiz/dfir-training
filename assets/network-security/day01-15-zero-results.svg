<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">검색 결과가 없을 때의 질문</title><desc id="desc">아래: 원인을 좁히는 순서
