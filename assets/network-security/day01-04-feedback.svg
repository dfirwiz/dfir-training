<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">측정에서 실제 개선 확인까지</title><desc id="desc">오른쪽 되돌림: 정의와 측정 재검토
