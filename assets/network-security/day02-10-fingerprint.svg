<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">특징 지문과 정체성은 다른 질문</title><desc id="desc">아래: 방법을 비교하는 읽기 순서
지문은 인증서 서명이나 침해 판정이 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">특징 지문과 정체성은 다른 질문</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">관측 방향 구별</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">수동과 능동 구별</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">독립 근거 필요</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">JA3 · ClientHello의 선택 필드</text><text x="200.0" y="112.0" text-anchor="middle">순서 유지 · GREASE 값 제외</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">JA3S · ServerHello의 응답 필드</text><text x="200.0" y="237.0" text-anchor="middle">클라이언트 제안과 환경도 영향</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">JARM · 능동적인 서버 조회</text><text x="200.0" y="362.0" text-anchor="middle">여러 ClientHello · 이번 실행 없음</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">업무 · 단말 · 통신 맥락 대조</text><text x="200.0" y="487.0" text-anchor="middle">같은 지문 ≠ 같은 주체나 악성</text><text class="label" x="200" y="528" text-anchor="middle">아래: 방법을 비교하는 읽기 순서</text><text class="label" x="200" y="548" text-anchor="middle">지문은 인증서 서명이나 침해 판정이 아님</text></svg>