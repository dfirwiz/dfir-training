<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">SMB의 성공 단계를 구별하기</title><desc id="desc">아래: 개념적 확인 순서 · 성공 보장 아님
암호화되면 네트워크의 내용 관측 제한</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">SMB의 성공 단계를 구별하기</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">다음 단계는 별도</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">동작별 요청 · 응답</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">실행은 단말에서 확인</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">연결 · 프로토콜 협상</text><text x="200.0" y="112.0" text-anchor="middle">TCP 포트 ≠ SMB 확인</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">세션 인증 · 공유 연결</text><text x="200.0" y="237.0" text-anchor="middle">계정 · 권한 · 응답 상태 확인</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">파일/이름 있는 파이프 작업</text><text x="200.0" y="362.0" text-anchor="middle">접근 요청 ≠ 전송 완료</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">서비스 · 프로세스 근거 대조</text><text x="200.0" y="487.0" text-anchor="middle">파일 공유 ≠ 원격 실행 확인</text><text class="label" x="200" y="528" text-anchor="middle">아래: 개념적 확인 순서 · 성공 보장 아님</text><text class="label" x="200" y="548" text-anchor="middle">암호화되면 네트워크의 내용 관측 제한</text></svg>