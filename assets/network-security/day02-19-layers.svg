<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">WSMan 경로의 메시지 계층</title><desc id="desc">아래: 캡슐화의 개념 순서
SSH 전송은 다른 경로 · 모두 WinRM은 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">WSMan 경로의 메시지 계층</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">자료로 표현</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">WSMan 경로에서 포장</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">바깥으로 전송</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">원격 실행 요청과 결과</text><text x="200.0" y="112.0" text-anchor="middle">작업 · 세션 · 구조화한 자료</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">PSRP 메시지</text><text x="200.0" y="237.0" text-anchor="middle">PowerShell 원격 기능의 규칙</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">WSMan / SOAP 메시지</text><text x="200.0" y="362.0" text-anchor="middle">관리 메시지를 담아 전달</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">HTTP 또는 HTTPS · TCP · IP</text><text x="200.0" y="487.0" text-anchor="middle">전송 경로와 보호는 별도 확인</text><text class="label" x="200" y="528" text-anchor="middle">아래: 캡슐화의 개념 순서</text><text class="label" x="200" y="548" text-anchor="middle">SSH 전송은 다른 경로 · 모두 WinRM은 아님</text></svg>