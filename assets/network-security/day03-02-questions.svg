<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">전술을 조사 질문으로 바꾸기</title><desc id="desc">아래: 학습 질문 순서
전술은 목적 · 기법은 방법 · 검증은 별도</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">전술을 조사 질문으로 바꾸기</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="160" text-anchor="middle">다른 목적의 질문</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="285" text-anchor="middle">순환·겹침도 가능</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="410" text-anchor="middle">이름만으로 공격 확정 안 함</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">Execution · 무엇을 실행했나</text><text x="200.0" y="112.0" text-anchor="middle">셸·새 프로세스가 항상 필수는 아님</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">Persistence · 접근을 유지하나</text><text x="200.0" y="237.0" text-anchor="middle">설정과 재실행 근거를 구별</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">Discovery · 무엇을 알아봤나</text><text x="200.0" y="362.0" text-anchor="middle">계정 · 파일 · 서비스 · 구간</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">맥락 · 승인 · 실제 행위</text><text x="200.0" y="487.0" text-anchor="middle">목록의 순서 ≠ 모든 공격의 순서</text><text class="label" x="200" y="528" text-anchor="middle">아래: 학습 질문 순서</text><text class="label" x="200" y="548" text-anchor="middle">전술은 목적 · 기법은 방법 · 검증은 별도</text></svg>