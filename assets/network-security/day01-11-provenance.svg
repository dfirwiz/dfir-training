<svg xmlns="http://www.w3.org/2000/svg" width="400" height="550" viewBox="0 0 400 550" role="img" aria-labelledby="title desc"><title id="title">재배포와 독립 근거를 나누기</title><desc id="desc">화살표: 정보가 재배포되는 경로
중간 문서 수 ≠ 독립 관측 수</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="550" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">재배포와 독립 근거를 나누기</text><polyline points="165,128 165,175 100,175 100,225" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><polyline points="235,128 235,175 300,175 300,225" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><polyline points="100,293 100,350 165,350 165,400" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><polyline points="300,293 300,350 235,350 235,400" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">원출처 R-1</text><text x="200.0" y="112.0" text-anchor="middle">하나의 관측과 분석 자료</text><rect x="30" y="225" width="145" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="102.5" y="253.0" text-anchor="middle">피드 A</text><text x="102.5" y="277.0" text-anchor="middle">R-1 재배포</text><rect x="225" y="225" width="145" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="297.5" y="253.0" text-anchor="middle">피드 B</text><text x="297.5" y="277.0" text-anchor="middle">R-1 재배포</text><rect x="40" y="400" width="320" height="80" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="434.0" text-anchor="middle">같은 원출처로 돌아가 확인</text><text x="200.0" y="458.0" text-anchor="middle">독립된 추가 근거가 있는가?</text><text class="label" x="200" y="513" text-anchor="middle">화살표: 정보가 재배포되는 경로</text><text class="label" x="200" y="533" text-anchor="middle">중간 문서 수 ≠ 독립 관측 수</text></svg>