<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">TLS 판본에 따른 인증서 관측</title><desc id="desc">아래: 개념 순서 · 세부 메시지 생략
