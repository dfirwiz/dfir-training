<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">경로마다 관측 위치 확인하기</title><desc id="desc">세 경로는 각각 확인할 대상
같은 센서를 지난다고 가정하지 않음</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">경로마다 관측 위치 확인하기</text><polyline points="40,94 15,94 15,219 40,219" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><polyline points="40,94 15,94 15,344 40,344" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><polyline points="40,94 15,94 15,469 40,469" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">관측 요구</text><text x="200.0" y="112.0" text-anchor="middle">무슨 활동을 어디서 볼 수 있나?</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">인터넷 경로</text><text x="200.0" y="237.0" text-anchor="middle">직원 PC → 출구 → 외부 서비스</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">내부 경로</text><text x="200.0" y="362.0" text-anchor="middle">직원 구역 → 내부 자료 서버</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">회사 밖의 경로</text><text x="200.0" y="487.0" text-anchor="middle">원격 PC → 클라우드 서비스</text><text class="label" x="200" y="528" text-anchor="middle">세 경로는 각각 확인할 대상</text><text class="label" x="200" y="548" text-anchor="middle">같은 센서를 지난다고 가정하지 않음</text></svg>