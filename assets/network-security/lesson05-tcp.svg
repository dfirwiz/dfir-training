<svg xmlns="http://www.w3.org/2000/svg" width="400" height="900" viewBox="0 0 400 900" role="img" aria-labelledby="title"><title id="title">그림 4 · UDP 잘림 뒤의 TCP 조회</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#dceef1;font-size:16px}.label{font-size:14px;fill:#a4cfc9}.heading{font-size:18px;font-weight:700}</style><rect width="400" height="100%" rx="12" fill="#0e1927"/><text x="16" y="35" class="heading">그림 4 · UDP 잘림 뒤의 TCP 조회</text><rect x="30" y="75" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="106.5" text-anchor="middle" class="">39번 · UDP 질문</text><text x="200.0" y="129.5" text-anchor="middle" class="">large.example.org TXT</text><polyline points="200,151 200,205" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="205" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="236.5" text-anchor="middle" class="">40번 · UDP 응답</text><text x="200.0" y="259.5" text-anchor="middle" class="">TC=1 · 답 레코드 없음</text><polyline points="200,281 200,335" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="335" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="366.5" text-anchor="middle" class="">41~43번 · TCP 연결 수립</text><text x="200.0" y="389.5" text-anchor="middle" class="">SYN → SYN/ACK → ACK</text><polyline points="200,411 200,465" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="465" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="496.5" text-anchor="middle" class="">44번 · TCP DNS 질문</text><text x="200.0" y="519.5" text-anchor="middle" class="">길이 2바이트 + DNS 메시지</text><polyline points="200,541 200,595" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="595" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="626.5" text-anchor="middle" class="">45번 · TCP DNS 응답</text><text x="200.0" y="649.5" text-anchor="middle" class="">Training response over TCP.</text><polyline points="200,671 200,725" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="725" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="756.5" text-anchor="middle" class="">46번 · TCP 수신 확인</text><text x="200.0" y="779.5" text-anchor="middle" class="">DNS 본문은 없음</text><text x="200" y="850" text-anchor="middle" class="label">아래 방향: 시간 진행 · DNS는 UDP만이 아님</text></svg>