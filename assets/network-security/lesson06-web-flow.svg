<svg xmlns="http://www.w3.org/2000/svg" width="400" height="790" viewBox="0 0 400 790" role="img" aria-labelledby="title"><title id="title">그림 1 · 웹 동작의 단계와 증거</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#dceef1;font-size:16px}.label{font-size:14px;fill:#a4cfc9}.heading{font-size:18px;font-weight:700}</style><rect width="400" height="100%" rx="12" fill="#0e1927"/><text x="16" y="35" class="heading">그림 1 · 웹 동작의 단계와 증거</text><rect x="30" y="75" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="106.5" text-anchor="middle" class="">DNS · 주소 안내</text><text x="200.0" y="129.5" text-anchor="middle" class="">어디로 연결할지 확인</text><polyline points="200,151 200,205" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="205" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="236.5" text-anchor="middle" class="">연결과 통신 보호</text><text x="200.0" y="259.5" text-anchor="middle" class="">TCP+TLS 또는 QUIC 등</text><polyline points="200,281 200,335" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="335" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="366.5" text-anchor="middle" class="">HTTP 요청</text><text x="200.0" y="389.5" text-anchor="middle" class="">어느 자원에 무엇을 요청했는가</text><polyline points="200,411 200,465" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="465" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="496.5" text-anchor="middle" class="">HTTP 응답</text><text x="200.0" y="519.5" text-anchor="middle" class="">코드·헤더·본문을 무엇으로 받았는가</text><polyline points="200,541 200,595" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="595" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="626.5" text-anchor="middle" class="">클라이언트의 후속 처리</text><text x="200.0" y="649.5" text-anchor="middle" class="">화면 표시·저장·실행은 별도 단계</text><text x="200" y="725" text-anchor="middle" class="label">아래: 단순화한 진행 · 캐시·기존 연결은 생략 가능</text><text x="200" y="760" text-anchor="middle" class="label">한 단계의 성공 ≠ 다음 단계의 성공</text></svg>