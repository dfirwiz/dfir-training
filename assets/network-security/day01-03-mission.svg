<svg xmlns="http://www.w3.org/2000/svg" width="400" height="690" viewBox="0 0 400 690" role="img" aria-labelledby="title desc"><title id="title">업무 요구를 관측과 권한으로 연결</title><desc id="desc">아래: 요구사항을 구체화하는 순서
