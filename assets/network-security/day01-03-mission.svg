r="middle">인증 · 자료 변경 · 승인 기록</text><rect x="40" y="560" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="588.0" text-anchor="middle">대응 준비와 권한</text><text x="200.0" y="612.0" text-anchor="middle">누가 확인 · 결정 · 조치할까?</text><text class="label" x="200" y="653" text-anchor="middle">아래: 요구사항을 구체화하는 순서</text><text class="label" x="200" y="673" text-anchor="middle">변경 시 범위와 책임을 다시 확인</text></svg>