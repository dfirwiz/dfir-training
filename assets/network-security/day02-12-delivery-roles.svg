<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">메일 제출 · 중계 · 우편함 접근</title><desc id="desc">아래: 역할의 진행 · → 전송 · ↔ 접근
