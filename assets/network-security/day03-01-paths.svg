<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">서비스·클라이언트 경로 비교</title><desc id="desc">아래: 비교 순서 · 고정 공격 시간표 아님
데스크톱도 서비스 역할을 할 수 있음</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">서비스·클라이언트 경로 비교</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="160" text-anchor="middle">다른 입력 경로와 비교</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="285" text-anchor="middle">전달과 성공을 분리</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="410" text-anchor="middle">단말·서비스 기록 대조</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">서비스 쪽 처리 경로</text><text x="200.0" y="112.0" text-anchor="middle">도달 가능한 요청 → 처리 기능</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">클라이언트 쪽 처리 경로</text><text x="200.0" y="237.0" text-anchor="middle">파일·사이트 등 자료 → 해석 기능</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">둘 다 실제 조건을 확인</text><text x="200.0" y="362.0" text-anchor="middle">버전 · 설정 · 보호 · 실행 문맥</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">성공·재접근·사용자 행동</text><text x="200.0" y="487.0" text-anchor="middle">연결·파일 이름만으로 확정 안 함</text><text class="label" x="200" y="528" text-anchor="middle">아래: 비교 순서 · 고정 공격 시간표 아님</text><text class="label" x="200" y="548" text-anchor="middle">데스크톱도 서비스 역할을 할 수 있음</text></svg>