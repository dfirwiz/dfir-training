<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">사실에서 결론까지 근거 쌓기</title><desc id="desc">아래: 판단 순서
