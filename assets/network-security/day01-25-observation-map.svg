<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">업무에서 관측 범위로 연결하기</title><desc id="desc">아래: 질문과 근거의 연결
