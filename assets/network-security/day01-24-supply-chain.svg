<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">소프트웨어 공급의 확인 범위</title><desc id="desc">아래: 공급 과정의 방향
정상 서명 ≠ 모든 내용의 안전 보증</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">소프트웨어 공급의 확인 범위</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">결과물 생성</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">전달과 설치</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">실제 동작 조사</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">개발 · 구성 요소 · 빌드</text><text x="200.0" y="112.0" text-anchor="middle">결과물에 무엇이 들어갔나?</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">서명과 배포 경로</text><text x="200.0" y="237.0" text-anchor="middle">어떤 키 · 어떤 파일인가?</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">고객 환경의 설치 · 실행</text><text x="200.0" y="362.0" text-anchor="middle">판본 · 시각 · 실제 동작</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">후속 연결과 권한 · 자료</text><text x="200.0" y="487.0" text-anchor="middle">관측 범위와 실제 영향</text><text class="label" x="200" y="528" text-anchor="middle">아래: 공급 과정의 방향</text><text class="label" x="200" y="548" text-anchor="middle">정상 서명 ≠ 모든 내용의 안전 보증</text></svg>