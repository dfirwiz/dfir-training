<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">자료의 출처를 유지하며 대조하기</title><desc id="desc">아래: 조사 처리 순서 · 단위 바이트
JSON 보고는 PCAP에서 추출한 사실 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">자료의 출처를 유지하며 대조하기</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">지원 조건 안에서</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">같은 층을 비교</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">부족한 근거 명시</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">자체 PCAP · 직접 읽을 바이트</text><text x="200.0" y="112.0" text-anchor="middle">수집 범위 · 방향 · 지원 조건</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">HTTP 본문 복원 · 해시 계산</text><text x="200.0" y="237.0" text-anchor="middle">압축 본문35 · 원문15바이트</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">별도 가상 보고와 대조</text><text x="200.0" y="362.0" text-anchor="middle">문자열 일치 ≠ 단말 원본 검증</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">관측 · 가설 · 다음 근거 기록</text><text x="200.0" y="487.0" text-anchor="middle">전달 · 실행 · 영향은 별도 질문</text><text class="label" x="200" y="528" text-anchor="middle">아래: 조사 처리 순서 · 단위 바이트</text><text class="label" x="200" y="548" text-anchor="middle">JSON 보고는 PCAP에서 추출한 사실 아님</text></svg>