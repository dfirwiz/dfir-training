<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">인증 비밀의 보호 범위 질문</title><desc id="desc">아래: 보호 범위 검토 순서
모든 비밀이 같은 곳에 있다는 그림 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">인증 비밀의 보호 범위 질문</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="160" text-anchor="middle">보관 위치를 합치지 않기</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="285" text-anchor="middle">기본값과 실제 상태 구별</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="410" text-anchor="middle">한 기능을 전체 보증으로 안 함</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">어떤 비밀·저장 구조인가</text><text x="200.0" y="112.0" text-anchor="middle">세션 메모리 · 로컬 저장 · 앱</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">어떤 보호가 적용되나</text><text x="200.0" y="237.0" text-anchor="middle">LSA 보호 · Credential Guard 등</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">이 장치에서 실제 동작하나</text><text x="200.0" y="362.0" text-anchor="middle">버전 · 역할 · 요구 조건 · 정책</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">보호 밖의 위험도 확인</text><text x="200.0" y="487.0" text-anchor="middle">입력 · 앱 비밀 · 현재 권한 오용</text><text class="label" x="200" y="528" text-anchor="middle">아래: 보호 범위 검토 순서</text><text class="label" x="200" y="548" text-anchor="middle">모든 비밀이 같은 곳에 있다는 그림 아님</text></svg>