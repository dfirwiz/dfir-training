<svg xmlns="http://www.w3.org/2000/svg" width="400" height="750" viewBox="0 0 400 750" role="img" aria-labelledby="title"><title id="title">그림 3 · 조각에서 읽을 수 있는 본문까지</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#dceef1;font-size:16px}.label{font-size:14px;fill:#a4cfc9}.heading{font-size:18px;font-weight:700}</style><rect width="400" height="100%" rx="12" fill="#0e1927"/><text x="16" y="35" class="heading">그림 3 · 조각에서 읽을 수 있는 본문까지</text><text x="200" y="78" text-anchor="middle" class="label">필요한 복호화 자료를 확보한 상황을 가정</text><rect x="30" y="110" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="141.5" text-anchor="middle" class="">전송 데이터 재조립</text><text x="200.0" y="164.5" text-anchor="middle" class="">누락·순서·세션 범위 확인</text><polyline points="200,186 200,250" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="250" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="281.5" text-anchor="middle" class="">메시지 프레이밍 해석</text><text x="200.0" y="304.5" text-anchor="middle" class="">예: HTTP/1.1 청크 구분 제거</text><polyline points="200,326 200,390" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="390" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="421.5" text-anchor="middle" class="">Content-Encoding 처리</text><text x="200.0" y="444.5" text-anchor="middle" class="">예: gzip 압축 해제</text><polyline points="200,466 200,530" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="530" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="561.5" text-anchor="middle" class="">문자·콘텐츠 해석</text><text x="200.0" y="584.5" text-anchor="middle" class="">예: UTF-8로 HTML 읽기</text><text x="200" y="674" text-anchor="middle" class="label">도구가 이미 처리한 단계는 중복 적용하지 않기</text><text x="200" y="711" text-anchor="middle" class="label">압축 해제 후 크기 ≠ 압축된 전송 크기</text></svg>