<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">계산 결과와 사건 연결 구별</title><desc id="desc">아래: 비교 질문 순서 · 시간 단위 초
