<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">금전 목적 활동의 역할 연결</title><desc id="desc">아래: 가능한 역할 연결의 예
모든 사건의 필수 단계가 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">금전 목적 활동의 역할 연결</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">접근의 이전 가능</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">후속 활동 가능</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">증거와 범위 확인</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">최초 접근을 얻는 역할</text><text x="200.0" y="112.0" text-anchor="middle">계정 · 노출 서비스 · 유인</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">접근권을 넘기는 역할</text><text x="200.0" y="237.0" text-anchor="middle">중개 · 판매 · 다른 운영자</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">자료 탈취 · 암호화 · 협박</text><text x="200.0" y="362.0" text-anchor="middle">하나 또는 여러 역할 수행</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">각 단계의 관측을 따로 연결</text><text x="200.0" y="487.0" text-anchor="middle">같은 도구 ≠ 같은 운영자</text><text class="label" x="200" y="528" text-anchor="middle">아래: 가능한 역할 연결의 예</text><text class="label" x="200" y="548" text-anchor="middle">모든 사건의 필수 단계가 아님</text></svg>