<svg xmlns="http://www.w3.org/2000/svg" width="400" height="730" viewBox="0 0 400 730" role="img" aria-labelledby="title"><title id="title">그림 3 · 증거를 연결해도 남는 질문</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#dceef1;font-size:16px}.label{font-size:14px;fill:#a4cfc9}.heading{font-size:18px;font-weight:700}</style><rect width="400" height="100%" rx="12" fill="#0e1927"/><text x="16" y="35" class="heading">그림 3 · 증거를 연결해도 남는 질문</text><rect x="30" y="75" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="106.5" text-anchor="middle" class="">PCAP에서 읽은 내용</text><text x="200.0" y="129.5" text-anchor="middle" class="">TXT 질문 8행 · 고유 이름 6개</text><rect x="30" y="205" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="236.5" text-anchor="middle" class="">가상 단말 기록의 맥락</text><text x="200.0" y="259.5" text-anchor="middle" class="">같은 실행의 파일 읽기·질의</text><polyline points="200,151 200,205" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)"/><polyline points="200,281 200,360" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="360" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="391.5" text-anchor="middle" class="">조사 가설</text><text x="200.0" y="414.5" text-anchor="middle" class="">데이터 전송 목적이 있었을 가능성</text><polyline points="200,436 200,525" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="30" y="525" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83" stroke-dasharray="7 5"/><text x="200.0" y="556.5" text-anchor="middle" class="">별도 근거가 필요한 결론</text><text x="200.0" y="579.5" text-anchor="middle" class="">그 파일의 외부 수신·복원·유출 성공</text><text x="200" y="655" text-anchor="middle" class="label">실선: 자료 대조 · 점선: 추가 확인 필요</text><text x="200" y="690" text-anchor="middle" class="label">이번 PCAP의 내용은 무해한 학습 표식</text></svg>