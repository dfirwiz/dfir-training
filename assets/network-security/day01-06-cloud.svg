<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">클라우드에서 나누어 볼 질문</title><desc id="desc">아래: 자료를 함께 대조하는 흐름
모든 서비스가 같은 기록을 주지는 않음</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">클라우드에서 나누어 볼 질문</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="272" y="161" text-anchor="middle">다른 기록</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="272" y="286" text-anchor="middle">실행 맥락</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="272" y="411" text-anchor="middle">관련성 확인</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">관리 영역</text><text x="200.0" y="112.0" text-anchor="middle">누가 자원 · 권한 · 설정을 바꿨나?</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">자료 영역</text><text x="200.0" y="237.0" text-anchor="middle">누가 어떤 객체를 읽고 썼나?</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">애플리케이션 · 함수 실행</text><text x="200.0" y="362.0" text-anchor="middle">어떤 요청을 받아 무엇을 했나?</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">식별자와 수집 범위를 대조</text><text x="200.0" y="487.0" text-anchor="middle">계정 · 자원 · 시간 · 요청</text><text class="label" x="200" y="528" text-anchor="middle">아래: 자료를 함께 대조하는 흐름</text><text class="label" x="200" y="548" text-anchor="middle">모든 서비스가 같은 기록을 주지는 않음</text></svg>