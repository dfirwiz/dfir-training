<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">성공과 도메인 정렬을 함께 확인</title><desc id="desc">아래: 비교 질문 순서 · 둘 다 필수 아님
엄격 계산은 완화 · 정책 발견을 구현 안 함</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">성공과 도메인 정렬을 함께 확인</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">SPF 경로 확인</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">DKIM 경로도 확인</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">수신 조치와 구별</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">메시지 From · 작성자 도메인</text><text x="200.0" y="112.0" text-anchor="middle">sender.example · 가상 기준</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">S: SPF 성공 그리고 정렬</text><text x="200.0" y="237.0" text-anchor="middle">봉투 신원의 도메인과 비교</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">D: DKIM 성공 그리고 정렬</text><text x="200.0" y="362.0" text-anchor="middle">여러 서명 중 기여 경로 확인</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">정상 평가라면 S 또는 D</text><text x="200.0" y="487.0" text-anchor="middle">DNS 오류 · 근거 미확인은 별도</text><text class="label" x="200" y="528" text-anchor="middle">아래: 비교 질문 순서 · 둘 다 필수 아님</text><text class="label" x="200" y="548" text-anchor="middle">엄격 계산은 완화 · 정책 발견을 구현 안 함</text></svg>