<svg xmlns="http://www.w3.org/2000/svg" width="400" height="590" viewBox="0 0 400 590" role="img" aria-labelledby="title"><title id="title">그림 2 · TTL 300초의 기본 캐시 시간선</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#dceef1;font-size:16px}.title{font-size:18px;font-weight:700}.label{font-size:14px;fill:#96cfc5}</style><rect width="400" height="100%" rx="12" fill="#0e1927"/><text class="title" x="17" y="34">그림 2 · TTL 300초의 기본 캐시 시간선</text><rect x="20" y="80" width="360" height="82" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="115.5" text-anchor="middle" class="">처음 응답 · 경과 0초</text><text x="200.0" y="138.5" text-anchor="middle" class="">TTL 300초</text><polyline points="200,162 200,250" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="250" width="360" height="82" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="285.5" text-anchor="middle" class="">같은 질문 · 경과 120초</text><text x="200.0" y="308.5" text-anchor="middle" class="">남은 TTL 180초 · 캐시로 응답</text><polyline points="200,332 200,420" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="420" width="360" height="82" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="455.5" text-anchor="middle" class="">경과 300초 · 기본 만료 시점</text><text x="200.0" y="478.5" text-anchor="middle" class="">새 조회 등 갱신 필요</text><text x="200" y="550.0" text-anchor="middle" class="label">단위: 초 · 정책·사전 갱신·serve-stale는 별도</text></svg>