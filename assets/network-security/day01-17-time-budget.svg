<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">가상 작업 시간의 계산 범위</title><desc id="desc">단위: 초 · 자체 가정의 계산
