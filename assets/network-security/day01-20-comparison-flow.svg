<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">가상 이름 자료 비교의 범위</title><desc id="desc">아래: 자체 로컬 비교 순서
