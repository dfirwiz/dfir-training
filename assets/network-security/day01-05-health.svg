<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">기록 중단을 원인과 구별하기</title><desc id="desc">아래: 조사 순서 · 자체 가상 사례
각 관측 지점도 장애와 손실이 가능</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">기록 중단을 원인과 구별하기</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="272" y="161" text-anchor="middle">대안 검토</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="272" y="286" text-anchor="middle">범위 보완</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="272" y="411" text-anchor="middle">원인 검증</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">관측 · 단말 보고가 끊김</text><text x="200.0" y="112.0" text-anchor="middle">수집 시각과 범위를 먼저 기록</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">다른 설명 확인</text><text x="200.0" y="237.0" text-anchor="middle">전원 · 전송 · 장애 · 정상 변경</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">독립된 근거 대조</text><text x="200.0" y="362.0" text-anchor="middle">중앙 상태 · 네트워크 · 서버</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">가설과 추가 확인 결정</text><text x="200.0" y="487.0" text-anchor="middle">침해 · 방해를 중단만으로 확정 X</text><text class="label" x="200" y="528" text-anchor="middle">아래: 조사 순서 · 자체 가상 사례</text><text class="label" x="200" y="548" text-anchor="middle">각 관측 지점도 장애와 손실이 가능</text></svg>