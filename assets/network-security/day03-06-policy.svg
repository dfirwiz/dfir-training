<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">출구의 조건과 실제 판정 구별</title><desc id="desc">아래: 조사 질문의 순서
가상 허용 목록은 실제 방화벽 판정기 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">출구의 조건과 실제 판정 구별</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="160" text-anchor="middle">역할별 경로 확인</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="285" text-anchor="middle">포트만으로 정체 확정 안 함</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="410" text-anchor="middle">미확인과 차단 결과 구별</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">출발 역할과 목적지</text><text x="200.0" y="112.0" text-anchor="middle">직원 단말 · 프록시 · 메일 릴레이</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">전송 조건과 포트</text><text x="200.0" y="237.0" text-anchor="middle">이 연습의 TCP · 8080 / 443 / 25</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">애플리케이션·업무 맥락</text><text x="200.0" y="362.0" text-anchor="middle">주장 · 실제 프로토콜 · 계정 · 승인</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">정책 비교와 실제 결과</text><text x="200.0" y="487.0" text-anchor="middle">목록 일치 ≠ 허용·무해·반출 성공</text><text class="label" x="200" y="528" text-anchor="middle">아래: 조사 질문의 순서</text><text class="label" x="200" y="548" text-anchor="middle">가상 허용 목록은 실제 방화벽 판정기 아님</text></svg>