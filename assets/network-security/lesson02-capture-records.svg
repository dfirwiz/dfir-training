<svg xmlns="http://www.w3.org/2000/svg" width="400" height="650" viewBox="0 0 400 650" role="img" aria-labelledby="title"><title id="title">그림 1 · 같은 통신, 세 종류의 기록</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#71e3c0"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#c3d7e7;font-size:16px}.title{font-size:19px;font-weight:700;fill:#e7f4ff}.node{font-size:17px;font-weight:700;fill:#e6f5ff}.small{font-size:13px}.label{font-size:14px;fill:#83dfcc}</style><rect width="400" height="100%" rx="12" fill="#0c1522"/><text class="title" x="20" y="39">그림 1 · 같은 통신, 세 종류의 기록</text><rect x="55" y="70" width="310" height="60" rx="11" fill="#15312f" stroke="#4c7c83"/><text x="210.0" y="106.0" text-anchor="middle" class="node">관측 지점을 지나는 통신</text><polyline points="55,100 30,100 30,525" fill="none" stroke="#71e3c0" stroke-width="2"/><polyline points="30,225 70,225" fill="none" stroke="#71e3c0" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="168.0" text-anchor="middle" class="label">장비가 통신을 요약해 전송</text><rect x="70" y="185" width="305" height="83" rx="11" fill="#15312f" stroke="#4c7c83"/><text x="222.5" y="214.0" text-anchor="middle" class="node">플로 요약</text><text x="222.5" y="247.0" text-anchor="middle" class="" style="font-size:15px">주소·포트·시간·양</text><polyline points="30,375 70,375" fill="none" stroke="#71e3c0" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="318.0" text-anchor="middle" class="label">센서가 패킷을 해석해 기록</text><rect x="70" y="335" width="305" height="83" rx="11" fill="#15312f" stroke="#4c7c83"/><text x="222.5" y="364.0" text-anchor="middle" class="node">애플리케이션 메타데이터</text><text x="222.5" y="397.0" text-anchor="middle" class="" style="font-size:15px">DNS 질문·HTTP 요청 등의 필드</text><polyline points="30,525 70,525" fill="none" stroke="#71e3c0" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="468.0" text-anchor="middle" class="label">센서가 패킷을 파일로 저장</text><rect x="70" y="485" width="305" height="83" rx="11" fill="#15312f" stroke="#4c7c83"/><text x="222.5" y="514.0" text-anchor="middle" class="node">패킷 원본</text><text x="222.5" y="547.0" text-anchor="middle" class="" style="font-size:15px">캡처한 패킷 바이트와 시간</text><text x="200" y="621.0" text-anchor="middle" class="small">화살표: 자료 생성 경로 · 세 자료는 별도 산출물</text></svg>