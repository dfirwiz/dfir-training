<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">조건에서 대응 판단으로</title><desc id="desc">아래: 조사 질문의 순서
