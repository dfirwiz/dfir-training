<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">통신에서 단말의 행위로 연결하기</title><desc id="desc">아래: 조사 순서 · 자동 인과 확정 아님
암호화된 통신도 단말 기록이 필요할 수 있음</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">통신에서 단말의 행위로 연결하기</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="160" text-anchor="middle">전달 ≠ 실행</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="285" text-anchor="middle">이름 ≠ 실제 권한</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="410" text-anchor="middle">근거가 있는 범위만</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">네트워크에서 관측한 사실</text><text x="200.0" y="112.0" text-anchor="middle">주소 · 시간 · 전달 바이트</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">어떤 프로세스와 사용자인가</text><text x="200.0" y="237.0" text-anchor="middle">단말 · 서버의 기록 대조</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">실제로 어떤 문맥으로 실행됐나</text><text x="200.0" y="362.0" text-anchor="middle">토큰 · 권한 · 보호 경계</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">무엇을 읽고 바꾸고 접근했나</text><text x="200.0" y="487.0" text-anchor="middle">성공 · 영향 · 승인은 별도</text><text class="label" x="200" y="528" text-anchor="middle">아래: 조사 순서 · 자동 인과 확정 아님</text><text class="label" x="200" y="548" text-anchor="middle">암호화된 통신도 단말 기록이 필요할 수 있음</text></svg>