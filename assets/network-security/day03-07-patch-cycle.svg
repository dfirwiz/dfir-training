<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">패치 배포와 실제 활성·검증</title><desc id="desc">아래: 운영 확인 순서 · 설치 명령 아님
