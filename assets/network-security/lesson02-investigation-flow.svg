<svg xmlns="http://www.w3.org/2000/svg" width="400" height="755" viewBox="0 0 400 755" role="img" aria-labelledby="title"><title id="title">그림 3 · 요약에서 증거로 내려가는 조사</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#71e3c0"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#c3d7e7;font-size:16px}.title{font-size:19px;font-weight:700;fill:#e7f4ff}.node{font-size:17px;font-weight:700;fill:#e6f5ff}.small{font-size:13px}.label{font-size:14px;fill:#83dfcc}</style><rect width="400" height="100%" rx="12" fill="#0c1522"/><text class="title" x="20" y="39">그림 3 · 요약에서 증거로 내려가는 조사</text><rect x="20" y="75" width="360" height="91" rx="11" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="104.0" text-anchor="middle" class="node">① 플로 요약</text><text x="200.0" y="137.0" text-anchor="middle" class="" style="font-size:15px">누가 누구와, 언제, 얼마나 통신했나?</text><polyline points="200,166 200,225" fill="none" stroke="#71e3c0" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="225" width="360" height="91" rx="11" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="254.0" text-anchor="middle" class="node">② 애플리케이션 기록</text><text x="200.0" y="287.0" text-anchor="middle" class="" style="font-size:15px">어떤 요청과 응답을 해석했나?</text><polyline points="200,316 200,375" fill="none" stroke="#71e3c0" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="375" width="360" height="91" rx="11" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="404.0" text-anchor="middle" class="node">③ 관련 패킷 원본</text><text x="200.0" y="437.0" text-anchor="middle" class="" style="font-size:15px">당시 수집한 바이트가 무엇인가?</text><polyline points="200,466 200,525" fill="none" stroke="#71e3c0" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="525" width="360" height="91" rx="11" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="554.0" text-anchor="middle" class="node">④ 단말·서버 기록</text><text x="200.0" y="587.0" text-anchor="middle" class="" style="font-size:15px">어떤 프로그램이 실행·저장했나?</text><text x="200" y="676.0" text-anchor="middle" class="" style="font-size:14px">화살표: 조사 자료를 연결하는 순서</text><text x="200" y="714.0" text-anchor="middle" class="small">연결 기준: 시간 · 주소·포트 · 센서 · 연결 식별자</text></svg>