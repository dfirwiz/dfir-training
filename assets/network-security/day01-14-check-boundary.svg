<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">형식 · 사실 · 허용을 구분하기</title><desc id="desc">아래: 확인해야 할 다음 질문
