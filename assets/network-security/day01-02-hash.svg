<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">파일 내용과 해시의 비교</title><desc id="desc">아래: 복사 · 변경 · 비교 순서
해시는 안전성 판정과 별개</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">파일 내용과 해시의 비교</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">내용 동일 확인</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="270" y="286" text-anchor="middle">의도한 변경</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">내용 차이 확인</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">직접 만든 텍스트</text><text x="200.0" y="112.0" text-anchor="middle">원본 내용과 SHA-256 기록</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">바이트를 그대로 복사</text><text x="200.0" y="237.0" text-anchor="middle">사본의 해시와 비교</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">작업 대상에 내용 추가</text><text x="200.0" y="362.0" text-anchor="middle">변경한 명령과 시각 기록</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">변경 후 해시 다시 비교</text><text x="200.0" y="487.0" text-anchor="middle">원래 사본은 비교용으로 보존</text><text class="label" x="200" y="528" text-anchor="middle">아래: 복사 · 변경 · 비교 순서</text><text class="label" x="200" y="548" text-anchor="middle">해시는 안전성 판정과 별개</text></svg>