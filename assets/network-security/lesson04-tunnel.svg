<svg xmlns="http://www.w3.org/2000/svg" width="400" height="810" viewBox="0 0 400 810" role="img" aria-labelledby="title"><title id="title">그림 3 · 승인 DNS를 경유하는 터널</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#dceef1;font-size:16px}.label{font-size:14px;fill:#a4cfc9}.heading{font-size:18px;font-weight:700}</style><rect width="400" height="100%" rx="12" fill="#0e1927"/><text x="18" y="35" class="heading">그림 3 · 승인 DNS를 경유하는 터널</text><rect x="30" y="80" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200" y="111.5" text-anchor="middle" class="">단말의 프로그램</text><text x="200" y="134.5" text-anchor="middle" class="">192.0.2.25</text><path d="M200 156V180 M200 265V315" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="200" y="207" text-anchor="middle" class="label">질문 ↓ 데이터 조각을 이름에 표현</text><text x="200" y="242" text-anchor="middle" class="label">응답 ↑ 레코드 데이터로 회신</text><rect x="30" y="315" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200" y="346.5" text-anchor="middle" class="">승인 리졸버</text><text x="200" y="369.5" text-anchor="middle" class="">질의를 권한 서버로 전달</text><path d="M200 391V415 M200 500V550" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="200" y="444" text-anchor="middle" class="label">새 이름이면 캐시로 답하지 못할 수 있음</text><text x="200" y="477" text-anchor="middle" class="label">이름·종류·정책에 따라 동작이 달라짐</text><rect x="30" y="550" width="340" height="76" rx="10" fill="#15312f" stroke="#4c7c83"/><text x="200" y="581.5" text-anchor="middle" class="">터널 운영자의 권한 서버</text><text x="200" y="604.5" text-anchor="middle" class="">collect.example.net</text><text x="200" y="688" text-anchor="middle" class="label">양방향 화살표: 질문·응답</text><text x="200" y="724" text-anchor="middle" class="label">직접 외부 DNS만 막아서는 충분하지 않음</text><text x="200" y="760" text-anchor="middle" class="label">외부 서버에 직접 질문하는 별도 경로도 가능</text></svg>