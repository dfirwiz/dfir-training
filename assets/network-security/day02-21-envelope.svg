<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">ICMP의 바깥과 안쪽을 나누기</title><desc id="desc">아래: 구조를 읽는 순서
Echo와 오류는 서로 다른 메시지 종류</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">ICMP의 바깥과 안쪽을 나누기</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="160" text-anchor="middle">바깥부터 읽기</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="285" text-anchor="middle">Echo인 경우</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="410" text-anchor="middle">오류인 경우의 다른 구조</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">Ethernet · IPv4 헤더</text><text x="200.0" y="112.0" text-anchor="middle">IPv4 Protocol 값 1 → ICMP</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">ICMP 형식 · 코드 · 체크섬</text><text x="200.0" y="237.0" text-anchor="middle">Echo와 오류는 몸통이 다름</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">Echo: 식별자 · 순서 번호 · 자료</text><text x="200.0" y="362.0" text-anchor="middle">요청과 응답의 내용 비교</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">오류: 원래 패킷 일부 인용</text><text x="200.0" y="487.0" text-anchor="middle">인용 UDP 포트 ≠ ICMP 포트</text><text class="label" x="200" y="528" text-anchor="middle">아래: 구조를 읽는 순서</text><text class="label" x="200" y="548" text-anchor="middle">Echo와 오류는 서로 다른 메시지 종류</text></svg>