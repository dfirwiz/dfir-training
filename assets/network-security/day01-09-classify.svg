<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">사건을 나누어 설명하는 질문</title><desc id="desc">네 관점: 시간 순서 · 단계 아님
미확인을 영향 없음으로 채우지 않음</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">사건을 나누어 설명하는 질문</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">Actor · 행위자</text><text x="200.0" y="112.0" text-anchor="middle">누구의 행동이 영향을 주었나?</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">Action · 행동</text><text x="200.0" y="237.0" text-anchor="middle">어떤 활동이 영향을 주었나?</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">Asset · 자산</text><text x="200.0" y="362.0" text-anchor="middle">무엇이 영향을 받았나?</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">Attribute · 보안 성질</text><text x="200.0" y="487.0" text-anchor="middle">어떤 성질이 영향을 받았나?</text><text class="label" x="200" y="528" text-anchor="middle">네 관점: 시간 순서 · 단계 아님</text><text class="label" x="200" y="548" text-anchor="middle">미확인을 영향 없음으로 채우지 않음</text></svg>