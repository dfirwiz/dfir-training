<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">이름·표지·바이트 지문 구별</title><desc id="desc">아래: 증거를 대조하는 순서
참조 문장은 무해한 자체 자료</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">이름·표지·바이트 지문 구별</text><polyline points="70,128 70,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="160" text-anchor="middle">이름만으로 동일성 확정 안 함</text><polyline points="70,253 70,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="285" text-anchor="middle">분류 표지와 파일 신원 분리</text><polyline points="70,378 70,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="410" text-anchor="middle">미확인 해시는 한 파일로 합치지 않음</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">파일 이름과 경로</text><text x="200.0" y="112.0" text-anchor="middle">같은 이름에 다른 내용 가능</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">제품의 탐지 분류 표지</text><text x="200.0" y="237.0" text-anchor="middle">같은 자료에 다른 이름도 가능</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">실제 바이트의 SHA-256</text><text x="200.0" y="362.0" text-anchor="middle">대상·표현·길이·출처 확인</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">기록·행위·조치와 연결</text><text x="200.0" y="487.0" text-anchor="middle">지문 일치 ≠ 악성·실행·승인</text><text class="label" x="200" y="528" text-anchor="middle">아래: 증거를 대조하는 순서</text><text class="label" x="200" y="548" text-anchor="middle">참조 문장은 무해한 자체 자료</text></svg>