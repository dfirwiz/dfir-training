<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">서버 응답과 수집 자료의 차이</title><desc id="desc">아래: 비교 순서 · 단위: 바이트
참조는 별도 자체 자료 · 실제 서버 파일 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">서버 응답과 수집 자료의 차이</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">응답과 바이트 비교</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">동일한 참조는 15바이트</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">수집 한계를 남기기</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">두 파일에 서버 226 응답 존재</text><text x="200.0" y="112.0" text-anchor="middle">전송 완료를 보고한 가상 메시지</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">완전한 자체 파일 · 13프레임</text><text x="200.0" y="237.0" text-anchor="middle">데이터 15바이트 · 참조와 일치</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">후반 누락 파일 · 12프레임</text><text x="200.0" y="362.0" text-anchor="middle">관측 9바이트 · 참조보다 6 부족</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">누락 파일의 참조 일치는 null</text><text x="200.0" y="487.0" text-anchor="middle">실제 서버 실패를 확정하지 않음</text><text class="label" x="200" y="528" text-anchor="middle">아래: 비교 순서 · 단위: 바이트</text><text class="label" x="200" y="548" text-anchor="middle">참조는 별도 자체 자료 · 실제 서버 파일 아님</text></svg>