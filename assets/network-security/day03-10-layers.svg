<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">백신의 서로 다른 관측 근거</title><desc id="desc">아래: 관측 관점의 구별
실제 백신·검체·클라우드 제출 시험 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">백신의 서로 다른 관측 근거</text><polyline points="70,128 70,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="160" text-anchor="middle">파일 이름만으로 단정 안 함</text><polyline points="70,253 70,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="285" text-anchor="middle">메모리 기반 ≠ 항상 안 보임</text><polyline points="70,378 70,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="410" text-anchor="middle">모든 제품의 고정 순서 아님</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">알려진 특징과 자료 구조</text><text x="200.0" y="112.0" text-anchor="middle">시그니처 · 해시와 같은 뜻 아님</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">실행 중 행동과 관계</text><text x="200.0" y="237.0" text-anchor="middle">프로세스·파일·서비스 문맥</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">검사 연결과 클라우드 분석</text><text x="200.0" y="362.0" text-anchor="middle">지원 앱·공급자·정책·전송 범위</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">탐지·조치·후속 결과 확인</text><text x="200.0" y="487.0" text-anchor="middle">기법 이름만으로 완전 탐지 보장 안 함</text><text class="label" x="200" y="528" text-anchor="middle">아래: 관측 관점의 구별</text><text class="label" x="200" y="548" text-anchor="middle">실제 백신·검체·클라우드 제출 시험 아님</text></svg>