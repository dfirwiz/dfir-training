<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">파일 점검과 사람의 검토</title><desc id="desc">아래: 점검 순서 · 실제 종결 아님
