<svg xmlns="http://www.w3.org/2000/svg" width="400" height="610" viewBox="0 0 400 610" role="img" aria-labelledby="title desc"><title id="title">호스트 자원 위에서 동작하는 VM</title><desc id="desc">화살표: 구성 관계와 설정 확인
