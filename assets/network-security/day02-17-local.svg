<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">로컬 포워딩 · 가상 역할</title><desc id="desc">아래: 가상 데이터 경로 · 주소는 문서용
