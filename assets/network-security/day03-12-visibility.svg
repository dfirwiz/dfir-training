<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">정기 관측 사이의 변화</title><desc id="desc">끝 상태 일치 ≠ 중간 변화 없음
실제 제품의 손실 여부 시험 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">정기 관측 사이의 변화</text><polyline points="70,128 70,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="160" text-anchor="middle">아래: 시간 흐름 · 단위: 분</text><polyline points="70,253 70,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="285" text-anchor="middle">15분 = 900초 관측 간격</text><polyline points="70,378 70,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="410" text-anchor="middle">이벤트 감시의 실제 상태는 별도</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">10:00 · 정기 관측</text><text x="200.0" y="112.0" text-anchor="middle">상태 A를 기록</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">10:05 · 가상 변경</text><text x="200.0" y="237.0" text-anchor="middle">상태 B · 이때 정기 관측 없음</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">10:10 · 가상 원상 복구</text><text x="200.0" y="362.0" text-anchor="middle">다시 상태 A</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">10:15 · 다음 정기 관측</text><text x="200.0" y="487.0" text-anchor="middle">같은 A여도 중간 변화는 별개</text><text class="label" x="200" y="528" text-anchor="middle">끝 상태 일치 ≠ 중간 변화 없음</text><text class="label" x="200" y="548" text-anchor="middle">실제 제품의 손실 여부 시험 아님</text></svg>