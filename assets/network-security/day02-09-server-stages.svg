<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">서버 공격 시도와 실행 증거</title><desc id="desc">아래: 조사 질문의 확장
