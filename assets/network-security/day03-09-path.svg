<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">가상 내부 요청과 통제 지점</title><desc id="desc">아래: 이 가상 배치의 요청 방향
다른 배치는 내부 네트워크 통제를 거칠 수 있음</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">가상 내부 요청과 통제 지점</text><polyline points="70,128 70,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="160" text-anchor="middle">요청 후보 방향 ↓</text><polyline points="70,253 70,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="285" text-anchor="middle">실제 통과 경로를 확인</text><polyline points="70,378 70,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="410" text-anchor="middle">연결 판정 ≠ 자료 접근 성공</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">직원 단말 A · 192.0.2.25</text><text x="200.0" y="112.0" text-anchor="middle">요청 출발 · 단말 측 기록</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">같은 내부망의 스위치</text><text x="200.0" y="237.0" text-anchor="middle">이 배치는 인터넷 경계 경유 안 함</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">대상 B의 단말 방화벽</text><text x="200.0" y="362.0" text-anchor="middle">정책·실행·허용·차단·기록</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">서버 B · 192.0.2.60</text><text x="200.0" y="487.0" text-anchor="middle">TCP445 · 인증·동작 결과는 별도</text><text class="label" x="200" y="528" text-anchor="middle">아래: 이 가상 배치의 요청 방향</text><text class="label" x="200" y="548" text-anchor="middle">다른 배치는 내부 네트워크 통제를 거칠 수 있음</text></svg>