<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">두 가설에 필요한 근거</title><desc id="desc">아래: 조사 질문 순서 · 두 공격의 연쇄 아님
인증된 도구도 승인된 사용인지 별도 확인</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">두 가설에 필요한 근거</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">가설을 나누기</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">다른 설명도 확인</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">관측 위치와 연결</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">다른 단말로의 접근 관측</text><text x="200.0" y="112.0" text-anchor="middle">공유 자격증명 · 취약점 등 후보</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">자격증명 사용 가설</text><text x="200.0" y="237.0" text-anchor="middle">인증 · 권한 · 서비스/프로세스</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">취약점 악용 가설</text><text x="200.0" y="362.0" text-anchor="middle">버전 · 패치 · 요청 · 후속 영향</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">업무 승인 · 범위 · 반증 연결</text><text x="200.0" y="487.0" text-anchor="middle">445 하나로 경로/침해 확정 안 함</text><text class="label" x="200" y="528" text-anchor="middle">아래: 조사 질문 순서 · 두 공격의 연쇄 아님</text><text class="label" x="200" y="548" text-anchor="middle">인증된 도구도 승인된 사용인지 별도 확인</text></svg>