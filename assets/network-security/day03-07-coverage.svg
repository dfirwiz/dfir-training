<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">가상 여섯 자산의 완료 조건</title><desc id="desc">아래: 가상 입력의 집계 순서
빈 목록은 분모0 · 비율 미확인</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">가상 여섯 자산의 완료 조건</text><polyline points="70,128 70,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="160" text-anchor="middle">단위: 자산 수</text><polyline points="70,253 70,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="285" text-anchor="middle">신선도: 0 ≤ 경과 초 &lt; 86400</text><polyline points="70,378 70,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="410" text-anchor="middle">거짓 ≠ 실제 취약 확정</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">분모: 선언한 전체 자산 6개</text><text x="200.0" y="112.0" text-anchor="middle">설치·활성·사후 검사·시각</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">조건 참 2개: P1 · P5</text><text x="200.0" y="237.0" text-anchor="middle">입력 주장이 모형 조건에 맞음</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">거짓 2개 · 미확인 2개</text><text x="200.0" y="362.0" text-anchor="middle">P2·P4 / P3·P6를 구별</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">확인 비율 2 / 6 = 1 / 3</text><text x="200.0" y="487.0" text-anchor="middle">약 33.3% · 실제 패치 성공률 아님</text><text class="label" x="200" y="528" text-anchor="middle">아래: 가상 입력의 집계 순서</text><text class="label" x="200" y="548" text-anchor="middle">빈 목록은 분모0 · 비율 미확인</text></svg>