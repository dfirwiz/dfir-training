<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">기준과 승인과 침해 판단 나누기</title><desc id="desc">아래: 조사 순서
