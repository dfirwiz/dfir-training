<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">쿠키의 방향과 의미를 나누기</title><desc id="desc">아래: 대화와 확인의 연결
방향은 각 상자의 → 표시 참고</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">쿠키의 방향과 의미를 나누기</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">저장 · 조건 확인</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">무엇을 담았나?</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">추가 증거</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">서버 → 클라이언트 응답</text><text x="200.0" y="112.0" text-anchor="middle">Set-Cookie · 상태 값 전달</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">적용 조건에 맞는 후속 요청</text><text x="200.0" y="237.0" text-anchor="middle">Cookie · 클라이언트 → 서버</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">응용 의미 · 생성 주체 대조</text><text x="200.0" y="362.0" text-anchor="middle">정상 상태 · 자료 교환 · 오용</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">로그 범위와 단말 근거 확인</text><text x="200.0" y="487.0" text-anchor="middle">값 존재와 C2 판정은 별도</text><text class="label" x="200" y="528" text-anchor="middle">아래: 대화와 확인의 연결</text><text class="label" x="200" y="548" text-anchor="middle">방향은 각 상자의 → 표시 참고</text></svg>