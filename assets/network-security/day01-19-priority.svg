<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">이름보다 확인된 영향부터</title><desc id="desc">아래: 판단에 필요한 확인 순서
유명한 이름만으로 피해 확정 안 함</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">이름보다 확인된 영향부터</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">맥락 대조</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">추론 구별</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">우선순위 갱신</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">자산과 정상 업무 이해</text><text x="200.0" y="112.0" text-anchor="middle">누가 · 무엇을 · 왜 사용하나</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">실제 관측과 영향 범위</text><text x="200.0" y="237.0" text-anchor="middle">권한 · 자료 · 처리 · 서비스</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">지지하는 가설과 미확인</text><text x="200.0" y="362.0" text-anchor="middle">행위자 · 목적 · 다른 경로</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">영향 완화와 다음 증거</text><text x="200.0" y="487.0" text-anchor="middle">담당자 · 권한 · 검증 기록</text><text class="label" x="200" y="528" text-anchor="middle">아래: 판단에 필요한 확인 순서</text><text class="label" x="200" y="548" text-anchor="middle">유명한 이름만으로 피해 확정 안 함</text></svg>