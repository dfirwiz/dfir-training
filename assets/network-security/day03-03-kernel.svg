<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">구성 문제와 커널 문제 구별</title><desc id="desc">아래: 검증 순서 · 고정 공격 절차 아님
근본 수정과 도구 제한 정책은 구별</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">구성 문제와 커널 문제 구별</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="160" text-anchor="middle">다른 원인도 비교</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="285" text-anchor="middle">버전 숫자만 보지 않기</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="410" text-anchor="middle">사건 시점의 근거 대조</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">높은 권한 결과의 원인은</text><text x="200.0" y="112.0" text-anchor="middle">정상 승인 · 구성 · 인증 · 취약점</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">커널 후보라면 적용 조건</text><text x="200.0" y="237.0" text-anchor="middle">정확한 빌드 · 코드 · 수정 상태</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">사건 당시 실행 조건</text><text x="200.0" y="362.0" text-anchor="middle">접근 · 실행 · 보호 · 관측 범위</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">성공 근거와 남는 한계</text><text x="200.0" y="487.0" text-anchor="middle">현재 설정 ≠ 과거 사건의 증명</text><text class="label" x="200" y="528" text-anchor="middle">아래: 검증 순서 · 고정 공격 절차 아님</text><text class="label" x="200" y="548" text-anchor="middle">근본 수정과 도구 제한 정책은 구별</text></svg>