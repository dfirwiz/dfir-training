<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">조사 기록에 남길 네 가지</title><desc id="desc">아래: 조사 질문을 구체화
