<svg xmlns="http://www.w3.org/2000/svg" width="400" height="625" viewBox="0 0 400 625" role="img" aria-labelledby="title"><title id="title">그림 2 · Wireshark의 세 가지 보기</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#71e3c0"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#c3d7e7;font-size:16px}.title{font-size:19px;font-weight:700;fill:#e7f4ff}.node{font-size:17px;font-weight:700;fill:#e6f5ff}.small{font-size:13px}.label{font-size:14px;fill:#83dfcc}</style><rect width="400" height="100%" rx="12" fill="#0c1522"/><text class="title" x="20" y="39">그림 2 · Wireshark의 세 가지 보기</text><rect x="20" y="75" width="360" height="105" rx="11" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="104.0" text-anchor="middle" class="node">① 패킷 목록</text><text x="200.0" y="125.0" text-anchor="middle" class="" style="font-size:15px">한 줄은 캡처한 패킷 기록 하나</text><text x="200.0" y="149.0" text-anchor="middle" class="" style="font-size:15px">시간 · 출발지 · 목적지 · 프로토콜</text><polyline points="200,180 200,235" fill="none" stroke="#71e3c0" stroke-width="2" marker-end="url(#arrow)"/><text x="285" y="214.0" text-anchor="middle" class="label">패킷 선택</text><rect x="20" y="235" width="360" height="120" rx="11" fill="#15312f" stroke="#4c7c83"/><text x="200.0" y="264.0" text-anchor="middle" class="node">② 패킷 상세</text><text x="200.0" y="285.0" text-anchor="middle" class="" style="font-size:15px">선택한 패킷을 필드로 해석</text><text x="200.0" y="309.0" text-anchor="middle" class="" style="font-size:15px">Frame → Ethernet → IP → TCP → HTTP</text><polyline points="200,355 200,410" fill="none" stroke="#71e3c0" stroke-width="2" marker-end="url(#arrow)"/><text x="285" y="391.0" text-anchor="middle" class="label">필드 선택</text><rect x="20" y="410" width="360" height="115" rx="11" fill="#192a40" stroke="#4c7c83"/><text x="200.0" y="439.0" text-anchor="middle" class="node">③ 패킷 바이트</text><text x="200.0" y="460.0" text-anchor="middle" class="" style="font-size:15px">예: G E T에 해당하는 값</text><text x="200.0" y="484.0" text-anchor="middle" class="" style="font-size:15px">16진수 47 45 54</text><text x="200" y="576.0" text-anchor="middle" class="" style="font-size:14px">화살표: 선택에 따른 보기의 연결</text><text x="200" y="604.0" text-anchor="middle" class="small">실제 도구 화면이 아닌 설명용 구성도</text></svg>