<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">수정·제한·격리의 보호 질문</title><desc id="desc">아래: 방어 검토 순서 · 공격 시간표 아님
개별 통제의 범위와 현재 지원을 확인</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">수정·제한·격리의 보호 질문</text><polyline points="70,128 70,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="160" text-anchor="middle">서로 보완하는 관점</text><polyline points="70,253 70,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="285" text-anchor="middle">한 제품만으로 전체 보호 안 됨</text><polyline points="70,378 70,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="410" text-anchor="middle">경보의 범위만큼 해석</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">패치: 제품 결함의 수정</text><text x="200.0" y="112.0" text-anchor="middle">설치·활성·사후 검사</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">악용 완화·동작 제한</text><text x="200.0" y="237.0" text-anchor="middle">기법·앱·규칙·호환성</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">격리: 경계와 허용 통로</text><text x="200.0" y="362.0" text-anchor="middle">특정 비밀·환경·공유 범위</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">관측·적용·결과를 대조</text><text x="200.0" y="487.0" text-anchor="middle">지원 ≠ 설정 ≠ 실행 ≠ 차단</text><text class="label" x="200" y="528" text-anchor="middle">아래: 방어 검토 순서 · 공격 시간표 아님</text><text class="label" x="200" y="548" text-anchor="middle">개별 통제의 범위와 현재 지원을 확인</text></svg>