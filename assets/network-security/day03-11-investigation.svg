<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">실행 통제의 조사 흐름</title><desc id="desc">아래: 증거를 검토하는 순서
포트·지문 하나로 악성 확정 안 함</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">실행 통제의 조사 흐름</text><polyline points="70,128 70,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="160" text-anchor="middle">3076 감사와 3077 차단 구별</text><polyline points="70,253 70,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="285" text-anchor="middle">시각 인접만으로 귀속 안 함</text><polyline points="70,378 70,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="410" text-anchor="middle">추가 근거와 남은 한계 명시</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">정책·채널·시각의 관측</text><text x="200.0" y="112.0" text-anchor="middle">대상 파일·모드·수집 범위</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">검증할 가설</text><text x="200.0" y="237.0" text-anchor="middle">미승인 도구·정상 업데이트 등</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">독립 자료로 연결</text><text x="200.0" y="362.0" text-anchor="middle">프로세스·서명·배포·연결 기록</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">판단과 공백을 함께 기록</text><text x="200.0" y="487.0" text-anchor="middle">다른 실행 경로·암호화·센서 상태</text><text class="label" x="200" y="528" text-anchor="middle">아래: 증거를 검토하는 순서</text><text class="label" x="200" y="548" text-anchor="middle">포트·지문 하나로 악성 확정 안 함</text></svg>