<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">자격 증명 격리의 경계 질문</title><desc id="desc">아래: 보호 범위의 확인 순서
통신·메모리 구조를 그대로 재현한 도식 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">자격 증명 격리의 경계 질문</text><polyline points="70,128 70,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="160" text-anchor="middle">전체 LSASS 이전은 아님</text><polyline points="70,253 70,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="285" text-anchor="middle">격리해도 모든 행위 차단 아님</text><polyline points="70,378 70,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="410" text-anchor="middle">기능별 현재 상태를 대조</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">일반 운영체제 영역</text><text x="200.0" y="112.0" text-anchor="middle">LSASS · 앱·계정의 실제 행위</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">제한된 통신과 격리 영역</text><text x="200.0" y="237.0" text-anchor="middle">VBS · LSAIso · 특정 비밀</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">범위 밖의 자료·경로</text><text x="200.0" y="362.0" text-anchor="middle">로컬 계정·입력·기존 권한 오용</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">정책·지원·실행·대상 확인</text><text x="200.0" y="487.0" text-anchor="middle">OS 이름만으로 보호 확정 안 함</text><text class="label" x="200" y="528" text-anchor="middle">아래: 보호 범위의 확인 순서</text><text class="label" x="200" y="548" text-anchor="middle">통신·메모리 구조를 그대로 재현한 도식 아님</text></svg>