<svg xmlns="http://www.w3.org/2000/svg" width="400" height="690" viewBox="0 0 400 690" role="img" aria-labelledby="title"><title id="title">그림 5 · HTTP/2 DoH의 캡슐화</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#dceef1;font-size:16px}.label{font-size:14px;fill:#a4cfc9}.heading{font-size:18px;font-weight:700}</style><rect width="400" height="100%" rx="12" fill="#0e1927"/><text x="18" y="35" class="heading">그림 5 · HTTP/2 DoH의 캡슐화</text><rect x="25" y="80" width="350" height="400" rx="12" fill="#152d3a" stroke="#6fabb3"/><rect x="50" y="170" width="300" height="285" rx="12" fill="#15312f" stroke="#6fabb3"/><rect x="75" y="270" width="250" height="125" rx="12" fill="#203d45" stroke="#6fabb3"/><text x="200" y="124" text-anchor="middle" class="">TLS · 내용 보호</text><text x="200" y="217" text-anchor="middle" class="">HTTP/2 · 요청·응답 스트림</text><text x="200" y="315" text-anchor="middle" class="">DNS 메시지</text><text x="200" y="338" text-anchor="middle" class="">질문 이름·종류·응답</text><text x="200" y="528" text-anchor="middle" class="label">밖에서: 주소·시간·양 등</text><text x="200" y="563" text-anchor="middle" class="label">복호화 후: HTTP와 DNS 내용 확인 가능</text><text x="200" y="609" text-anchor="middle" class="label">요청 → 리졸버 / 응답 → 단말</text><text x="200" y="649" text-anchor="middle" class="label">예: HTTP/2 · HTTP/3와 DoQ는 다른 구조</text></svg>