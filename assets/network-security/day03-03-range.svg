<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">가상 페이지 끝의 범위 비교</title><desc id="desc">왼쪽에서 오른쪽 바이트 위치13부터17. R4는14와15만 포함하고 R3는16까지 포함해 경계를 넘는다. 페이지16바이트는 자체 가정이다.</desc><rect width="400" height="100%" rx="14" fill="#0e1927"/><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:16px}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><text class="heading" x="200" y="32" text-anchor="middle">가상 페이지 끝의 범위 비교</text><text class="label" x="200" y="60" text-anchor="middle">P=16바이트 · 위치 13–17만 발췌</text><text x="200" y="110" text-anchor="middle">R4 · 시작14 / 길이2 / 끝16</text><rect x="40" y="140" width="56" height="50" rx="5" fill="#152d3a" stroke="#426c7c"/><text x="68" y="171" text-anchor="middle">13</text><rect x="104" y="140" width="56" height="50" rx="5" fill="#205a4d" stroke="#426c7c"/><text x="132" y="171" text-anchor="middle">14</text><rect x="168" y="140" width="56" height="50" rx="5" fill="#205a4d" stroke="#426c7c"/><text x="196" y="171" text-anchor="middle">15</text><rect x="232" y="140" width="56" height="50" rx="5" fill="#152d3a" stroke="#426c7c"/><text x="260" y="171" text-anchor="middle">16</text><rect x="296" y="140" width="56" height="50" rx="5" fill="#152d3a" stroke="#426c7c"/><text x="324" y="171" text-anchor="middle">17</text><polyline points="228,130 228,202" fill="none" stroke="#ffbd70" stroke-width="2" stroke-dasharray="5 4"/><text class="label" x="228" y="226" text-anchor="middle">페이지 경계16</text><text class="label" x="200" y="253" text-anchor="middle">14·15 포함 → 끝16은 포함 안 함</text><text x="200" y="300" text-anchor="middle">R3 · 시작14 / 길이3 / 끝17</text><rect x="40" y="330" width="56" height="50" rx="5" fill="#152d3a" stroke="#426c7c"/><text x="68" y="361" 