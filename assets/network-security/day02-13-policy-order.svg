<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">SPF 작은 조건의 첫 일치</title><desc id="desc">아래: 자체 비교 순서 · /24 앞24비트
실제 DNS · SMTP · 전체 SPF 검증 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">SPF 작은 조건의 첫 일치</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">앞에서부터 확인</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">조건을 바꾸기</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">결과와 조치는 별도</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">가상 주소192.0.2.25</text><text x="200.0" y="112.0" text-anchor="middle">정책 ip4:192.0.2.0/24 -all</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">첫 ip4 범위와 비교</text><text x="200.0" y="237.0" text-anchor="middle">일치 → 기본 + → pass</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">다른 주소198.51.100.25</text><text x="200.0" y="362.0" text-anchor="middle">범위 불일치 → -all → fail</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">~all · ?all · 순서 변경</text><text x="200.0" y="487.0" text-anchor="middle">결과와 조건의 의미를 구별</text><text class="label" x="200" y="528" text-anchor="middle">아래: 자체 비교 순서 · /24 앞24비트</text><tex