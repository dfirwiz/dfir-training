<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">설정·발동·실행을 따로 확인</title><desc id="desc">아래: 조사 순서 · 가상 기록만 비교
