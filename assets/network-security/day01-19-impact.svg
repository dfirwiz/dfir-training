<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">목적을 관측 질문으로 바꾸기</title><desc id="desc">아래: 조사 질문의 연결
목적 가설 ≠ 행위자·침해 확정</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">목적을 관측 질문으로 바꾸기</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">질문 구체화</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">기록 대조</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">판단과 추가 확인</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">공격자가 얻으려는 것의 가설</text><text x="200.0" y="112.0" text-anchor="middle">자료 · 돈 · 영향력 · 접근권</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">필요할 법한 접근과 행동</text><text x="200.0" y="237.0" text-anchor="middle">계정 · 자산 · 권한 · 경로</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">현재 관측과 다른 가능성</text><text x="200.0" y="362.0" text-anchor="middle">출처 · 시각 · 정상 업무 대조</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">확인된 업무 영향과 다음 조사</text><text x="200.0" y="487.0" text-anchor="middle">가설을 증거에 맞추어 갱신</text><text class="label" x="200" y="528" text-anchor="middle">아래: 조사 질문의 연결</text><text class="label" x="200" y="548" text-anchor="middle">목적 가설 ≠ 행위자·침해 확정</text></svg>