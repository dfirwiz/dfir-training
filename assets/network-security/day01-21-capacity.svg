<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">가상 전송량과 경로의 상한</title><desc id="desc">단위: 십진 Mbps · MB/s
