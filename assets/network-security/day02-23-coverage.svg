<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">수집 범위와 질문을 비교하기</title><desc id="desc">아래: 검사 순서 · 가상 JSON만 계산
실제 센서·사건 검증은 수행하지 않음</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">수집 범위와 질문을 비교하기</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="160" text-anchor="middle">범위 안의 기록만</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="285" text-anchor="middle">종류별 근거를 비교</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="410" text-anchor="middle">모르는 것을 남기기</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">센서 위치 · 방향 · 시간</text><text x="200.0" y="112.0" text-anchor="middle">어떤 종류의 기록을 남기는가</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">질문에 필요한 근거 정의</text><text x="200.0" y="237.0" text-anchor="middle">흐름 · 실행 · 파일 · 사용자</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">입력에서 찾은 것과 빠진 것</text><text x="200.0" y="362.0" text-anchor="middle">기록 존재 ≠ 행위 성공</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">추가 수집 · 반증 · 한계 기록</text><text x="200.0" y="487.0" text-anchor="middle">보이지 않음 ≠ 실제 미발생</text><text class="label" x="200" y="528" text-anchor="middle">아래: 검사 순서 · 가상 JSON만 계산</text><text class="label" x="200" y="548" text-anchor="middle">실제 센서·사건 검증은 수행하지 않음</text></svg>