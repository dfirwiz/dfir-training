<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">접근 기록과 성공 결론 나누기</title><desc id="desc">아래: 조사 강도를 나누는 순서
실습은 가상 분류·주장만 비교</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">접근 기록과 성공 결론 나누기</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="160" text-anchor="middle">종류 존재 ≠ 내용 검증</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="285" text-anchor="middle">시간 인접 ≠ 원인 증명</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="410" text-anchor="middle">정상 작업 가설도 대조</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">직접 관측한 기록의 종류</text><text x="200.0" y="112.0" text-anchor="middle">접근 · 자료 보고 · 인증 · 동작</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">같은 사건이라는 연결 가설</text><text x="200.0" y="237.0" text-anchor="middle">계정 · 대상 · 시각 · 식별자</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">추가 입증할 실제 결과</text><text x="200.0" y="362.0" text-anchor="middle">추출 · 자료 재사용 · 권한 · 승인</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">수집 공백과 판단을 기록</text><text x="200.0" y="487.0" text-anchor="middle">가상 후보 ≠ 실제 탈취·침해 성공</text><text class="label" x="200" y="528" text-anchor="middle">아래: 조사 강도를 나누는 순서</text><text class="label" x="200" y="548" text-anchor="middle">실습은 가상 분류·주장만 비교</text></svg>