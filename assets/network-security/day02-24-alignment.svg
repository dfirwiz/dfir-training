<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">성공 보고와 도메인 정렬 비교</title><desc id="desc">아래: 비교 순서 · DNS/암호 검증 아님
엄격 정렬만 · 실제 DMARC 판정 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">성공 보고와 도메인 정렬 비교</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="160" text-anchor="middle">서로 다른 검사 신원</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="285" text-anchor="middle">한 성공 경로도 확인</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="410" text-anchor="middle">보고를 믿을 조건 대조</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">작성자 From 도메인 example.org</text><text x="200.0" y="112.0" text-anchor="middle">사람 이름·사서함 전체와 구별</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">SPF 성공 주장 mailer.example.net</text><text x="200.0" y="237.0" text-anchor="middle">엄격 정렬에는 도메인이 다름</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">DKIM 성공 주장 example.org</text><text x="200.0" y="362.0" text-anchor="middle">엄격 정렬 도메인은 같음</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">신뢰 문맥 가정이 있어야 비교</text><text x="200.0" y="487.0" text-anchor="middle">A는 true · B는 미확인 null</text><text class="label" x="200" y="528" text-anchor="middle">아래: 비교 순서 · DNS/암호 검증 아님</text><text class="label" x="200" y="548" text-anchor="middle">엄격 정렬만 · 실제 DMARC 판정 아님</text></svg>