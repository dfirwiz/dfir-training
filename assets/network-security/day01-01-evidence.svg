<svg xmlns="http://www.w3.org/2000/svg" width="400" height="590" viewBox="0 0 400 590" role="img" aria-labelledby="title desc"><title id="title">사실과 가설을 나누어 조사하기</title><desc id="desc">화살표: 조사 순서
