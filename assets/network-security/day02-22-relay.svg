<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">원격 도구의 연결과 실제 사용자</title><desc id="desc">아래: 개념 경로 · 모든 제품 공통 아님
직접 연결·중계 여부는 실제 확인</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">원격 도구의 연결과 실제 사용자</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="160" text-anchor="middle">논리적 요청 경로</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="285" text-anchor="middle">제품·구성별 경로 차이</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="410" text-anchor="middle">서버·단말 기록 연결</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">관리자 단말 · 원격 관리 콘솔</text><text x="200.0" y="112.0" text-anchor="middle">사용자 · 계정 · 조직 확인</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">서비스 중계 · 제어 계층</text><text x="200.0" y="237.0" text-anchor="middle">HTTPS도 원격 관리에 쓰일 수 있음</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">대상 단말의 실행 프로그램</text><text x="200.0" y="362.0" text-anchor="middle">설치 여부와 실행 증거 구별</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">실제 세션 · 작업 · 자료 접근</text><text x="200.0" y="487.0" text-anchor="middle">같은 서비스 주소 ≠ 같은 사용자</text><text class="label" x="200" y="528" text-anchor="middle">아래: 개념 경로 · 모든 제품 공통 아님</text><text class="label" x="200" y="548" text-anchor="middle">직접 연결·중계 여부는 실제 확인</text></svg>