<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">서로 다른 관측을 함께 읽기</title><desc id="desc">아래: 관측을 결합하는 사고 흐름
