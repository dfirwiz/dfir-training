<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">공격 흐름과 증거의 경계</title><desc id="desc">아래: 가설상의 처리 순서
각 단계의 관측과 성공 판정은 별개</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">공격 흐름과 증거의 경계</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">방향: 다음 단계</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">성공 여부 별도</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">단말 증거 필요</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">방문 · 광고 · 이동 안내</text><text x="200.0" y="112.0" text-anchor="middle">정상 웹 이용 중에도 시작 가능</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">환경 확인 · 취약점 이용 시도</text><text x="200.0" y="237.0" text-anchor="middle">요청 발견 ≠ 취약점 성공</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">파일 전달 · 응답 내용 관측</text><text x="200.0" y="362.0" text-anchor="middle">전달 완료 ≠ 실제 실행</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">단말 실행 · 후속 행동 대조</text><text x="200.0" y="487.0" text-anchor="middle">독립 증거로 영향 범위 확인</text><text class="label" x="200" y="528" text-anchor="middle">아래: 가설상의 처리 순서</text><text class="label" x="200" y="548" text-anchor="middle">각 단계의 관측과 성공 판정은 별개</text></svg>