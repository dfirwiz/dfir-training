<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">사건의 질문을 통신 경로에 놓기</title><desc id="desc">아래: 가상 조사 연결 · 인과 확정 아님
주소·시각·단말·계정 근거를 따로 대조</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">사건의 질문을 통신 경로에 놓기</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="160" text-anchor="middle">같은 사건인지 대조</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="285" text-anchor="middle">내부 구간도 관측</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="410" text-anchor="middle">어떤 자료가 나갔는가</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">메일 경계 · 수신 보고</text><text x="200.0" y="112.0" text-anchor="middle">수락과 사용자 클릭은 다른 질문</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">단말 → 리졸버 · 외부 서비스</text><text x="200.0" y="237.0" text-anchor="middle">이름 조회 · TLS 흐름 관측</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">단말 → 내부 서버</text><text x="200.0" y="362.0" text-anchor="middle">SMB 흐름 ≠ 명령·저장 확인</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">외부로 나간 바이트</text><text x="200.0" y="487.0" text-anchor="middle">내용 · 파일 · 승인 근거는 별도</text><text class="label" x="200" y="528" text-anchor="middle">아래: 가상 조사 연결 · 인과 확정 아님</text><text class="label" x="200" y="548" text-anchor="middle">주소·시각·단말·계정 근거를 따로 대조</text></svg>