<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">SSH의 인증과 채널을 나누기</title><desc id="desc">아래: 해석 순서 · 세부 협상은 생략
포트 22만으로 실제 SSH/터널을 확정 안 함</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">SSH의 인증과 채널을 나누기</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">개념적 확인 순서</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">채널의 용도 확인</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">단말 · 서버 로그 대조</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">연결할 서버의 신원 확인</text><text x="200.0" y="112.0" text-anchor="middle">호스트 키 · 신뢰 기준 대조</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">사용자 인증 · 기능 허용</text><text x="200.0" y="237.0" text-anchor="middle">누구인가와 무엇을 할 수 있나</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">하나의 보호된 연결 · 여러 채널</text><text x="200.0" y="362.0" text-anchor="middle">셸 · 파일 · 포워딩은 다른 기능</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">동작 · 대상 · 승인 근거 확인</text><text x="200.0" y="487.0" text-anchor="middle">인증 성공 ≠ 정상 작업 승인</text><text class="label" x="200" y="528" text-anchor="middle">아래: 해석 순서 · 세부 협상은 생략</text><text class="label" x="200" y="548" text-anchor="middle">포트 22만으로 실제 SSH/터널을 확정 안 함</text></svg>