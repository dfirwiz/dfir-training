<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">재시도 전에 같은 의도 확인</title><desc id="desc">아래: 재시도 판단에 필요한 질문
