<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">가상 상속 설정과 동작 구별</title><desc id="desc">아래: 자체 모형의 비교 순서
모든 완화의 전역·감사 지원을 가정 안 함</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">가상 상속 설정과 동작 구별</text><polyline points="70,128 70,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="160" text-anchor="middle">상속일 때만 다음 값</text><polyline points="70,253 70,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="285" text-anchor="middle">실제 Windows 엔진은 아님</text><polyline points="70,378 70,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="410" text-anchor="middle">두 결과를 성공으로 합치지 않음</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">앱의 명시값부터 확인</text><text x="200.0" y="112.0" text-anchor="middle">on·off는 선택 / unknown은 멈춤</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">notset일 때 시스템 값</text><text x="200.0" y="237.0" text-anchor="middle">다시 notset이면 알려진 기본값</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">선택 값 + 지원·실행 주장</text><text x="200.0" y="362.0" text-anchor="middle">모두 참일 때만 구성 후보 참</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">사건의 차단 주장은 별도</text><text x="200.0" y="487.0" text-anchor="middle">감사 ≠ 차단 · 없음은 미확인</text><text class="label" x="200" y="528" text-anchor="middle">아래: 자체 모형의 비교 순서</text><text class="label" x="200" y="548" text-anchor="middle">모든 완화의 전역·감사 지원을 가정 안 함</text></svg>