<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">네 전달에서 로컬 계획까지</title><desc id="desc">아래: 자체 오프라인 재생
단위: 전달 · 모의 시도 · 계획 개수</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">네 전달에서 로컬 계획까지</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="161" text-anchor="middle">한 실행 안에서</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="286" text-anchor="middle">상태와 계획 계산</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="275" y="411" text-anchor="middle">범위 구분</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">가상 전달 4개</text><text x="200.0" y="112.0" text-anchor="middle">D1 · D2 · D3 · D4</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">미리 적은 모의 결과 읽기</text><text x="200.0" y="237.0" text-anchor="middle">시도 수 2 + 0 + 2 + 1 = 5</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">노트 계획 2개 · 미해결 1개</text><text x="200.0" y="362.0" text-anchor="middle">중복 계획 1회 생략</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">사람의 검토와 실제 연결은 별도</text><text x="200.0" y="487.0" text-anchor="middle">외부 요청 · 쓰기 · 차단 0</text><text class="label" x="200" y="528" text-anchor="middle">아래: 자체 오프라인 재생</text><text class="label" x="200" y="548" text-anchor="middle">단위: 전달 · 모의 시도 · 계획 개수</text></svg>