<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">관측 방법과 자산·시각 연결</title><desc id="desc">아래: 근거를 연결하는 질문의 순서
관측 방법은 서로 보완 · 전부 필수 아님</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">관측 방법과 자산·시각 연결</text><polyline points="70,128 70,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="160" text-anchor="middle">다른 종류의 근거</text><polyline points="70,253 70,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="285" text-anchor="middle">통신하지 않으면 안 보일 수 있음</text><polyline points="70,378 70,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="245" y="410" text-anchor="middle">주소만으로 같은 장비 단정 안 함</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">관리·인증 수집</text><text x="200.0" y="112.0" text-anchor="middle">장비·설치·설정의 수집 범위</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">능동 요청과 응답</text><text x="200.0" y="237.0" text-anchor="middle">출발 위치·옵션·서비스 상태</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">수동 통신 관측</text><text x="200.0" y="362.0" text-anchor="middle">시간·경로·암호화·수집 손실</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">자산 식별자와 시각으로 대조</text><text x="200.0" y="487.0" text-anchor="middle">단일 방법의 빈칸은 별도 질문</text><text class="label" x="200" y="528" text-anchor="middle">아래: 근거를 연결하는 질문의 순서</text><text class="label" x="200" y="548" text-anchor="middle">관측 방법은 서로 보완 · 전부 필수 아님</text></svg>