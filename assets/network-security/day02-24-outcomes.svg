<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="title desc"><title id="title">메일 수락과 사용자 행위 구별</title><desc id="desc">아래: 조사 질문 순서
이번 실습은 실제 전송·열람·실행 없음</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5"/></marker></defs><style>text{font:16px sans-serif;fill:#deeee9}.heading{font-size:18px;font-weight:700}.label{font-size:14px;fill:#a8c9d5}</style><rect width="400" height="565" rx="14" fill="#0e1927"/><text class="heading" x="200" y="31" text-anchor="middle">메일 수락과 사용자 행위 구별</text><polyline points="185,128 185,185" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="160" text-anchor="middle">처리 경로를 추적</text><polyline points="185,253 185,310" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="285" text-anchor="middle">별도 행위 근거 필요</text><polyline points="185,378 185,435" fill="none" stroke="#78e3c5" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="268" y="410" text-anchor="middle">결과와 승인을 확인</text><rect x="40" y="60" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="88.0" text-anchor="middle">SMTP 데이터 뒤 성공 보고</text><text x="200.0" y="112.0" text-anchor="middle">서버의 수신 책임 단계</text><rect x="40" y="185" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="213.0" text-anchor="middle">받은편지함 · 격리 · 후속 전달</text><text x="200.0" y="237.0" text-anchor="middle">서버의 실제 처리 기록 확인</text><rect x="40" y="310" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="338.0" text-anchor="middle">사용자 열람 · 링크 접속</text><text x="200.0" y="362.0" text-anchor="middle">메일 클라이언트·웹·단말 대조</text><rect x="40" y="435" width="320" height="68" rx="10" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="463.0" text-anchor="middle">실행 · 계정 사용 · 영향</text><text x="200.0" y="487.0" text-anchor="middle">이전 단계만으로 성공 확정 안 함</text><text class="label" x="200" y="528" text-anchor="middle">아래: 조사 질문 순서</text><text class="label" x="200" y="548" text-anchor="middle">이번 실습은 실제 전송·열람·실행 없음</text></svg>