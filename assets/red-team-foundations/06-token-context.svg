<svg xmlns="http://www.w3.org/2000/svg" width="720" height="605" viewBox="0 0 720 605" role="img" aria-labelledby="title desc"><title id="title">프로세스 기본 토큰과 스레드의 가장 문맥</title><desc id="desc">스레드의 일반적인 보안 객체 접근을 설명하는 가상 예제입니다. 한 스레드의 가장이 프로세스 기본 토큰이나 다른 스레드를 자동으로 바꾸지 않습니다. 새 프로세스 생성 등은 각 API의 별도 규칙을 확인합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="605" rx="14" fill="#0e1927"/><polyline points="250,110 250,165 180,165 180,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="470,110 470,165 540,165 540,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="461.0" y="148" width="158" height="26" rx="4" fill="#0e1927"/><text class="label" x="540" y="165" text-anchor="middle">같은 프로세스 안</text><polyline points="180,335 180,455" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,335 540,455" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="145" y="25" width="430" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="61.5" text-anchor="middle">프로세스 P의 기본 토큰</text><text x="360.0" y="87.5" text-anchor="middle">사용자 A의 보안 문맥</text><rect x="30" y="225" width="305" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="261.0" text-anchor="middle">스레드 1</text><text x="182.5" y="287.0" text-anchor="middle">가장 토큰 없음</text><text x="182.5" y="313.0" text-anchor="middle">기본적으로 A의 문맥 사용</text><rect x="385" y="225" width="305" height="110" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="261.0" text-anchor="middle">스레드 2</text><text x="537.5" y="287.0" text-anchor="middle">B의 가장 토큰 사용 중</text><text x="537.5" y="313.0" text-anchor="middle">해당 작업에 B 문맥 적용</text><rect x="30" y="455" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="488.5" text-anchor="middle">스레드 1의 객체 접근</text><text x="182.5" y="514.5" text-anchor="middle">A 문맥 + 요청 권한</text><text x="182.5" y="540.5" text-anchor="middle">대상 객체의 규칙과 대조</text><rect x="385" y="455" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="488.5" text-anchor="middle">스레드 2의 객체 접근</text><text x="537.5" y="514.5" text-anchor="middle">B 문맥 + 요청 권한</text><text x="537.5" y="540.5" text-anchor="middle">가장 수준·API 규칙도 확인</text></svg>