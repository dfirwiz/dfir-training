<svg xmlns="http://www.w3.org/2000/svg" width="880" height="334" viewBox="0 0 880 334" role="img" aria-labelledby="title desc"><title id="title">같은 프로세스 인스턴스의 증거 연결</title><desc id="desc">합성 타임라인입니다. 누락된 이벤트와 정상 대안 가설을 함께 확인합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="334" rx="14" fill="#0e1927"/><polyline points="285,84 307,84" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="573,84 595,84" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="728,134 728,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="595,265 520,265" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="34" width="265" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="152.5" y="78.0" text-anchor="middle">대상 생성 · ID 1</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="152.5" y="104.0" text-anchor="middle">호스트 · ProcessGuid</text><rect x="307" y="34" width="266" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="78.0" text-anchor="middle">교차 프로세스 접근 · ID 10</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="104.0" text-anchor="middle">출발지 · 대상 · 권한</text><rect x="595" y="34" width="265" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="727.5" y="78.0" text-anchor="middle">원격 스레드 · ID 8</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="72