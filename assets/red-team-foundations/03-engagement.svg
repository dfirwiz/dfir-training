<svg xmlns="http://www.w3.org/2000/svg" width="700" height="880" viewBox="0 0 700 880" role="img" aria-labelledby="title desc"><title id="title">실행·중단·재개의 판단 흐름</title><desc id="desc">화살표는 활동 결정 순서입니다. 범위 또는 영향이 불명확하면 중단·기록·연락하고, 조율 후 다시 범위를 확인합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="880" rx="14" fill="#0e1927"/><polyline points="175,90 175,165" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="175,265 175,350" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="185.0" y="294" width="30" height="26" rx="4" fill="#0e1927"/><text class="label" x="200" y="311" text-anchor="middle">예</text><polyline points="315,235 530,235 530,350" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="418.0" y="268" width="174" height="26" rx="4" fill="#0e1927"/><text class="label" x="505" y="285" text-anchor="middle">아니오 또는 불명확</text><polyline points="175,415 175,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="175,590 175,760" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="185.0" y="663" width="30" height="26" rx="4" fill="#0e1927"/><text class="label" x="200" y="680" text-anchor="middle">예</text><polyline points="315,540 365,540 365,400 405,400" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="334.0" y="453" width="62" height="26" rx="4" fill="#0e1927"/><text class="label" x="365" y="470" text-anchor="middle">아니오</text><polyline points="530,450 530,560" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="655,610 680,610 680,125 345,125 345,190 315,190" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="418.0" y="73" width="174" height="48" rx="4" fill="#0e1927"/><text class="label" x="505" y="90" text-anchor="middle">재개 조건 확인 후</text><text class="label" x="505" y="112" text-anchor="middle">범위 재검토</text><rect x="35" y="25" width="280" height="65" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="175.0" y="64.5" text-anchor="middle">수행할 행동 선택</text><rect x="35" y="165" width="280" height="100" rx="12" fill="#193345" stroke="#80a7ff"/><text x="175.0" y="196.0" text-anchor="middle">판단 1</text><text x="175.0" y="222.0" text-anchor="middle">대상과 행동이</text><text x="175.0" y="248.0" text-anchor="middle">합의 범위 안인가?</text><rect x="35" y="350" width="280" height="65" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="175.0" y="389.5" text-anchor="middle">실행하고 기록</text><rect x="35" y="490" width="280" height="100" rx="12" fill="#193345" stroke="#80a7ff"/><text x="175.0" y="534.0" text-anchor="middle">판단 2</text><text x="175.0" y="560.0" text-anchor="middle">예상한 상태와 영향인가?</text><rect x="35" y="760" width="280" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="175.0" y="794.0" text-anchor="middle">결과 검증과</text><text x="175.0" y="820.0" text-anchor="middle">변경 사항 정리</text><rect x="405" y="350" width="250" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="530.0" y="394.0" text-anchor="middle">관련 활동 중단</text><text x="530.0" y="420.0" text-anchor="middle">상태 기록·연락</text><rect x="405" y="560" width="250" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="530.0" y="604.0" text-anchor="middle">조율 결과와</text><text x="530.0" y="630.0" text-anchor="middle">재개 조건 확인</text></svg>