<svg xmlns="http://www.w3.org/2000/svg" width="560" height="460" viewBox="0 0 560 460" role="img" aria-labelledby="title desc"><title id="title">전술·기법·절차의 관계</title><desc id="desc">화살표는 시간 순서가 아니라 설명의 구체화 관계입니다. 전술에서 기법으로 이어지며 화면과 명령줄의 두 절차로 분기합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="560" height="460" rx="14" fill="#0e1927"/><polyline points="280,105 280,180" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="280,250 280,285 142,285 142,330" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="280,250 280,285 417,285 417,330" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="70" y="25" width="420" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="280.0" y="59.0" text-anchor="middle">전술</text><text x="280.0" y="85.0" text-anchor="middle">실행 기회를 유지하려는 목적</text><rect x="70" y="180" width="420" height="70" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="280.0" y="222.0" text-anchor="middle">기법: Windows 예약 작업 이용</text><rect x="15" y="330" width="255" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="142.5" y="361.0" text-anchor="middle">절차 예시 A</text><text x="142.5" y="387.0" text-anchor="middle">화면에서</text><text x="142.5" y="413.0" text-anchor="middle">실습 작업 등록</text><rect x="290" y="330" width="255" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="417.5" y="361.0" text-anchor="middle">절차 예시 B</text><text x="417.5" y="387.0" text-anchor="middle">명령줄 도구로</text><text x="417.5" y="413.0" text-anchor="middle">실습 작업 등록</text></svg>