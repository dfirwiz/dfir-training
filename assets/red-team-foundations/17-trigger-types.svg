<svg xmlns="http://www.w3.org/2000/svg" width="720" height="655" viewBox="0 0 720 655" role="img" aria-labelledby="title desc"><title id="title">파일 형식과 처리 주체·증거의 대응</title><desc id="desc">파일 처리 관계와 확인할 증거를 비교한 개념도입니다. Windows 기본 처리의 대표 예이며 파일 연결·버전·정책에 따라 다를 수 있습니다. 형식 처리 자체는 악성을 뜻하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="655" rx="14" fill="#0e1927"/><polyline points="125,95 125,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="360,95 360,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="595,95 595,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="125,315 125,470" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="360,315 360,470" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="595,315 595,470" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="40" y="25" width="640" height="70" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="67.0" text-anchor="middle">사용자가 상호작용한 항목의 실제 형식부터 확인</text><rect x="20" y="215" width="210" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="125.0" y="246.0" text-anchor="middle">BAT · CMD</text><text x="125.0" y="272.0" text-anchor="middle">명령 텍스트</text><text x="125.0" y="298.0" text-anchor="middle">인터프리터가 해석</text><rect x="255" y="215" width="210" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="246.0" text-anchor="middle">LNK</text><text x="360.0" y="272.0" text-anchor="middle">바로가기 메타데이터</text><text x="360.0" y="298.0" text-anchor="middle">Shell이 대상 연결</text><rect x="490" y="215" width="210" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="595.0" y="246.0" text-anchor="middle">MSC</text><text x="595.0" y="272.0" text-anchor="middle">저장된 콘솔 구성</text><text x="595.0" y="298.0" text-anchor="middle">MMC가 처리</text><rect x="20" y="470" width="210" height="110" rx="12" fill="#193345" stroke="#80a7ff"/><text x="125.0" y="506.0" text-anchor="middle">실행 증거</text><text x="125.0" y="532.0" text-anchor="middle">명령줄·부모·자식</text><text x="125.0" y="558.0" text-anchor="middle">실제 분기·출력</text><rect x="255" y="470" width="210" height="110" rx="12" fill="#193345" stroke="#80a7ff"/><text x="360.0" y="506.0" text-anchor="middle">실행 증거</text><text x="360.0" y="532.0" text-anchor="middle">대상·인자·시간</text><text x="360.0" y="558.0" text-anchor="middle">실제 시작된 프로세스</text><rect x="490" y="470" width="210" height="110" rx="12" fill="#193345" stroke="#80a7ff"/><text x="595.0" y="506.0" text-anchor="middle">실행 증거</text><text x="595.0" y="532.0" text-anchor="middle">모듈·후속 동작</text><text x="595.0" y="558.0" text-anchor="middle">사용자·권한 문맥</text></svg>