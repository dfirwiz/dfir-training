<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-labelledby="title desc"><title id="title">NTLM 챌린지와 자격 증명 검증</title><desc id="desc">챌린지에 맞는 응답이 전달됩니다. 로컬 계정의 권한 있는 검증은 같은 컴퓨터 안에서 수행될 수 있습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="350" rx="14" fill="#0e1927"/><polyline points="234,76 338,76" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="263.0" y="43" width="46" height="26" rx="4" fill="#0e1927"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" class="label" x="286" y="60" text-anchor="middle">협상</text><polyline points="338,125 234,125" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="255.0" y="92" width="62" height="26" rx="4" fill="#0e1927"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" class="label" x="286" y="109" text-anchor="middle">챌린지</text><polyline points="234,221 338,221" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="263.0" y="188" width="46" height="26" rx="4" fill="#0e1927"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" class="label" x="286" y="205" text-anchor="middle">응답</text><polyline points="543,250 646,250" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="547.0" y="217" width="94" height="26" rx="4" fill="#0e1927"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" class="label" x="594" y="234" text-anchor="middle">검증 요청</text><polyline points="646,298 543,298" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="547.0" y="265" width="94" height="26" rx="4" fill="#0e1927"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" class="label" x="594" y="282" text-anchor="middle">검증 결과</text><rect x="24" y="32" width="210" height="294" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="129.0" y="173.0" text-anchor="middle">클라이언트</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="129.0" y="199.0" text-anchor="middle">응답 계산</text><rect x="338" y="32" width="205" height="294" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.5" y="173.0" text-anchor="middle">대상 서비스</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.5" y="199.0" text-anchor="middle">로그온과 권한 판단</text><rect x="646" y="220" width="210" height="106" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="751.0" y="267.0" text-anchor="middle">권한 있는 검증 주체</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="751.0" y="293.0" text-anchor="middle">도메인 DC 또는 로컬</text></svg>