<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc"><title id="title">32비트와 64비트에서 달라지는 구조체 정렬 예</title><desc id="desc">Windows x86·x64의 통상적인 기본 정렬, 별도 Pack 지정 없음, DWORD 뒤에 포인터 하나인 가상 구조를 가정한 계산입니다. 실행으로 측정한 결과가 아니며 다른 필드나 정렬 규칙에 일반화하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="620" rx="14" fill="#0e1927"/><polyline points="250,110 250,165 180,165 180,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="470,110 470,165 540,165 540,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,315 180,455" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,340 540,455" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="115" y="25" width="490" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="61.5" text-anchor="middle">가상 네이티브 구조체</text><text x="360.0" y="87.5" text-anchor="middle">DWORD tag 뒤에 포인터 ptr 하나</text><rect x="30" y="215" width="305" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="246.0" text-anchor="middle">32비트 프로세스 예</text><text x="182.5" y="272.0" text-anchor="middle">tag: 오프셋 0 · 4바이트</text><text x="182.5" y="298.0" text-anchor="middle">ptr: 오프셋 4 · 4바이트</text><rect x="385" y="215" width="305" height="125" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="245.5" text-anchor="middle">64비트 프로세스 예</text><text x="537.5" y="271.5" text-anchor="middle">tag: 오프셋 0 · 4바이트</text><text x="537.5" y="297.5" text-anchor="middle">패딩: 오프셋 4 · 4바이트</text><text x="537.5" y="323.5" text-anchor="middle">ptr: 오프셋 8 · 8바이트</text><rect x="30" y="455" width="305" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="494.0" text-anchor="middle">이 예의 전체 크기 8바이트</text><text x="182.5" y="520.0" text-anchor="middle">DWORD 자체는 계속 4바이트</text><rect x="385" y="455" width="305" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="494.0" text-anchor="middle">이 예의 전체 크기 16바이트</text><text x="537.5" y="520.0" text-anchor="middle">포인터 크기와 정렬이 달라짐</text></svg>