<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="title desc"><title id="title">프로세스 접근에서 후속 행위까지</title><desc id="desc">조회·접근·실행·체크인은 각각 독립된 증거가 필요합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="330" rx="14" fill="#0e1927"/><polyline points="270,79 315,79" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="565,79 610,79" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="735,128 735,218" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="530,262 420,262" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="30" width="250" height="98" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="145.0" y="73.0" text-anchor="middle">대상 후보 조회</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="145.0" y="99.0" text-anchor="middle">호스트 · PID · 생성 시각</text><rect x="315" y="30" width="250" height="98" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="73.0" text-anchor="middle">프로세스 접근</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="99.0" text-anchor="middle">요청 권한 · 접근 결과</text><rect x="610" y="30" width="250" height="98" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="735.0" y="73.0" text-anchor="middle">대상 안의 실행</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="735.0" y="99.0" text-anchor="middle">스레드 · 이미지 · 메모리</text><rect x="530" y="218" width="330" height="88" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="695.0" y="256.0" text-anchor="middle">후속 네트워크 또는 세션</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="695.0" y="282.0" text-anchor="middle">연결 · 체크인 · 서비스 결과</text><rect x="20" y="218" width="400" height="88" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="220.0" y="256.0" text-anchor="middle">관측은 단계별로 기록</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="220.0" y="282.0" text-anchor="middle">하나의 성공을 다른 단계로 확대하지 않음</text></svg>