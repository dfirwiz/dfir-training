<svg xmlns="http://www.w3.org/2000/svg" width="760" height="635" viewBox="0 0 760 635" role="img" aria-labelledby="title desc"><title id="title">파일 이름을 해석하는 조건</title><desc id="desc">양쪽 증거를 비교하여 아래 판단에서 연결하는 독립 개념도. 실제 화면이나 실행 결과가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="760" height="635" rx="14" fill="#0e1927"/><polyline points="230,115 230,165 190,165 190,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="530,115 530,165 570,165 570,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="190,360 190,420 265,420 265,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="570,360 570,420 495,420 495,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="55" y="25" width="650" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="380.0" y="64.0" text-anchor="middle">실행 요청의 계약 확인</text><text x="380.0" y="90.0" text-anchor="middle">API · 매개변수 · 셸</text><rect x="15" y="220" width="350" height="140" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="190.0" y="271.0" text-anchor="middle">호출 방식</text><text x="190.0" y="297.0" text-anchor="middle">실행 대상의 별도 지정?</text><text x="190.0" y="323.0" text-anchor="middle">이름 / 부분 / 전체 경로</text><rect x="395" y="220" width="350" height="140" rx="12" fill="#193345" stroke="#80a7ff"/><text x="570.0" y="271.0" text-anchor="middle">실제 실행 문맥</text><text x="570.0" y="297.0" text-anchor="middle">호출 폴더 · 현재 폴더</text><text x="570.0" y="323.0" text-anchor="middle">환경 · 파일 존재 조건</text><rect x="35" y="490" width="690" height="105" rx="12" fill="#193345" stroke="#80a7ff"/><text x="380.0" y="536.5" text-anchor="middle">계약에 맞는 검색 분기 판단</text><text x="380.0" y="562.5" text-anchor="middle">PATH만으로 결과를 단정하지 않음</text></svg>