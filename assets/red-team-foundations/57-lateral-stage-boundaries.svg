<svg xmlns="http://www.w3.org/2000/svg" width="710" height="250" viewBox="0 0 880 310" role="img" aria-labelledby="title desc"><title id="title">대상에 접근하는 단계별 증거</title><desc id="desc">도달성, 인증과 인가, 실행 및 후속 관측은 각각 확인합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="310" rx="14" fill="#0e1927"/><polyline points="406,66 474,66" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="664,109 664,200" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="474,243 406,243" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="26" y="23" width="380" height="86" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="216.0" y="60.0" text-anchor="middle">출발 호스트와 연결</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="216.0" y="86.0" text-anchor="middle">이름 해석 · 서비스 응답</text><rect x="474" y="23" width="380" height="86" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="664.0" y="60.0" text-anchor="middle">대상 인증과 인가</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="664.0" y="86.0" text-anchor="middle">신원 확인 · 작업 허용</text><rect x="26" y="200" width="380" height="86" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="216.0" y="237.0" text-anchor="middle">새 세션 또는 반환</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="216.0" y="263.0" text-anchor="middle">체크인 · 연결 · 응답</text><rect x="474" y="200" width="380" height="86" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="664.0" y="237.0" text-anchor="middle">대상 내부의 실행</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="664.0" y="263.0" text-anchor="middle">프로세스 · 서비스 · 런스페이스</text></svg>