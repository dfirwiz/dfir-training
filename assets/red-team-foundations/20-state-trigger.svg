<svg xmlns="http://www.w3.org/2000/svg" width="720" height="635" viewBox="0 0 720 635" role="img" aria-labelledby="title desc"><title id="title">설정과 트리거의 관계</title><desc id="desc">독립 제작 개념 비교도. 위 조건을 두 관점으로 나누어 아래 판단에 연결합니다. 실제 실행 결과가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="635" rx="14" fill="#0e1927"/><polyline points="250,115 250,175 180,175 180,235" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="470,115 470,175 540,175 540,235" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,365 180,425 260,425 260,495" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,365 540,425 460,425 460,495" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="125" y="25" width="470" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="64.0" text-anchor="middle">지속성의 재실행 조건</text><text x="360.0" y="90.0" text-anchor="middle">현재 세션의 생존과 별개</text><rect x="30" y="235" width="305" height="130" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="281.0" text-anchor="middle">남는 상태</text><text x="182.5" y="307.0" text-anchor="middle">레지스트리 · 파일 · 작업</text><text x="182.5" y="333.0" text-anchor="middle">사용자와 경로 확인</text><rect x="385" y="235" width="305" height="130" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="281.0" text-anchor="middle">실제 트리거</text><text x="537.5" y="307.0" text-anchor="middle">로그인 · 셸 시작 · 시간</text><text x="537.5" y="333.0" text-anchor="middle">미발생이면 실행 미확인</text><rect x="95" y="495" width="530" height="100" rx="12" fill="#193345" stroke="#80a7ff"/><text x="360.0" y="539.0" text-anchor="middle">조건 충족 후 실행 증거를 따로 확인</text><text x="360.0" y="565.0" text-anchor="middle">설정 존재만으로 재접속을 확정하지 않음</text></svg>