<svg xmlns="http://www.w3.org/2000/svg" width="720" height="615" viewBox="0 0 720 615" role="img" aria-labelledby="title desc"><title id="title">바로가기의 표시 정보와 실행 설정</title><desc id="desc">실제 속성 창을 복제한 화면이 아니라 메타데이터 관계를 설명한 독립 개념도입니다. 표시·설정·실제 실행의 세 층을 구별합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="615" rx="14" fill="#0e1927"/><polyline points="250,100 250,165 180,165 180,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="470,100 470,165 540,165 540,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,350 540,415 430,415 430,485" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="413.0" y="401" width="174" height="26" rx="4" fill="#0e1927"/><text class="label" x="500" y="418" text-anchor="middle">설정 ≠ 실행 관측</text><rect x="145" y="25" width="430" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="56.5" text-anchor="middle">하나의 기존 Shell Link</text><text x="360.0" y="82.5" text-anchor="middle">형식과 메타데이터를 읽음</text><rect x="30" y="225" width="305" height="125" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="255.5" text-anchor="middle">사용자가 보는 표현</text><text x="182.5" y="281.5" text-anchor="middle">표시 이름 · 아이콘 원천</text><text x="182.5" y="307.5" text-anchor="middle">문서 아이콘이라고</text><text x="182.5" y="333.5" text-anchor="middle">대상이 문서인 것은 아님</text><rect x="385" y="225" width="305" height="125" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="255.5" text-anchor="middle">설정된 처리 경로</text><text x="537.5" y="281.5" text-anchor="middle">TargetPath · Arguments</text><text x="537.5" y="307.5" text-anchor="middle">WorkingDirectory</text><text x="537.5" y="333.5" text-anchor="middle">각 필드를 분리해 보존</text><rect x="100" y="485" width="520" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="521.5" text-anchor="middle">실제 실행 기록과 비교</text><text x="360.0" y="547.5" text-anchor="middle">프로세스 · 명령줄 · 부모 · 파일 접근 · 시각</text></svg>