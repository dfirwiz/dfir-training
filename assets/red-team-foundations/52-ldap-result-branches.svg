<svg xmlns="http://www.w3.org/2000/svg" width="880" height="325" viewBox="0 0 880 325" role="img" aria-labelledby="title desc"><title id="title">반환 목록을 읽는 세 가지 갈래</title><desc id="desc">0건과 오류, 속성 누락은 다른 상태이며 같은 문장으로 기록하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="325" rx="14" fill="#0e1927"/><polyline points="315,97 315,143 151,143 151,185" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="440,97 440,185" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="565,97 565,143 729,143 729,185" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="215" y="25" width="450" height="72" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="68.0" text-anchor="middle">도구 응답과 서버 완료 상태</text><rect x="20" y="185" width="262" height="116" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="151.0" y="237.0" text-anchor="middle">정상 완료 · 0건</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="151.0" y="263.0" text-anchor="middle">시작점 · 깊이 · 필터</text><rect x="309" y="185" width="262" height="116" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="237.0" text-anchor="middle">행은 있으나 속성 누락</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="263.0" text-anchor="middle">요청 · 권한 · 복제 범위</text><rect x="598" y="185" width="262" height="116" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="729.0" y="237.0" text-anchor="middle">오류 또는 부분 결과</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="729.0" y="263.0" text-anchor="middle">제한 · 인증 · 연결 상태</text></svg>