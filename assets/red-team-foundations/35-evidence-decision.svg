<svg xmlns="http://www.w3.org/2000/svg" width="760" height="635" viewBox="0 0 760 635" role="img" aria-labelledby="title desc"><title id="title">조건부 위험과 실행 증거</title><desc id="desc">양쪽 증거를 비교하여 아래 판단에서 연결하는 독립 개념도. 실제 화면이나 실행 결과가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="760" height="635" rx="14" fill="#0e1927"/><polyline points="230,115 230,165 190,165 190,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="530,115 530,165 570,165 570,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="190,360 190,420 265,420 265,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="570,360 570,420 495,420 495,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="55" y="25" width="650" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="380.0" y="64.0" text-anchor="middle">조사 사실에 출처를 붙이기</text><text x="380.0" y="90.0" text-anchor="middle">true / false / unknown 보존</text><rect x="15" y="220" width="350" height="140" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="190.0" y="271.0" text-anchor="middle">변경 가능성</text><text x="190.0" y="297.0" text-anchor="middle">파일 · 폴더 · 키</text><text x="190.0" y="323.0" text-anchor="middle">유효 주체와 제약 확인</text><rect x="395" y="220" width="350" height="140" rx="12" fill="#193345" stroke="#80a7ff"/><text x="570.0" y="271.0" text-anchor="middle">실행 연결</text><text x="570.0" y="297.0" text-anchor="middle">실제 읽는 입력 · 높은 문맥</text><text x="570.0" y="323.0" text-anchor="middle">트리거 · 반영 시점</text><rect x="35" y="490" width="690" height="105" rx="12" fill="#193345" stroke="#80a7ff"/><text x="380.0" y="536.5" text-anchor="middle">조건 연결은 조사 우선순위</text><text x="380.0" y="562.5" text-anchor="middle">실제 이미지 · 토큰 증거는 별도</text></svg>