<svg xmlns="http://www.w3.org/2000/svg" width="880" height="334" viewBox="0 0 880 334" role="img" aria-labelledby="title desc"><title id="title">대상 NTLM 로그에 나타날 수 있는 경로</title><desc id="desc">대상 로그의 프로토콜 이름만으로 어떤 경로로 인증했는지 구별하기 어렵습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="334" rx="14" fill="#0e1927"/><polyline points="151,126 151,178 260,178 260,230" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="440,126 440,230" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="731,126 731,178 620,178 620,230" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="18" y="36" width="265" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="150.5" y="75.0" text-anchor="middle">정상 통합 인증</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="150.5" y="101.0" text-anchor="middle">기존 계정 문맥</text><rect x="308" y="36" width="265" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.5" y="75.0" text-anchor="middle">NT 해시 재사용</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.5" y="101.0" text-anchor="middle">새 응답 계산</text><rect x="598" y="36" width="265" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="730.5" y="75.0" text-anchor="middle">릴레이</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="730.5" y="101.0" text-anchor="middle">다른 인증 교환 전달</text><rect x="195" y="230" width="490" height="80" rx="12" 