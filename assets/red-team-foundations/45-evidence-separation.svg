<svg xmlns="http://www.w3.org/2000/svg" width="790" height="310" viewBox="0 0 790 310" role="img" aria-labelledby="title desc"><title id="title">관측 네 가지의 판정</title><desc id="desc">화살표는 다음에 비교할 관측을 가리키며 앞의 관측이 뒤의 결과를 증명하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="790" height="310" rx="14" fill="#0e1927"/><polyline points="370,72 420,72" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="195,120 195,190" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="595,120 595,190" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="370,238 420,238" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="25" width="350" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="195.0" y="66.5" text-anchor="middle">캐시 목록</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="195.0" y="92.5" text-anchor="middle">LUID · Client · Server · 시각</text><rect x="420" y="25" width="350" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="595.0" y="66.5" text-anchor="middle">비밀 획득</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="595.0" y="92.5" text-anchor="middle">접근 · 데이터 이동의 별도 증거</text><rect x="20" y="190" width="350" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="195.0" y="231.5" text-anchor="middle">티켓 제시와 서비스 권한</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="195.0" y="2