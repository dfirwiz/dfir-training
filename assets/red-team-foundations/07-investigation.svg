<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700" role="img" aria-labelledby="title desc"><title id="title">주입 가설을 확인하는 세 가지 조사 질문</title><desc id="desc">대상 접근, 메모리 변화, 실행 흐름의 증거를 별도로 묻고 연결합니다. 특정 API 순서나 모든 변형에 공통인 공격 절차를 나타내지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="700" rx="14" fill="#0e1927"/><polyline points="350,125 350,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="207.0" y="160" width="286" height="26" rx="4" fill="#0e1927"/><text class="label" x="350" y="177" text-anchor="middle">접근만으로 변경을 확정하지 않음</text><polyline points="350,320 350,415" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="207.0" y="355" width="286" height="26" rx="4" fill="#0e1927"/><text class="label" x="350" y="372" text-anchor="middle">변경만으로 실행을 확정하지 않음</text><polyline points="350,515 350,600" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="55" y="25" width="590" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="69.0" text-anchor="middle">질문 1: 대상 접근</text><text x="350.0" y="95.0" text-anchor="middle">누가 어떤 권한으로 대상에 접근했는가?</text><rect x="55" y="220" width="590" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="264.0" text-anchor="middle">질문 2: 메모리 변화</text><text x="350.0" y="290.0" text-anchor="middle">어떤 내용·매핑·보호가 언제 바뀌었는가?</text><rect x="55" y="415" width="590" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="459.0" text-anchor="middle">질문 3: 실행 흐름</text><text x="350.0" y="485.0" text-anchor="middle">어느 스레드가 그 내용과 연결되어 실행했는가?</text><rect x="55" y="600" width="590" height="65" rx="12" fill="#193345" stroke="#80a7ff"/><text x="350.0" y="639.5" text-anchor="middle">정상 맥락·관측 한계까지 확인해 결론 조절</text></svg>