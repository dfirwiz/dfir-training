<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-labelledby="title desc"><title id="title">개선과 재검증의 반복</title><desc id="desc">아래 재검증에서 왼쪽 경로로 기준선에 되돌아가는 순환. 실제 공격 실행 절차가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="800" height="640" rx="14" fill="#0e1927"/><polyline points="405,105 405,190" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="405,270 405,355" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="405,435 405,520" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="170,560 70,560 70,65 170,65" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="12.0" y="293" width="126" height="48" rx="4" fill="#0e1927"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" class="label" x="75" y="310" text-anchor="middle">조건 변경 후</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" class="label" x="75" y="332" text-anchor="middle">기준선 갱신</text><rect x="170" y="25" width="470" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="405.0" y="59.0" text-anchor="middle">기준선과 수집 범위</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="405.0" y="85.0" text-anchor="middle">정책 · 토큰 · ACL · 로그 설정</text><rect x="170" y="190" width="470" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="405.0" y="224.0" text-anchor="middle">관측 사실 대조</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="405.0" y="250.0" text-anchor="middle">요청 · 프로세스 · 결과</text><rect x="170" y="355" width="470" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="405.0" y="389.0" text-anchor="middle">개선과 정상 기능 검토</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="405.0" y="415.0" text-anchor="middle">최소 권한 · 안전한 로더와 파서</text><rect x="170" y="520" width="470" height="80" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="405.0" y="554.0" text-anchor="middle">같은 기준으로 재검증</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="405.0" y="580.0" text-anchor="middle">미수행 시험은 미수행으로 기록</text></svg>