<svg xmlns="http://www.w3.org/2000/svg" width="722" height="154" viewBox="0 0 722 154" role="img" aria-labelledby="title desc"><title id="title">DPAPI 보호와 복구 경계</title><desc id="desc">데이터 보호에 쓰인 사용자 키와 해당 키의 도메인 복구 경로를 구분합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="722" height="154" rx="14" fill="#0e1927"/><polyline points="166,77 196,77" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="346,77 376,77" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="526,77 556,77" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="16" y="35" width="150" height="84" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="91.0" y="71.0" text-anchor="middle">앱 데이터</text><text x="91.0" y="97.0" text-anchor="middle">보호된 값</text><rect x="196" y="35" width="150" height="84" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="271.0" y="71.0" text-anchor="middle">사용자 마스터 키</text><text x="271.0" y="97.0" text-anchor="middle">데이터 보호</text><rect x="376" y="35" width="150" height="84" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="451.0" y="71.0" text-anchor="middle">복구용 보호본</text><text x="451.0" y="97.0" text-anchor="middle">도메인 경계</text><rect x="556" y="35" width="150" height="84" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="631.0" y="71.0" text-anchor="middle">백업 키</text><text x="631.0" y="97.0" text-anchor="middle">DC 복구 지원</text></svg>