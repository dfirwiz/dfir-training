<svg xmlns="http://www.w3.org/2000/svg" width="760" height="635" viewBox="0 0 760 635" role="img" aria-labelledby="title desc"><title id="title">정책과 현재 토큰의 차이</title><desc id="desc">두 관점을 나누어 아래 판단에서 연결하는 독립 개념도입니다. 실제 제품 화면이나 실행 결과가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="760" height="635" rx="14" fill="#0e1927"/><polyline points="230,115 230,165 192,165 192,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="530,115 530,165 567,165 567,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="192,360 192,420 270,420 270,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="567,360 567,420 490,420 490,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="80" y="25" width="600" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="380.0" y="64.0" text-anchor="middle">어느 시각의 무엇을 읽었는가?</text><text x="380.0" y="90.0" text-anchor="middle">정책 · 토큰 · 실제 작업 분리</text><rect x="20" y="220" width="345" height="140" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="192.5" y="271.0" text-anchor="middle">정책 할당</text><text x="192.5" y="297.0" text-anchor="middle">계정 · 그룹에 부여한 권리</text><text x="192.5" y="323.0" text-anchor="middle">기존 토큰과 시점이 다를 수 있음</text><rect x="395" y="220" width="345" height="140" rx="12" fill="#193345" stroke="#80a7ff"/><text x="567.5" y="271.0" text-anchor="middle">현재 토큰</text><text x="567.5" y="297.0" text-anchor="middle">포함 여부 · 활성 상태</text><text x="567.5" y="323.0" text-anchor="middle">호출 조건과 별도 확인</text><rect x="55" y="490" width="650" height="105" rx="12" fill="#193345" stroke="#80a7ff"/><text x="380.0" y="536.5" text-anchor="middle">특권 존재 ≠ 활성 ≠ 작업 성공</text><text x="380.0" y="562.5" text-anchor="middle">조회와 상태 변경을 구별</text></svg>