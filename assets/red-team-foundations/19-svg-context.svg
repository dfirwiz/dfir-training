<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" role="img" aria-labelledby="title desc"><title id="title">SVG의 이미지 문맥과 문서 문맥</title><desc id="desc">같은 형식도 처리 문맥에 따라 기능 제한이 다름을 비교합니다. 모든 SVG가 스크립트를 포함하거나 모든 표시에서 실행된다는 뜻은 아닙니다. 이 개념도는 정적 SVG입니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="610" rx="14" fill="#0e1927"/><polyline points="250,105 250,170 180,170 180,230" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="470,105 470,170 540,170 540,230" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="145" y="25" width="430" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="59.0" text-anchor="middle">같은 SVG 형식</text><text x="360.0" y="85.0" text-anchor="middle">실제 내용과 사용 방식을 확인</text><rect x="30" y="230" width="305" height="125" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="260.5" text-anchor="middle">이미지로 사용</text><text x="182.5" y="286.5" text-anchor="middle">예: img · CSS 이미지</text><text x="182.5" y="312.5" text-anchor="middle">스크립트 등 일부 기능 제한</text><text x="182.5" y="338.5" text-anchor="middle">브라우저 구현도 확인</text><rect x="385" y="230" width="305" height="125" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="260.5" text-anchor="middle">문서로 처리</text><text x="537.5" y="286.5" text-anchor="middle">직접 열기 · 문서 임베딩 등</text><text x="537.5" y="312.5" text-anchor="middle">문서 기능 · 연결 앱 · 정책</text><text x="537.5" y="338.5" text-anchor="middle">실제 실행 여부 별도 확인</text><rect x="95" y="490" width="530" height="70" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="532.0" text-anchor="middle">확장자만으로 실행 가능 범위를 단정하지 않습니다</text></svg>