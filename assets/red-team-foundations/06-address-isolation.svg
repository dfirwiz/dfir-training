<svg xmlns="http://www.w3.org/2000/svg" width="720" height="725" viewBox="0 0 720 725" role="img" aria-labelledby="title desc"><title id="title">같은 실행 파일과 서로 다른 프로세스 주소 공간</title><desc id="desc">독립된 두 프로세스와 현재 RAM에 상주한 서로 다른 두 페이지를 가정한 개념도입니다. 같은 가상 주소 숫자가 같은 물리 페이지를 뜻하지 않습니다. 명시적인 공유 매핑은 별도로 확인합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="725" rx="14" fill="#0e1927"/><polyline points="250,100 250,155 180,155 180,205" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="470,100 470,155 540,155 540,205" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,310 180,410" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,310 540,410" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,500 180,605" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,500 540,605" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="160" y="25" width="400" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="56.5" text-anchor="middle">디스크의 같은 프로그램 파일</text><text x="360.0" y="82.5" text-anchor="middle">설명용 app.exe</text><rect x="30" y="205" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="238.5" text-anchor="middle">프로세스 A</text><text x="182.5" y="264.5" text-anchor="middle">자신의 주소 공간·상태</text><text x="182.5" y="290.5" text-anchor="middle">가상 주소 0x1000</text><rect x="385" y="205" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="238.5" text-anchor="middle">프로세스 B</text><text x="537.5" y="264.5" text-anchor="middle">자신의 주소 공간·상태</text><text x="537.5" y="290.5" text-anchor="middle">가상 주소 0x1000</text><rect x="30" y="410" width="305" height="90" rx="12" fill="#193345" stroke="#80a7ff"/><text x="182.5" y="449.0" text-anchor="middle">A의 주소 변환 문맥</text><text x="182.5" y="475.0" text-anchor="middle">현재 매핑을 기준으로 변환</text><rect x="385" y="410" width="305" height="90" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="449.0" text-anchor="middle">B의 주소 변환 문맥</text><text x="537.5" y="475.0" text-anchor="middle">현재 매핑을 기준으로 변환</text><rect x="30" y="605" width="305" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="639.0" text-anchor="middle">물리 페이지 X</text><text x="182.5" y="665.0" text-anchor="middle">독립 매핑을 가정한 예</text><rect x="385" y="605" width="305" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="639.0" text-anchor="middle">물리 페이지 Y</text><text x="537.5" y="665.0" text-anchor="middle">독립 매핑을 가정한 예</text></svg>