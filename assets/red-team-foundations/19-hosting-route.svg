<svg xmlns="http://www.w3.org/2000/svg" width="720" height="710" viewBox="0 0 720 710" role="img" aria-labelledby="title desc"><title id="title">파일 호스팅과 C2 리스너의 별도 역할</title><desc id="desc">왼쪽은 무해한 텍스트 파일 호스팅의 가상 관계이고 오른쪽은 C2 서비스의 다른 역할입니다. 실제 제품·서버·요청을 실행하지 않았으며 두 경로를 서로 같은 성공으로 취급하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="710" rx="14" fill="#0e1927"/><polyline points="180,110 180,240" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,110 540,240" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,350 180,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,350 540,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="30" y="25" width="305" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="61.5" text-anchor="middle">Host File의 원본</text><text x="182.5" y="87.5" text-anchor="middle">무해한 readme.txt</text><rect x="385" y="25" width="305" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="61.5" text-anchor="middle">C2 리스너 설정</text><text x="537.5" y="87.5" text-anchor="middle">앞 장의 별도 구성</text><rect x="30" y="240" width="305" height="110" rx="12" fill="#193345" stroke="#80a7ff"/><text x="182.5" y="276.0" text-anchor="middle">웹 호스팅 리소스</text><text x="182.5" y="302.0" text-anchor="middle">/training/readme.txt</text><text x="182.5" y="328.0" text-anchor="middle">실습 가정: 포트 8081</text><rect x="385" y="240" width="305" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="276.0" text-anchor="middle">에이전트 통신 서비스</text><text x="537.5" y="302.0" text-anchor="middle">별도의 프로토콜·경로</text><text x="537.5" y="328.0" text-anchor="middle">호스팅 등록과 구별</text><rect x="30" y="490" width="305" height="120" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="531.0" text-anchor="middle">허용된 HTTP 요청·응답</text><text x="182.5" y="557.0" text-anchor="middle">본문 TRAINING_ONLY 확인</text><text x="182.5" y="583.0" text-anchor="middle">저장과 실행은 다른 단계</text><rect x="385" y="490" width="305" height="120" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="531.0" text-anchor="middle">에이전트 통신·세션</text><text x="537.5" y="557.0" text-anchor="middle">리스너 저장만으로</text><text x="537.5" y="583.0" text-anchor="middle">세션이 생기지는 않음</text><rect x="55" y="650" width="610" height="40" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="677.0" text-anchor="middle">같은 제품 안의 기능이어도 포트와 성공 조건은 별개입니다</text></svg>