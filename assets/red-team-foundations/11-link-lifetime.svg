<svg xmlns="http://www.w3.org/2000/svg" width="700" height="680" viewBox="0 0 700 680" role="img" aria-labelledby="title desc"><title id="title">링크 수명과 프로세스 수명의 구별</title><desc id="desc">실행과 링크 형성, 링크 해제 후 대기, 실제 프로세스 종료는 다른 상태입니다. 되돌아가는 선은 다시 연결될 가능성을 뜻하며 링크 해제에서 종료로 가는 자동 전이는 표시하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="680" rx="14" fill="#0e1927"/><polyline points="190,105 190,205" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="340,247 405,247" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="190,285 190,385" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="340,427 590,427 590,125 190,125 190,205" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="40" y="25" width="300" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="190.0" y="59.0" text-anchor="middle">에이전트 실행</text><text x="190.0" y="85.0" text-anchor="middle">부모 연결은 아직 미확인</text><rect x="40" y="205" width="300" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="190.0" y="239.0" text-anchor="middle">부모와 링크 형성</text><text x="190.0" y="265.0" text-anchor="middle">작업·결과의 경로 연결</text><rect x="40" y="385" width="300" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="190.0" y="421.5" text-anchor="middle">링크 해제</text><text x="190.0" y="447.5" text-anchor="middle">다시 연결을 기다릴 수 있음</text><rect x="405" y="205" width="250" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="530.0" y="241.5" text-anchor="middle">서버와 통신 확인</text><text x="530.0" y="267.5" text-anchor="middle">작업 상태는 별도 확인</text><rect x="140" y="565" width="420" height="80" rx="12" fill="#193345" stroke="#80a7ff"/><text x="350.0" y="599.0" text-anchor="middle">실제 프로세스 종료·자원 정리</text><text x="350.0" y="625.0" text-anchor="middle">링크 해제만으로 입증하지 않음</text></svg>