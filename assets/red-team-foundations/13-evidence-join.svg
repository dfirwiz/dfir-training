<svg xmlns="http://www.w3.org/2000/svg" width="700" height="610" viewBox="0 0 700 610" role="img" aria-labelledby="title desc"><title id="title">운영 기록과 방어 관측의 연결</title><desc id="desc">서로 다른 관측의 출처·식별자·시각을 맞춰 주장에 필요한 증거를 연결합니다. 지지되는 결론과 아직 추가 증거가 필요한 부분을 분리합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="610" rx="14" fill="#0e1927"/><polyline points="122,125 122,200 220,200 220,270" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="350,125 350,270" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="576,125 576,200 480,200 480,270" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="220,370 220,430 180,430 180,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="480,370 480,430 520,430 520,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="25" width="205" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="122.5" y="69.0" text-anchor="middle">운영 기록</text><text x="122.5" y="95.0" text-anchor="middle">서버 · 세션 · 작업 ID</text><rect x="247" y="25" width="205" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="349.5" y="69.0" text-anchor="middle">단말 관측</text><text x="349.5" y="95.0" text-anchor="middle">호스트 · 프로세스</text><rect x="474" y="25" width="205" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="576.5" y="69.0" text-anchor="middle">네트워크 관측</text><text x="576.5" y="95.0" text-anchor="middle">연결 · 이름 · 시각</text><rect x="80" y="270" width="540" height="100" rx="12" fill="#193345" stroke="#80a7ff"/><text x="350.0" y="314.0" text-anchor="middle">출처와 식별자 · 시각 기준 연결</text><text x="350.0" y="340.0" text-anchor="middle">발생 시각과 수집 시각 구별</text><rect x="25" y="490" width="310" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="180.0" y="534.5" text-anchor="middle">관측이 지지하는 결론</text><rect x="365" y="490" width="310" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="520.0" y="534.5" text-anchor="middle">추가 증거가 필요한 부분</text></svg>