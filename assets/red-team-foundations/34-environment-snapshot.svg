<svg xmlns="http://www.w3.org/2000/svg" width="760" height="635" viewBox="0 0 760 635" role="img" aria-labelledby="title desc"><title id="title">저장 설정과 현재 환경</title><desc id="desc">양쪽 증거를 비교하여 아래 판단에서 연결하는 독립 개념도. 실제 화면이나 실행 결과가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="760" height="635" rx="14" fill="#0e1927"/><polyline points="230,115 230,165 190,165 190,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="530,115 530,165 570,165 570,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="190,360 190,420 265,420 265,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="570,360 570,420 495,420 495,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="55" y="25" width="650" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="380.0" y="64.0" text-anchor="middle">어느 프로세스의 PATH인가?</text><text x="380.0" y="90.0" text-anchor="middle">계정 · 시작 시각 · 부모 확인</text><rect x="15" y="220" width="350" height="140" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="190.0" y="271.0" text-anchor="middle">저장된 설정</text><text x="190.0" y="297.0" text-anchor="middle">사용자 / 시스템 Path</text><text x="190.0" y="323.0" text-anchor="middle">환경 변수 창에서 읽기</text><rect x="395" y="220" width="350" height="140" rx="12" fill="#193345" stroke="#80a7ff"/><text x="570.0" y="271.0" text-anchor="middle">프로세스 환경 블록</text><text x="570.0" y="297.0" text-anchor="middle">상속 또는 명시적 제공</text><text x="570.0" y="323.0" text-anchor="middle">설정과 자동 동기화 아님</text><rect x="35" y="490" width="690" height="105" rx="12" fill="#193345" stroke="#80a7ff"/><text x="380.0" y="536.5" text-anchor="middle">두 값의 주체와 시점을 대조</text><text x="380.0" y="562.5" text-anchor="middle">내 콘솔 값 ≠ 서비스 환경</text></svg>