<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc"><title id="title">하나의 섹션에서 갈라지는 두 RVA</title><desc id="desc">본문의 합성 데이터와 같은 가상 값입니다. 두 RVA 모두 메모리상 섹션 범위 안이지만, 0x1120만 파일 바이트와 대응하고 0x1350은 0 채움 구간입니다. 도형 크기는 실제 바이트 크기에 비례하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="700" rx="14" fill="#0e1927"/><polyline points="180,130 180,235" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,130 540,235" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,335 180,440" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,335 540,440" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="55" y="25" width="610" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="58.5" text-anchor="middle">같은 .data 섹션의 가상 배치</text><text x="360.0" y="84.5" text-anchor="middle">섹션 RVA 0x1000 · VirtualSize 0x500</text><text x="360.0" y="110.5" text-anchor="middle">원시 시작 0x200 · 원시 크기 0x200</text><rect x="30" y="235" width="305" height="100" rx="12" fill="#193345" stroke="#80a7ff"/><text x="182.5" y="266.0" text-anchor="middle">질문 A: RVA 0x1120</text><text x="182.5" y="292.0" text-anchor="middle">내부 위치 = 0x120</text><text x="182.5" y="318.0" text-anchor="middle">원시 크기 0x200보다 작음</text><rect x="385" y="235" width="305" height="100" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="266.0" text-anchor="middle">질문 B: RVA 0x1350</text><text x="537.5" y="292.0" text-anchor="middle">내부 위치 = 0x350</text><text x="537.5" y="318.0" text-anchor="middle">가상 크기 안 · 원시 크기 밖</text><rect x="30" y="440" width="305" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="471.0" text-anchor="middle">파일 바이트와 대응</text><text x="182.5" y="497.0" text-anchor="middle">0x200 + 0x120 = 0x320</text><text x="182.5" y="523.0" text-anchor="middle">실제 파일 범위도 확인</text><rect x="385" y="440" width="305" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="471.0" text-anchor="middle">0으로 채워지는 구간</text><text x="537.5" y="497.0" text-anchor="middle">대응 파일 바이트 없음</text><text x="537.5" y="523.0" text-anchor="middle">파일 위치를 억지로 계산하지 않음</text><rect x="55" y="605" width="610" height="60" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="642.0" text-anchor="middle">RVA가 존재해도 대응하는 파일 오프셋은 없을 수 있습니다</text></svg>