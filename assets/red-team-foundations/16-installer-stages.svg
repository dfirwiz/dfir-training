<svg xmlns="http://www.w3.org/2000/svg" width="720" height="690" viewBox="0 0 720 690" role="img" aria-labelledby="title desc"><title id="title">MSI의 계획과 조건부 수행 결과</title><desc id="desc">MSI의 정적 구성과 실행 시점 조건, 실제 로그·결과를 구별하는 조사 관계입니다. Custom Action 생성이나 설치 실행 절차를 제시하는 도표가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="690" rx="14" fill="#0e1927"/><polyline points="180,120 180,180 260,180 260,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,120 540,180 460,180 460,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="260,360 260,445 180,445 180,525" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="460,360 460,445 540,445 540,525" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="30" y="25" width="305" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="66.5" text-anchor="middle">MSI 안의 파일·배치 정보</text><text x="182.5" y="92.5" text-anchor="middle">File · Directory 등</text><rect x="385" y="25" width="305" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="66.5" text-anchor="middle">MSI 안의 작업·순서</text><text x="537.5" y="92.5" text-anchor="middle">CustomAction · 실행 조건</text><rect x="125" y="245" width="470" height="115" rx="12" fill="#193345" stroke="#80a7ff"/><text x="360.0" y="283.5" text-anchor="middle">설치 시점의 실행 문맥</text><text x="360.0" y="309.5" text-anchor="middle">정책 · 사용자 · 선행 조건 · 원천</text><text x="360.0" y="335.5" text-anchor="middle">계획 중 무엇이 실제 수행됐는가?</text><rect x="30" y="525" width="305" height="115" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="563.5" text-anchor="middle">실제로 확인한 결과</text><text x="182.5" y="589.5" text-anchor="middle">생성 파일 · 수행 작업 · 로그</text><text x="182.5" y="615.5" text-anchor="middle">후속 실행 여부는 따로 확인</text><rect x="385" y="525" width="305" height="115" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="563.5" text-anchor="middle">계획에만 있는 작업</text><text x="537.5" y="589.5" text-anchor="middle">미실행·실패·조건 불충족 가능</text><text x="537.5" y="615.5" text-anchor="middle">존재만으로 수행을 확정하지 않음</text></svg>