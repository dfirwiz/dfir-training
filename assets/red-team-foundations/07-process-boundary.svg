<svg xmlns="http://www.w3.org/2000/svg" width="720" height="585" viewBox="0 0 720 585" role="img" aria-labelledby="title desc"><title id="title">자체 실행과 프로세스 경계를 넘는 실행의 구별</title><desc id="desc">위쪽은 A 내부의 자원 관계, 아래쪽은 서로 다른 A와 B의 관계입니다. 아래 화살표는 조사할 관계이며 특정 공격 API 순서를 뜻하지 않습니다. 접근 또는 변경만으로 실행이나 악성을 확정하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="585" rx="14" fill="#0e1927"/><polyline points="335,195 385,195" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="335,487 385,487" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="30" y="25" width="660" height="60" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="62.0" text-anchor="middle">비교 A: 같은 프로세스 안에서의 실행</text><rect x="30" y="145" width="305" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="189.0" text-anchor="middle">프로세스 A의 메모리</text><text x="182.5" y="215.0" text-anchor="middle">A 안의 코드·생성 코드</text><rect x="385" y="145" width="305" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="189.0" text-anchor="middle">프로세스 A의 스레드</text><text x="537.5" y="215.0" text-anchor="middle">A의 메모리에서 실행</text><rect x="30" y="315" width="660" height="60" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="352.0" text-anchor="middle">비교 B: 다른 프로세스의 실행과 연결된 경우</text><rect x="30" y="435" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="481.5" text-anchor="middle">소스 프로세스 A</text><text x="182.5" y="507.5" text-anchor="middle">대상 접근·변경 관계 조사</text><rect x="385" y="435" width="305" height="105" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="468.5" text-anchor="middle">대상 프로세스 B</text><text x="537.5" y="494.5" text-anchor="middle">B의 메모리·스레드</text><text x="537.5" y="520.5" text-anchor="middle">실제 실행 여부 확인</text></svg>