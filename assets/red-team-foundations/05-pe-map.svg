<svg xmlns="http://www.w3.org/2000/svg" width="700" height="760" viewBox="0 0 700 760" role="img" aria-labelledby="title desc"><title id="title">PE 파일의 구조와 위치 참조</title><desc id="desc">세로 배열은 주요 구조의 순서이며 비례도는 아닙니다. e_lfanew는 가변 영역을 건너 PE 서명을 가리킵니다. 섹션 표는 실제 원시 데이터 위치를 알려 줍니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="760" rx="14" fill="#0e1927"/><polyline points="240,105 240,160" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="445,65 585,65 585,310 445,310" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="496.0" y="148" width="158" height="48" rx="4" fill="#0e1927"/><text class="label" x="575" y="165" text-anchor="middle">e_lfanew가</text><text class="label" x="575" y="187" text-anchor="middle">가리키는 곳</text><polyline points="240,340 240,390" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="240,450 240,500" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="160,570 160,620" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="285,670 385,670" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="25" width="410" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="240.0" y="59.0" text-anchor="middle">DOS 헤더</text><text x="240.0" y="85.0" text-anchor="middle">MZ와 e_lfanew</text><rect x="35" y="160" width="410" height="60" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="240.0" y="197.0" text-anchor="middle">DOS 스텁 등 가변 영역</text><rect x="35" y="280" width="410" height="60" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="240.0" y="317.0" text-anchor="middle">PE 서명</text><rect x="35" y="390" width="410" height="60" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="240.0" y="427.0" text-anchor="middle">COFF 파일 헤더: 20바이트</text><rect x="35" y="500" width="410" height="70" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="240.0" y="529.0" text-anchor="middle">선택 헤더</text><text x="240.0" y="555.0" text-anchor="middle">적재 정보·데이터 디렉터리</text><rect x="35" y="620" width="250" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="160.0" y="664.0" text-anchor="middle">섹션 표</text><text x="160.0" y="690.0" text-anchor="middle">각 항목 40바이트</text><rect x="385" y="620" width="270" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="520.0" y="664.0" text-anchor="middle">섹션 원시 데이터</text><text x="520.0" y="690.0" text-anchor="middle">실제 파일 위치</text></svg>