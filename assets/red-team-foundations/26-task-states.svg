<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img" aria-labelledby="title desc"><title id="title">입력에서 완료까지 나누어 확인</title><desc id="desc">화살표는 확인할 단계입니다. 실제 모든 제품 이벤트의 고정 순서가 아니며 장기 작업은 출력과 종료를 나누어 봅니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="780" rx="14" fill="#0e1927"/><polyline points="195,110 195,210" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="195,295 195,395" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="195,480 195,620" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="124.0" y="538" width="142" height="26" rx="4" fill="#0e1927"/><text class="label" x="195" y="555" text-anchor="middle">별도 완료 필요</text><polyline points="345,437 430,437" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="45" y="25" width="300" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="195.0" y="61.5" text-anchor="middle">요청 기록</text><text x="195.0" y="87.5" text-anchor="middle">입력·작업 ID·대상</text><rect x="45" y="210" width="300" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="195.0" y="246.5" text-anchor="middle">대상에 전달</text><text x="195.0" y="272.5" text-anchor="middle">실제 가져간 시각</text><rect x="45" y="395" width="300" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="195.0" y="431.5" text-anchor="middle">출력 일부 수신</text><text x="195.0" y="457.5" text-anchor="middle">완료라고 단정 금지</text><rect x="45" y="620" width="300" height="100" rx="12" fill="#193345" stroke="#80a7ff"/><text x="195.0" y="664.0" text-anchor="middle">완료 상태와 결과 확인</text><text x="195.0" y="690.0" text-anchor="middle">작업 종류·버전 고려</text><rect x="430" y="395" width="245" height="115" rx="12" fill="#193345" stroke="#80a7ff"/><text x="552.5" y="433.5" text-anchor="middle">장기 작업</text><text x="552.5" y="459.5" text-anchor="middle">출력이 있어도</text><text x="552.5" y="485.5" text-anchor="middle">계속 실행될 수 있음</text></svg>