<svg xmlns="http://www.w3.org/2000/svg" width="680" height="254" viewBox="0 0 680 254" role="img" aria-labelledby="title desc"><title id="title">프록시로 넘긴 주소형</title><desc id="desc">로컬 해석으로 얻은 숫자 주소를 전달하는 경우와 이름을 전달하는 경우를 비교합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="680" height="254" rx="14" fill="#0e1927"/><polyline points="340,99 340,122 200,122 200,155" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="340,99 340,122 480,122 480,155" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="230" y="25" width="220" height="74" rx="12" fill="#193345" stroke="#80a7ff"/><text x="340.0" y="56.0" text-anchor="middle">목적지 지정</text><text x="340.0" y="82.0" text-anchor="middle">이름 또는 숫자</text><rect x="90" y="155" width="220" height="74" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="186.0" text-anchor="middle">로컬에서 해석</text><text x="200.0" y="212.0" text-anchor="middle">숫자 주소 전달</text><rect x="370" y="155" width="220" height="74" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="480.0" y="186.0" text-anchor="middle">이름을 전달</text><text x="480.0" y="212.0" text-anchor="middle">중계 쪽에서 해석</text></svg>