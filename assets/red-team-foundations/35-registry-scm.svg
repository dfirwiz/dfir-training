<svg xmlns="http://www.w3.org/2000/svg" width="760" height="635" viewBox="0 0 760 635" role="img" aria-labelledby="title desc"><title id="title">키와 SCM의 접근 검사</title><desc id="desc">양쪽 증거를 비교하여 아래 판단에서 연결하는 독립 개념도. 실제 화면이나 실행 결과가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="760" height="635" rx="14" fill="#0e1927"/><polyline points="230,115 230,165 190,165 190,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="530,115 530,165 570,165 570,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="190,360 190,420 265,420 265,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="570,360 570,420 495,420 495,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="55" y="25" width="650" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="380.0" y="64.0" text-anchor="middle">같은 서비스 구성과 관련</text><text x="380.0" y="90.0" text-anchor="middle">하지만 다른 요청 경로</text><rect x="15" y="220" width="350" height="140" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="190.0" y="271.0" text-anchor="middle">레지스트리 API</text><text x="190.0" y="297.0" text-anchor="middle">키 ACL · 값 접근</text><text x="190.0" y="323.0" text-anchor="middle">QueryValues / SetValue</text><rect x="395" y="220" width="350" height="140" rx="12" fill="#193345" stroke="#80a7ff"/><text x="570.0" y="271.0" text-anchor="middle">SCM API</text><text x="570.0" y="297.0" text-anchor="middle">서비스 객체 보안 설명자</text><text x="570.0" y="323.0" text-anchor="middle">QUERY / CHANGE_CONFIG</text><rect x="35" y="490" width="690" height="105" rx="12" fill="#193345" stroke="#80a7ff"/><text x="380.0" y="536.5" text-anchor="middle">키 쓰기 허용 ≠ SCM 변경 허용</text><text x="380.0" y="562.5" text-anchor="middle">구성 반영 · 실행은 별도 관측</text></svg>