<svg xmlns="http://www.w3.org/2000/svg" width="700" height="600" viewBox="0 0 700 600" role="img" aria-labelledby="title desc"><title id="title">통합 화면에서도 출처를 유지</title><desc id="desc">한 Client에서 여러 서버를 볼 수 있어도 서버별 세션 출처는 유지합니다. A/17과 B/17은 이 강의에서 만든 식별 예이며 같은 세션을 뜻하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="600" rx="14" fill="#0e1927"/><polyline points="260,110 260,175 177,175 177,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="440,110 440,175 522,175 522,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="177,340 177,465" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="522,340 522,465" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="150" y="25" width="400" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="61.5" text-anchor="middle">하나의 Client</text><text x="350.0" y="87.5" text-anchor="middle">여러 서버의 정보 함께 보기</text><rect x="35" y="245" width="285" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="177.5" y="286.5" text-anchor="middle">Team Server A</text><text x="177.5" y="312.5" text-anchor="middle">기록 출처 A</text><rect x="380" y="245" width="285" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="522.5" y="286.5" text-anchor="middle">Team Server B</text><text x="522.5" y="312.5" text-anchor="middle">기록 출처 B</text><rect x="35" y="465" width="285" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="177.5" y="504.0" text-anchor="middle">가상 세션 A/17</text><text x="177.5" y="530.0" text-anchor="middle">서버 A의 세션 17</text><rect x="380" y="465" width="285" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="522.5" y="504.0" text-anchor="middle">가상 세션 B/17</text><text x="522.5" y="530.0" text-anchor="middle">서버 B의 세션 17</text></svg>