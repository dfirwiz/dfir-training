<svg xmlns="http://www.w3.org/2000/svg" width="890" height="325" viewBox="0 0 890 325" role="img" aria-labelledby="title desc"><title id="title">가상 시간표의 유효 구간과 갱신 상한</title><desc id="desc">간격은 축척이 아닙니다. 현재 유효 기간에서 승인된 갱신과 만료 후의 불가 사례를 비교합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="890" height="325" rx="14" fill="#0e1927"/><polyline points="255,82 330,82" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="560,82 635,82" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="278,82 278,163 175,163 175,210" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="585,82 585,163 652,163 652,210" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="25" y="42" width="230" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="140.0" y="76.0" text-anchor="middle">StartTime</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="140.0" y="102.0" text-anchor="middle">11월 5일 08:00 UTC</text><rect x="330" y="42" width="230" height="80" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="445.0" y="76.0" text-anchor="middle">EndTime</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="445.0" y="102.0" text-anchor="middle">11월 5일 18:00 UTC</text><rect x="635" y="42" width="230" height="80" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="750.0" y="76.0" text-anchor="middle">RenewTill</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="750.0" y="102.0" text-anchor="middle">11월 12일 08:00 UTC</text><rect x="25" y="210" width="305" height="82" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="177.5" y="245.0" text-anchor="middle">17:30 갱신 승인 시</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="177.5" y="271.0" text-anchor="middle">새 EndTime 11월 6일 03:30</text><rect x="440" y="210" width="425" height="82" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="652.5" y="245.0" text-anchor="middle">기존 티켓이 이미 만료된 경우</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="652.5" y="271.0" text-anchor="middle">갱신 상한이 미래여도 갱신 불가</text></svg>