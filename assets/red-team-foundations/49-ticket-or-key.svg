<svg xmlns="http://www.w3.org/2000/svg" width="880" height="328" viewBox="0 0 880 328" role="img" aria-labelledby="title desc"><title id="title">기존 티켓과 장기 키의 경로 차이</title><desc id="desc">왼쪽은 기존 티켓 사용입니다. 오른쪽은 정책이 허용할 때 새 TGT를 요청하는 별도 경로입니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="328" rx="14" fill="#0e1927"/><polyline points="221,115 221,210" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="659,115 659,210" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="22" y="25" width="398" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="221.0" y="64.0" text-anchor="middle">이미 발급된 티켓</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="221.0" y="90.0" text-anchor="middle">대상과 유효 기간을 확인</text><rect x="460" y="25" width="398" height="90" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="659.0" y="64.0" text-anchor="middle">계정 장기 키</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="659.0" y="90.0" text-anchor="middle">새 AS 교환과 KDC 정책 검사</text><rect x="22" y="210" width="398" height="94" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="221.0" y="251.0" text-anchor="middle">현재 사용 시점에</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="221.0" y="277.0" text-anchor="middle">새 초기 발급 없이 사용 가능</text><rect x="460" y="210" width="398" height="94" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="659.0" y="251.0" text-anchor="middle">발급 성공 여부와 별도로</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="659.0" y="277.0" text-anchor="middle">실제 서비스 사용을 확인</text></svg>