<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">훈련 목표에 따라 다른 세 경계와 증거</title><desc id="desc">경계별 질문을 오른쪽 확인 증거에 대응시킵니다. 아래 방향은 다음에 별도로 확인할 질문이며 자동 성공 순서가 아닙니다. UAC 창 표시와 동의·토큰 변화도 구별합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="650" rx="14" fill="#0e1927"/><polyline points="335,77 385,77" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="335,297 385,297" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="335,517 385,517" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,130 180,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="77.0" y="173" width="206" height="26" rx="4" fill="#0e1927"/><text class="label" x="180" y="190" text-anchor="middle">실행 여부는 별도 확인</text><polyline points="180,350 180,465" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="77.0" y="393" width="206" height="26" rx="4" fill="#0e1927"/><text class="label" x="180" y="410" text-anchor="middle">권한 변화는 별도 확인</text><rect x="30" y="25" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="71.5" text-anchor="middle">전달 경계</text><text x="182.5" y="97.5" text-anchor="middle">사용자에게 내용이 도달했는가?</text><rect x="385" y="25" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="71.5" text-anchor="middle">전달 증거</text><text x="537.5" y="97.5" text-anchor="middle">사서함 결과 · 다운로드 · 저장</text><rect x="30" y="245" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="291.5" text-anchor="middle">실행 경계</text><text x="182.5" y="317.5" text-anchor="middle">실제 코드 실행과 연결됐는가?</text><rect x="385" y="245" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="291.5" text-anchor="middle">실행 증거</text><text x="537.5" y="317.5" text-anchor="middle">프로세스 생성 · 명령줄</text><rect x="30" y="465" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="511.5" text-anchor="middle">보안 문맥 경계</text><text x="182.5" y="537.5" text-anchor="middle">어떤 사용자·권한으로 동작했나?</text><rect x="385" y="465" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="511.5" text-anchor="middle">문맥 증거</text><text x="537.5" y="537.5" text-anchor="middle">사용자 · 토큰 · 무결성 수준</text></svg>