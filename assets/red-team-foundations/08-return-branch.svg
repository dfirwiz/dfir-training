<svg xmlns="http://www.w3.org/2000/svg" width="720" height="635" viewBox="0 0 720 635" role="img" aria-labelledby="title desc"><title id="title">파일 속성 조회의 반환값과 오류 분기</title><desc id="desc">본문의 .NET 6 이상 Windows용 교육 예제에 대응하는 판단 흐름입니다. 0이 아닌 반환값을 무조건 성공으로 보지 않습니다. 오류는 API 실패 조건을 확인한 뒤 읽으며 실제 Windows 호출을 실행한 도표는 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="635" rx="14" fill="#0e1927"/><polyline points="360,110 360,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="250,300 250,375 180,375 180,450" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="165.0" y="363" width="30" height="26" rx="4" fill="#0e1927"/><text class="label" x="180" y="380" text-anchor="middle">예</text><polyline points="470,300 470,375 540,375 540,450" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="509.0" y="363" width="62" height="26" rx="4" fill="#0e1927"/><text class="label" x="540" y="380" text-anchor="middle">아니오</text><rect x="120" y="25" width="480" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="61.5" text-anchor="middle">GetFileAttributesW 호출</text><text x="360.0" y="87.5" text-anchor="middle">uint attributes에 반환값 보관</text><rect x="145" y="215" width="430" height="85" rx="12" fill="#193345" stroke="#80a7ff"/><text x="360.0" y="251.5" text-anchor="middle">attributes == 0xFFFFFFFF ?</text><text x="360.0" y="277.5" text-anchor="middle">해당 API의 실패값과 비교</text><rect x="30" y="450" width="305" height="120" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="478.0" text-anchor="middle">예: 실패 경로</text><text x="182.5" y="504.0" text-anchor="middle">보존된 오류를 즉시 읽음</text><text x="182.5" y="530.0" text-anchor="middle">GetLastPInvokeError</text><text x="182.5" y="556.0" text-anchor="middle">SetLastError=true 전제</text><rect x="385" y="450" width="305" height="120" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="478.0" text-anchor="middle">아니오: 성공 경로</text><text x="537.5" y="504.0" text-anchor="middle">반환된 속성 비트 해석</text><text x="537.5" y="530.0" text-anchor="middle">과거 오류값으로</text><text x="537.5" y="556.0" text-anchor="middle">이번 호출을 실패로 보지 않음</text></svg>