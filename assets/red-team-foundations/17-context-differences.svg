<svg xmlns="http://www.w3.org/2000/svg" width="720" height="625" viewBox="0 0 720 625" role="img" aria-labelledby="title desc"><title id="title">같은 파일과 다른 실행 문맥</title><desc id="desc">조건 차이가 결과에 영향을 줄 수 있음을 보여 주는 가상 비교입니다. 두 결과가 반드시 다르다는 뜻도, 무반응이 모든 환경의 실행 불가를 입증한다는 뜻도 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="625" rx="14" fill="#0e1927"/><polyline points="250,100 250,165 180,165 180,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="470,100 470,165 540,165 540,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,350 180,480" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,350 540,480" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="150" y="25" width="420" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="56.5" text-anchor="middle">같은 스크립트 파일 내용</text><text x="360.0" y="82.5" text-anchor="middle">같은 해시라고 가정</text><rect x="30" y="225" width="305" height="125" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="255.5" text-anchor="middle">가상 환경 A</text><text x="182.5" y="281.5" text-anchor="middle">작업 폴더 · 환경 변수</text><text x="182.5" y="307.5" text-anchor="middle">부모 명령줄 · 사용자 토큰</text><text x="182.5" y="333.5" text-anchor="middle">상호작용 · 네트워크 조건</text><rect x="385" y="225" width="305" height="125" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="255.5" text-anchor="middle">가상 환경 B</text><text x="537.5" y="281.5" text-anchor="middle">A와 다른 조건일 수 있음</text><text x="537.5" y="307.5" text-anchor="middle">실행한 분기 · 오류 확인</text><text x="537.5" y="333.5" text-anchor="middle">관측 기간 · 수집 구성 확인</text><rect x="30" y="480" width="305" height="95" rx="12" fill="#193345" stroke="#80a7ff"/><text x="182.5" y="521.5" text-anchor="middle">A에서 관측한 결과</text><text x="182.5" y="547.5" text-anchor="middle">환경 A의 조건과 함께 기록</text><rect x="385" y="480" width="305" height="95" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="521.5" text-anchor="middle">B에서 관측한 결과</text><text x="537.5" y="547.5" text-anchor="middle">A의 결과를 복사하지 않음</text></svg>