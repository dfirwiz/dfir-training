<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img" aria-labelledby="title desc"><title id="title">표시와 장기 작업의 중지</title><desc id="desc">대상 실행·결과 표시·중지·보관 자료의 수명을 구별합니다. UI를 닫거나 출력만 숨긴 상태는 중지 확인이 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="780" rx="14" fill="#0e1927"/><polyline points="190,120 190,255" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="340,302 410,302" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="545,350 545,560" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="482.0" y="438" width="126" height="26" rx="4" fill="#0e1927"/><text class="label" x="545" y="455" text-anchor="middle">요청 ≠ 완료</text><polyline points="190,350 190,560" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="40" y="25" width="300" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="190.0" y="66.5" text-anchor="middle">대상 장기 작업 실행</text><text x="190.0" y="92.5" text-anchor="middle">Job ID·세션·PID 기록</text><rect x="40" y="255" width="300" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="190.0" y="296.5" text-anchor="middle">출력 수신·표시</text><text x="190.0" y="322.5" text-anchor="middle">Hide 또는 탭 닫기와 구별</text><rect x="410" y="255" width="270" height="95" rx="12" fill="#193345" stroke="#80a7ff"/><text x="545.0" y="296.5" text-anchor="middle">중지 요청</text><text x="545.0" y="322.5" text-anchor="middle">정확한 작업만 선택</text><rect x="410" y="560" width="270" height="105" rx="12" fill="#193345" stroke="#80a7ff"/><text x="545.0" y="606.5" text-anchor="middle">중지 확인</text><text x="545.0" y="632.5" text-anchor="middle">새 상태·후속 출력 점검</text><rect x="40" y="560" width="300" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="190.0" y="606.5" text-anchor="middle">보관 자료</text><text x="190.0" y="632.5" text-anchor="middle">저장·삭제는 별도 절차</text></svg>