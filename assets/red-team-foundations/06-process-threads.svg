<svg xmlns="http://www.w3.org/2000/svg" width="700" height="540" viewBox="0 0 700 540" role="img" aria-labelledby="title desc"><title id="title">프로세스의 공유 자원과 스레드별 상태</title><desc id="desc">프로세스 안의 두 스레드는 가상 주소 공간의 자원을 공유하지만 스택과 레지스터 상태는 각각 가집니다. 화살표는 자원 관계이며 실행 순서를 뜻하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="540" rx="14" fill="#0e1927"/><polyline points="350,105 350,190" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="177,275 177,385" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="154.0" y="318" width="46" height="26" rx="4" fill="#0e1927"/><text class="label" x="177" y="335" text-anchor="middle">공유</text><polyline points="522,275 522,385" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="499.0" y="318" width="46" height="26" rx="4" fill="#0e1927"/><text class="label" x="522" y="335" text-anchor="middle">공유</text><rect x="35" y="25" width="630" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="59.0" text-anchor="middle">프로세스 P</text><text x="350.0" y="85.0" text-anchor="middle">하나의 가상 주소 공간</text><rect x="35" y="190" width="630" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="226.5" text-anchor="middle">공유 자원</text><text x="350.0" y="252.5" text-anchor="middle">코드 · 데이터 · 힙 · 열린 자원</text><rect x="35" y="385" width="285" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="177.5" y="421.0" text-anchor="middle">스레드 A</text><text x="177.5" y="447.0" text-anchor="middle">자신의 스택</text><text x="177.5" y="473.0" text-anchor="middle">자신의 레지스터 상태</text><rect x="380" y="385" width="285" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="522.5" y="421.0" text-anchor="middle">스레드 B</text><text x="522.5" y="447.0" text-anchor="middle">자신의 스택</text><text x="522.5" y="473.0" text-anchor="middle">자신의 레지스터 상태</text></svg>