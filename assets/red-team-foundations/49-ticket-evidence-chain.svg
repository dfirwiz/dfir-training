<svg xmlns="http://www.w3.org/2000/svg" width="880" height="317" viewBox="0 0 880 317" role="img" aria-labelledby="title desc"><title id="title">티켓의 발급·보관·제시·작업</title><desc id="desc">로컬 캐시에 보이는 상태와 서비스가 인정한 인증 및 실제 자원 작업은 별개입니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="317" rx="14" fill="#0e1927"/><polyline points="220,86 235,86" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="435,86 450,86" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="650,86 665,86" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="765,142 765,185 630,185 630,223" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="30" width="200" height="112" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="120.0" y="80.0" text-anchor="middle">발급</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="120.0" y="106.0" text-anchor="middle">DC의 감사</text><rect x="235" y="30" width="200" height="112" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="335.0" y="80.0" text-anchor="middle">로컬 보관</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="335.0" y="106.0" text-anchor="middle">LUID별 목록</text><rect x="450" y="30" width="200" height="112" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="550.0" y="80.0" text-anchor="middle">서비스 제시</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="550.0" y="106.0" text-anchor="middle">인증 결과</text><rect x="665" y="30" width="200" height="112" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="765.0" y="80.0" text-anchor="middle">자원 작업</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="765.0" y="106.0" text-anchor="middle">권한·결과</text><rect x="190" y="223" width="500" height="70" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="265.0" text-anchor="middle">앞 단계가 성공해도 뒤 단계의 증거가 필요</text></svg>