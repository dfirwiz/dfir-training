<svg xmlns="http://www.w3.org/2000/svg" width="720" height="675" viewBox="0 0 720 675" role="img" aria-labelledby="title desc"><title id="title">전달과 포장 안에서 구별하는 다섯 역할</title><desc id="desc">다섯 역할의 분류와 전달·포함 관계를 보여 주며 실행 시간표가 아닙니다. 세 역할이 반드시 별도 파일이어야 하거나 모든 사례에 별도 컨테이너가 있어야 하는 것은 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="675" rx="14" fill="#0e1927"/><polyline points="360,105 360,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="305.0" y="153" width="110" height="26" rx="4" fill="#0e1927"/><text class="label" x="360" y="170" text-anchor="middle">내용을 전달</text><polyline points="245,315 245,395 130,395 130,480" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="360,315 360,480" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="289.0" y="388" width="142" height="26" rx="4" fill="#0e1927"/><text class="label" x="360" y="405" text-anchor="middle">포함 관계의 예</text><polyline points="475,315 475,395 590,395 590,480" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="150" y="25" width="420" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="59.0" text-anchor="middle">Delivery: 전달 경로</text><text x="360.0" y="85.0" text-anchor="middle">메일 첨부 · 웹 링크 등의 예</text><rect x="85" y="225" width="550" height="90" rx="12" fill="#193345" stroke="#80a7ff"/><text x="360.0" y="264.0" text-anchor="middle">Container: 포장 역할</text><text x="360.0" y="290.0" text-anchor="middle">안의 구성 요소를 묶음 · 별도 포장이 없을 수도 있음</text><rect x="25" y="480" width="210" height="135" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="130.0" y="528.5" text-anchor="middle">Trigger</text><text x="130.0" y="554.5" text-anchor="middle">사용자 동작을</text><text x="130.0" y="580.5" text-anchor="middle">실행 경로와 연결</text><rect x="255" y="480" width="210" height="135" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="528.5" text-anchor="middle">Payload</text><text x="360.0" y="554.5" text-anchor="middle">목적한 동작의</text><text x="360.0" y="580.5" text-anchor="middle">코드·구성 요소</text><rect x="485" y="480" width="210" height="135" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="590.0" y="528.5" text-anchor="middle">Decoy</text><text x="590.0" y="554.5" text-anchor="middle">사용자에게</text><text x="590.0" y="580.5" text-anchor="middle">보여 주는 내용</text></svg>