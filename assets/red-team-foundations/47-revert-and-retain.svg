<svg xmlns="http://www.w3.org/2000/svg" width="800" height="414" viewBox="0 0 800 414" role="img" aria-labelledby="title desc"><title id="title">복원과 저장 참조의 독립 상태</title><desc id="desc">현재 적용의 복원, 저장 참조 관리, 이미 열린 연결의 상태는 각각의 근거를 확인합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="800" height="414" rx="14" fill="#0e1927"/><polyline points="295,100 295,135 200,135 200,170" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="505,100 505,135 600,135 600,170" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="200,265 200,294 295,294 295,325" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="600,265 600,294 505,294 505,325" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="200" y="25" width="400" height="75" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="400.0" y="69.5" text-anchor="middle">현재 적용 상태와 저장된 참조</text><rect x="20" y="170" width="360" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="200.0" y="211.5" text-anchor="middle">스레드 문맥 복원</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="200.0" y="237.5" text-anchor="middle">복원 응답 · 이후 유효 토큰</text><rect x="420" y="170" width="360" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="600.0" y="211.5" text-anchor="middle">제품 저장 참조</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="600.0" y="237.5" text-anchor="middle">남은 항목 · 다른 객체 참조</text><rect x="155" y="325" width="490" height="65" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="400.0" y="364.5" text-anchor="middle">이미 열린 연결과 리소스는 별도 확인</text></svg>