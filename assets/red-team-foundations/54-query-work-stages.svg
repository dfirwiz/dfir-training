<svg xmlns="http://www.w3.org/2000/svg" width="710" height="260" viewBox="0 0 880 322" role="img" aria-labelledby="title desc"><title id="title">후보 작업과 응답 작업의 비용</title><desc id="desc">방문 수와 반환 수를 나누고 시간의 측정 지점을 확인합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="322" rx="14" fill="#0e1927"/><polyline points="415,73 465,73" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="660,120 660,204" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="465,251 415,251" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="25" y="26" width="390" height="94" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="220.0" y="67.0" text-anchor="middle">검색 범위와 인덱스</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="220.0" y="93.0" text-anchor="middle">후보 위치·질의 계획</text><rect x="465" y="26" width="390" height="94" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="660.0" y="67.0" text-anchor="middle">조건 평가</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="660.0" y="93.0" text-anchor="middle">방문 엔트리 수</text><rect x="25" y="204" width="390" height="94" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="220.0" y="245.0" text-anchor="middle">별도 관측</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="220.0" y="271.0" text-anchor="middle">DC 검색 시간과 클라이언트 왕복</text><rect x="465" y="204" width="390" height="94" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="660.0" y="245.0" text-anchor="middle">반환 준비</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="660.0" y="271.0" text-anchor="middle">일치 엔트리와 요청 속성</text></svg>