<svg xmlns="http://www.w3.org/2000/svg" width="900" height="625" viewBox="0 0 900 625" role="img" aria-labelledby="title desc"><title id="title">인증 기능과 접근 증거</title><desc id="desc">독립 제작 개념도. 두 종류의 조건과 증거를 아래 판단에 연결하며 실제 제품 캡처나 실행 결과가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="900" height="625" rx="14" fill="#0e1927"/><polyline points="230,125 230,170 225,170 225,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="670,125 670,170 675,170 675,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="225,365 225,420 285,420 285,470" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="675,365 675,420 615,420 615,470" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="40" y="25" width="820" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="450.0" y="69.0" text-anchor="middle">Windows 인증 요청</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="450.0" y="95.0" text-anchor="middle">앱 · 인터페이스 · 공급자 · 로그온 문맥</text><rect x="20" y="215" width="410" height="150" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="225.0" y="271.0" text-anchor="middle">LSA와 인증 패키지</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="225.0" y="297.0" text-anchor="middle">신원 검증 · 정책 처리</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="225.0" y="323.0" text-anchor="middle">로그온과 토큰 관계</text><rect x="470" y="215" width="410" height="150" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="675.0" y="271.0" text-anchor="middle">접근과 실제 결과</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="675.0" y="297.0" text-anchor="middle">프로세스 권한 · 관측</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="675.0" y="323.0" text-anchor="middle">자료 획득 · 사용은 별도</text><rect x="30" y="470" width="840" height="115" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="450.0" y="521.5" text-anchor="middle">기능 존재와 탈취 성공을 구별</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="450.0" y="547.5" text-anchor="middle">자료형 · 세션 · 보호 조건을 함께 기록</text></svg>