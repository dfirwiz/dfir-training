<svg xmlns="http://www.w3.org/2000/svg" width="700" height="610" viewBox="0 0 700 610" role="img" aria-labelledby="title desc"><title id="title">로더 배치의 개념 비교</title><desc id="desc">왼쪽은 PE 내부의 로더를 설명하는 구조이고 오른쪽은 PE 앞에 별도 로더가 붙는 구조입니다. 실행 주소나 생성 절차를 뜻하지 않으며 실제 크기에 비례하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="610" rx="14" fill="#0e1927"/><rect x="25" y="25" width="310" height="75" rx="12" fill="#193345" stroke="#80a7ff"/><text x="180.0" y="69.5" text-anchor="middle">전통적 내장 로더 설명</text><rect x="365" y="25" width="310" height="75" rx="12" fill="#193345" stroke="#80a7ff"/><text x="520.0" y="69.5" text-anchor="middle">앞에 붙는 로더 설명</text><rect x="25" y="175" width="310" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="180.0" y="209.0" text-anchor="middle">PE 내부</text><text x="180.0" y="235.0" text-anchor="middle">헤더 · 시작 코드 관련 배치</text><rect x="25" y="310" width="310" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="180.0" y="344.0" text-anchor="middle">PE 내부</text><text x="180.0" y="370.0" text-anchor="middle">내보내기 로더와 코드·데이터</text><rect x="365" y="175" width="310" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="520.0" y="222.0" text-anchor="middle">PE 앞의 별도 로더</text><rect x="365" y="310" width="310" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="520.0" y="344.0" text-anchor="middle">뒤에 이어지는 PE</text><text x="520.0" y="370.0" text-anchor="middle">헤더 · 코드 · 데이터</text><rect x="65" y="490" width="570" height="80" rx="12" fill="#193345" stroke="#80a7ff"/><text x="350.0" y="524.0" text-anchor="middle">실제 배치는 버전·설정·생성물로 확인</text><text x="350.0" y="550.0" text-anchor="middle">특정 내보내기 이름을 모든 버전에 요구하지 않음</text></svg>