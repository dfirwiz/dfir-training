<svg xmlns="http://www.w3.org/2000/svg" width="720" height="770" viewBox="0 0 720 770" role="img" aria-labelledby="title desc"><title id="title">Office 보호 판단에 서로 다르게 관여하는 요소</title><desc id="desc">여러 보호 요소가 서로 다른 조건으로 판단에 관여함을 보여 주는 개념도입니다. 정확한 정책 우선순위나 완전한 실행 허용 알고리즘이 아니며 최종 적용과 실제 실행은 별도로 확인합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="770" rx="14" fill="#0e1927"/><polyline points="180,110 180,180 260,180 260,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,110 540,180 460,180 460,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,460 180,405 260,405 260,345" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,460 540,405 460,405 460,345" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="360,345 360,665" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="30" y="25" width="305" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="61.5" text-anchor="middle">파일 출처</text><text x="182.5" y="87.5" text-anchor="middle">MotW · 가져온 경로</text><rect x="385" y="25" width="305" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="61.5" text-anchor="middle">Protected View</text><text x="537.5" y="87.5" text-anchor="middle">제한된 보기 환경</text><rect x="165" y="245" width="390" height="100" rx="12" fill="#193345" stroke="#80a7ff"/><text x="360.0" y="289.0" text-anchor="middle">해당 문서의 보호 판단</text><text x="360.0" y="315.0" text-anchor="middle">제품·버전·조직 정책도 확인</text><rect x="30" y="460" width="305" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="501.5" text-anchor="middle">매크로 관련 정책</text><text x="182.5" y="527.5" text-anchor="middle">인터넷 출처 차단 등</text><rect x="385" y="460" width="305" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="501.5" text-anchor="middle">신뢰 관련 조건</text><text x="537.5" y="527.5" text-anchor="middle">신뢰 위치 · 신뢰된 게시자</text><rect x="105" y="665" width="510" height="70" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="694.0" text-anchor="middle">설정값 · 실제 적용 · 실행 증거를 구별</text><text x="360.0" y="720.0" text-anchor="middle">한 배너의 상태로 모든 보호를 대신하지 않음</text></svg>