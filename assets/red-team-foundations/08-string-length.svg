<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560" role="img" aria-labelledby="title desc"><title id="title">문자열 길이의 단위 차이</title><desc id="desc">A와 이모지로 이루어진 문자열의 UTF-16 코드 단위 수는 3, 본문 바이트 수는 6이며 UTF-8 본문은 5바이트입니다. 종료자는 포함하지 않은 수치이며 API 계약을 별도로 확인합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="560" rx="14" fill="#0e1927"/><polyline points="250,105 250,165 180,165 180,230" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="450,105 450,165 520,165 520,230" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,345 180,450" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="520,345 520,450" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="140" y="25" width="420" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="59.0" text-anchor="middle">같은 문자열: A + 이모지</text><text x="350.0" y="85.0" text-anchor="middle">본문만 계산 · 종료자 제외</text><rect x="25" y="230" width="310" height="115" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="180.0" y="268.5" text-anchor="middle">UTF-16</text><text x="180.0" y="294.5" text-anchor="middle">코드 단위 3개</text><text x="180.0" y="320.5" text-anchor="middle">본문 6바이트</text><rect x="365" y="230" width="310" height="115" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="520.0" y="268.5" text-anchor="middle">UTF-8</text><text x="520.0" y="294.5" text-anchor="middle">본문 5바이트</text><text x="520.0" y="320.5" text-anchor="middle">UTF-16 길이를 그대로 쓰지 않음</text><rect x="70" y="450" width="560" height="75" rx="12" fill="#193345" stroke="#80a7ff"/><text x="350.0" y="494.5" text-anchor="middle">API 계약에서 길이 단위와 종료자 포함 여부 확인</text></svg>