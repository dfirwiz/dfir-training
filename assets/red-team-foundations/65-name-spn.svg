<svg xmlns="http://www.w3.org/2000/svg" width="680" height="254" viewBox="0 0 680 254" role="img" aria-labelledby="title desc"><title id="title">이름의 두 역할</title><desc id="desc">한 이름이 주소 검색과 서비스 신원 확인에 각각 쓰이는 구조입니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="680" height="254" rx="14" fill="#0e1927"/><polyline points="340,99 340,122 200,122 200,155" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="340,99 340,122 480,122 480,155" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="230" y="25" width="220" height="74" rx="12" fill="#193345" stroke="#80a7ff"/><text x="340.0" y="56.0" text-anchor="middle">서비스 이름</text><text x="340.0" y="82.0" text-anchor="middle">앱이 사용</text><rect x="90" y="155" width="220" height="74" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="200.0" y="186.0" text-anchor="middle">DNS 확인</text><text x="200.0" y="212.0" text-anchor="middle">연결 주소</text><rect x="370" y="155" width="220" height="74" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="480.0" y="186.0" text-anchor="middle">SPN 확인</text><text x="480.0" y="212.0" text-anchor="middle">서비스 주체</text></svg>