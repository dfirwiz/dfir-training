<svg xmlns="http://www.w3.org/2000/svg" width="720" height="790" viewBox="0 0 720 790" role="img" aria-labelledby="title desc"><title id="title">서버 수신과 Client 동기화</title><desc id="desc">화살표는 두 번의 데이터 이동과 각 단계의 확인입니다. 서버 완료는 Client 저장 완료 또는 파일 안전성을 뜻하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="790" rx="14" fill="#0e1927"/><polyline points="185,125 185,255" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="122.0" y="178" width="126" height="26" rx="4" fill="#0e1927"/><text class="label" x="185" y="195" text-anchor="middle">대상 → 서버</text><polyline points="335,305 385,305" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="185,355 185,555" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="535,355 535,555" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="25" width="300" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="185.0" y="69.0" text-anchor="middle">대상의 학습 파일</text><text x="185.0" y="95.0" text-anchor="middle">원본 경로·크기·해시</text><rect x="35" y="255" width="300" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="185.0" y="299.0" text-anchor="middle">Team Server 보관</text><text x="185.0" y="325.0" text-anchor="middle">Download 수신 완료</text><rect x="385" y="255" width="300" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="535.0" y="299.0" text-anchor="middle">Client에 동기화</text><text x="535.0" y="325.0" text-anchor="middle">Sync Files·저장 경로</text><rect x="35" y="555" width="300" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="185.0" y="604.0" text-anchor="middle">서버 완료 확인</