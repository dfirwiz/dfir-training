<svg xmlns="http://www.w3.org/2000/svg" width="700" height="650" viewBox="0 0 700 650" role="img" aria-labelledby="title desc"><title id="title">일반 사용자 모드 APC의 등록과 실행 확인</title><desc id="desc">일반 사용자 모드 APC를 대기열에 등록한 것과 콜백이 실행된 것을 구별합니다. 대상 스레드 상태와 실행 증거를 확인하지 못하면 실행 미확인으로 남깁니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="650" rx="14" fill="#0e1927"/><polyline points="350,110 350,230" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="250,340 250,415 180,415 180,495" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="450,340 450,415 520,415 520,495" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="140" y="25" width="420" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="61.5" text-anchor="middle">APC 대기열 등록</text><text x="350.0" y="87.5" text-anchor="middle">등록 성공 ≠ 콜백 실행 확인</text><rect x="140" y="230" width="420" height="110" rx="12" fill="#193345" stroke="#80a7ff"/><text x="350.0" y="266.0" text-anchor="middle">대상 스레드의 실행 조건 확인</text><text x="350.0" y="292.0" text-anchor="middle">예: alertable wait</text><text x="350.0" y="318.0" text-anchor="middle">시작 전 등록은 별도 문맥 확인</text><rect x="25" y="495" width="310" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="180.0" y="544.0" text-anchor="middle">조건·실행 증거 확인</text><text x="180.0" y="570.0" text-anchor="middle">콜백 실행과 연결</text><rect x="365" y="495" width="310" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="520.0" y="544.0" text-anchor="middle">조건·실행 증거 미확인</text><text x="520.0" y="570.0" text-anchor="middle">실행되었다고 단정하지 않음</text></svg>