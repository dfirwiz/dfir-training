<svg xmlns="http://www.w3.org/2000/svg" width="720" height="750" viewBox="0 0 720 750" role="img" aria-labelledby="title desc"><title id="title">캐시 보기와 새 목록 요청</title><desc id="desc">캐시 이동은 새로운 조회가 아닐 수 있습니다. 최신 상태가 필요하면 재조회와 실제 결과 수신 시각을 확인합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="750" rx="14" fill="#0e1927"/><polyline points="290,105 290,165 180,165 180,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="430,105 430,165 540,165 540,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,325 180,470" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="330,520 360,520 360,275 390,275" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,325 540,470" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="445.0" y="388" width="190" height="26" rx="4" fill="#0e1927"/><text class="label" x="540" y="405" text-anchor="middle">응답 간격·연결 영향</text><rect x="210" y="25" width="300" height="80" rx="12" fill="#193345" stroke="#80a7ff"/><text x="360.0" y="59.0" text-anchor="middle">폴더를 선택</text><text x="360.0" y="85.0" text-anchor="middle">현재 탭의 캐시 확인</text><rect x="30" y="225" width="300" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="180.0" y="269.0" text-anchor="middle">캐시 있음</text><text x="180.0" y="295.0" text-anchor="middle">이전 목록을 즉시 표시</text><rect x="390" y="225" width="300" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="540.0" y="269.0" text-anchor="middle">캐시 없음 또는 Refresh</text><text x="540.0" y="295.0" text-anchor="middle">새 조회 작업 요청</text><rect x="390" y="470" width="300" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="540.0" y="514.0" text-anchor="middle">전달·결과 수신</text><text x="540.0" y="540.0" text-anchor="middle">그 시점의 목록 반영</text><rect x="30" y="470" width="300" height="100" rx="12" fill="#193345" stroke="#80a7ff"/><text x="180.0" y="514.0" text-anchor="middle">최신 상태가 필요한가?</text><text x="180.0" y="540.0" text-anchor="middle">필요하면 Refresh</text></svg>