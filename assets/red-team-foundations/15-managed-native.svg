<svg xmlns="http://www.w3.org/2000/svg" width="720" height="670" viewBox="0 0 720 670" role="img" aria-labelledby="title desc"><title id="title">네이티브 모듈과 관리 어셈블리의 로딩 비교</title><desc id="desc">확장자가 DLL이어도 네이티브와 관리 코드의 로딩 규칙을 같게 처리하지 않습니다. AppDomainManager는 여기서 .NET Framework 구성 예이며 현대 .NET 전체에 동일한 동작을 가정하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="670" rx="14" fill="#0e1927"/><polyline points="180,110 180,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,110 540,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,375 180,450 260,450 260,530" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,375 540,450 460,450 460,530" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="30" y="25" width="305" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="61.5" text-anchor="middle">네이티브 DLL</text><text x="182.5" y="87.5" text-anchor="middle">Windows 로더의 대상</text><rect x="385" y="25" width="305" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="61.5" text-anchor="middle">.NET 관리 어셈블리</text><text x="537.5" y="87.5" text-anchor="middle">관리 런타임의 대상</text><rect x="30" y="245" width="305" height="130" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="278.0" text-anchor="middle">확인할 조건</text><text x="182.5" y="304.0" text-anchor="middle">앱 유형 · 경로 요청</text><text x="182.5" y="330.0" text-anchor="middle">매니페스트 · 로더 옵션</text><text x="182.5" y="356.0" text-anchor="middle">실제 모듈 경로</text><rect x="385" y="245" width="305" height="130" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="278.0" text-anchor="middle">확인할 조건</text><text x="537.5" y="304.0" text-anchor="middle">런타임 · 이름·버전·형식</text><text x="537.5" y="330.0" text-anchor="middle">.NET Framework 구성 예</text><text x="537.5" y="356.0" text-anchor="middle">AppDomainManager 참조</text><rect x="125" y="530" width="470" height="95" rx="12" fill="#193345" stroke="#80a7ff"/><text x="360.0" y="571.5" text-anchor="middle">실제 적재·오류·후속 동작의 관측</text><text x="360.0" y="597.5" text-anchor="middle">설정의 존재만으로 실행을 확정하지 않음</text></svg>