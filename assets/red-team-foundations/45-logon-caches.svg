<svg xmlns="http://www.w3.org/2000/svg" width="790" height="370" viewBox="0 0 790 370" role="img" aria-labelledby="title desc"><title id="title">한 호스트의 두 로그온 세션</title><desc id="desc">같은 호스트에도 별개의 로그온 세션과 캐시가 있으며 현재 조회 결과에는 범위가 있습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="790" height="370" rx="14" fill="#0e1927"/><polyline points="280,100 280,120 190,120 190,150" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="510,100 510,120 600,120 600,150" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="190,225 190,275" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="600,225 600,275" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="180" y="25" width="430" height="75" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="395.0" y="69.5" text-anchor="middle">같은 Windows 호스트 · 같은 관측 시각</text><rect x="25" y="150" width="330" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="190.0" y="194.5" text-anchor="middle">LUID A · 대화형 로그온</text><rect x="435" y="150" width="330" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="600.0" y="194.5" text-anchor="middle">LUID B · 별도 로그온</text><rect x="25" y="275" width="330" height="75" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="190.0" y="319.5" text-anchor="middle">A 캐시 · TGT와 파일 서비스 티켓</text><rect x="435" y="275" width="330" height="75" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="600.0" y="319.5" text-anchor="middle">B 캐시 · 목록이 다를 수 있음</text></svg>