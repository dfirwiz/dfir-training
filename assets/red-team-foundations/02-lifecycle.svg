<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">내부 탐색과 이동이 반복되는 가상 흐름</title><desc id="desc">화살표는 가능한 진행 방향입니다. 권한 확보 후 내부 조사로 돌아가는 경로와 기존 권한으로 목표 자료에 접근하는 경로를 모두 보존합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="850" rx="14" fill="#0e1927"/><polyline points="310,85 310,155" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="310,225 310,305" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="310,365 310,455" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="190,485 70,485 70,190 190,190" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="29.0" y="323" width="126" height="48" rx="4" fill="#0e1927"/><text class="label" x="92" y="340" text-anchor="middle">권한 확보 후</text><text class="label" x="92" y="362" text-anchor="middle">다시 조사</text><polyline points="430,190 610,190 610,650 430,650" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="557.0" y="248" width="126" height="48" rx="4" fill="#0e1927"/><text class="label" x="620" y="265" text-anchor="middle">현재 권한으로</text><text class="label" x="620" y="287" text-anchor="middle">접근 가능</text><polyline points="430,335 510,335 510,620 430,620" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="500.0" y="413" width="110" height="48" rx="4" fill="#0e1927"/><text class="label" x="555" y="430" text-anchor="middle">목표가 있는</text><text class="label" x="555" y="452" text-anchor="middle">시스템</text><polyline points="310,665 310,755" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="190" y="25" width="240" height="60" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="310.0" y="62.0" text-anchor="middle">최초 접근</text><rect x="190" y="155" width="240" height="70" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="310.0" y="197.0" text-anchor="middle">내부 구조와 자원 조사</text><rect x="190" y="305" width="240" height="60" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="310.0" y="342.0" text-anchor="middle">추가 시스템 접근</text><rect x="190" y="455" width="240" height="60" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="310.0" y="492.0" text-anchor="middle">필요한 권한 확보</text><rect x="190" y="605" width="240" height="60" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="310.0" y="642.0" text-anchor="middle">목표 자료 접근</text><rect x="190" y="755" width="240" height="60" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="310.0" y="792.0" text-anchor="middle">목표 달성 여부 검증</text></svg>