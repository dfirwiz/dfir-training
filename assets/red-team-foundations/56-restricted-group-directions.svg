<svg xmlns="http://www.w3.org/2000/svg" width="710" height="246" viewBox="0 0 880 305" role="img" aria-labelledby="title desc"><title id="title">Restricted Groups의 두 방향</title><desc id="desc">왼쪽은 그룹 내부 구성원, 오른쪽은 그룹이 들어갈 대상 그룹을 정합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="305" rx="14" fill="#0e1927"/><polyline points="220,116 220,190" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="660,116 660,190" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="30" y="25" width="380" height="91" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="220.0" y="64.5" text-anchor="middle">Members</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="220.0" y="90.5" text-anchor="middle">관리할 그룹이 포함하는 목록</text><rect x="470" y="25" width="380" height="91" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="660.0" y="64.5" text-anchor="middle">Member Of</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="660.0" y="90.5" text-anchor="middle">해당 그룹이 속할 대상</text><rect x="30" y="190" width="380" height="91" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="220.0" y="229.5" text-anchor="middle">직접 구성원 목록</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="220.0" y="255.5" text-anchor="middle">정책에 지정한 계정과 그룹</text><rect x="470" y="190" width="380" height="91" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="660.0" y="229.5" text-anchor="middle">상위 로컬 그룹</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="660.0" y="255.5" text-anchor="middle">해당 그룹을 구성원으로 포함</text></svg>