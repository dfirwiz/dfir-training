<svg xmlns="http://www.w3.org/2000/svg" width="710" height="258" viewBox="0 0 880 320" role="img" aria-labelledby="title desc"><title id="title">등록 이후 증거가 끊기는 지점</title><desc id="desc">작업 등록 뒤 어느 층위까지 확인됐는지 별도로 남깁니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="320" rx="14" fill="#0e1927"/><polyline points="320,101 320,145 152,145 152,184" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="440,101 440,184" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="560,101 560,145 728,145 728,184" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="225" y="24" width="430" height="77" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="69.5" text-anchor="middle">작업 등록 기록 확인</text><rect x="23" y="184" width="258" height="112" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="152.0" y="234.0" text-anchor="middle">인증에서 중단</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="152.0" y="260.0" text-anchor="middle">대상의 로그온 자료</text><rect x="311" y="184" width="258" height="112" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="234.0" text-anchor="middle">인가 또는 실행 중단</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="260.0" text-anchor="middle">서비스와 실행 증거</text><rect x="599" y="184" width="258" height="112" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="728.0" y="234.0" text-anchor="middle">후속 연결 미확인</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="728.0" y="260.0" text-anchor="middle">체크인과 반환 경로</text></svg>