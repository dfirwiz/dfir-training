<svg xmlns="http://www.w3.org/2000/svg" width="720" height="695" viewBox="0 0 720 695" role="img" aria-labelledby="title desc"><title id="title">가상 메모리의 예약·커밋·해제 상태</title><desc id="desc">대표적인 상태 관계를 단순화했습니다. 디커밋하면 예약 상태가 남고 예약 해제는 주소 범위를 Free로 돌립니다. Free에서 예약과 커밋을 함께 할 수도 있습니다. 모든 API 조합과 제약을 나타낸 구현도는 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="695" rx="14" fill="#0e1927"/><polyline points="310,110 310,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="262.0" y="150" width="46" height="26" rx="4" fill="#0e1927"/><text class="label" x="285" y="167" text-anchor="middle">예약</text><polyline points="310,310 310,430" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="262.0" y="358" width="46" height="26" rx="4" fill="#0e1927"/><text class="label" x="285" y="375" text-anchor="middle">커밋</text><polyline points="515,475 630,475 630,265 515,265" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="594.0" y="353" width="62" height="26" rx="4" fill="#0e1927"/><text class="label" x="625" y="370" text-anchor="middle">디커밋</text><polyline points="205,265 70,265 70,65 205,65" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="33.0" y="149" width="94" height="26" rx="4" fill="#0e1927"/><text class="label" x="80" y="166" text-anchor="middle">예약 해제</text><polyline points="515,65 685,65 685,475 515,475" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="557.0" y="143" width="126" height="48" rx="4" fill="#0e1927"/><text class="label" x="620" y="160" text-anchor="middle">예약 + 커밋</text><text class="label" x="620" y="182" text-anchor="middle">한 번에 가능</text><rect x="205" y="25" width="310" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="61.5" text-anchor="middle">Free</text><text x="360.0" y="87.5" text-anchor="middle">예약·커밋에 사용되지 않은 범위</text><rect x="205" y="220" width="310" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="259.0" text-anchor="middle">Reserved</text><text x="360.0" y="285.0" text-anchor="middle">주소 범위만 확보</text><rect x="205" y="430" width="310" height="95" rx="12" fill="#193345" stroke="#80a7ff"/><text x="360.0" y="471.5" text-anchor="middle">Committed</text><text x="360.0" y="497.5" text-anchor="middle">저장소 보장·보호 조건 확인</text><rect x="95" y="605" width="530" height="55" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="639.5" text-anchor="middle">커밋 상태 · 현재 보호 · RAM 상주는 서로 다른 질문</text></svg>