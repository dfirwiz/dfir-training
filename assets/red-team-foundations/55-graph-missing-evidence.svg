<svg xmlns="http://www.w3.org/2000/svg" width="710" height="256" viewBox="0 0 880 317" role="img" aria-labelledby="title desc"><title id="title">그래프에서 연결이 보이지 않을 때</title><desc id="desc">확인 가능한 세 층위를 구별하고 빈 관계를 곧바로 관계 부재로 쓰지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="317" rx="14" fill="#0e1927"/><polyline points="315,100 315,145 152,145 152,187" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="440,100 440,187" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="565,100 565,145 728,145 728,187" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="220" y="24" width="440" height="76" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="69.0" text-anchor="middle">가상 그래프의 관계 공백</text><rect x="22" y="187" width="260" height="106" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="152.0" y="234.0" text-anchor="middle">자료가 없었나?</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="152.0" y="260.0" text-anchor="middle">범위 · 호스트 · 권한</text><rect x="310" y="187" width="260" height="106" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="234.0" text-anchor="middle">처리에서 빠졌나?</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="260.0" text-anchor="middle">변환 · 스키마 · 업로드</text><rect x="598" y="187" width="260" height="106" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="728.0" y="234.0" text-anchor="middle">표시에 빠졌나?</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="728.0" y="260.0" text-anchor="middle">방향 · 필터 · 시점</text></svg>