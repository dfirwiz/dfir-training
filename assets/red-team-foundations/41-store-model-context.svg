<svg xmlns="http://www.w3.org/2000/svg" width="900" height="625" viewBox="0 0 900 625" role="img" aria-labelledby="title desc"><title id="title">Windows 저장소와 도구 모델</title><desc id="desc">독립 제작 개념도. 두 종류의 조건과 증거를 아래 판단에 연결하며 실제 제품 캡처나 실행 결과가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="900" height="625" rx="14" fill="#0e1927"/><polyline points="230,125 230,170 225,170 225,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="670,125 670,170 675,170 675,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="225,365 225,420 285,420 285,470" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="675,365 675,420 615,420 615,470" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="40" y="25" width="820" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="450.0" y="69.0" text-anchor="middle">목록의 출처를 먼저 구별</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="450.0" y="95.0" text-anchor="middle">호스트 · 사용자 · 수집 도구 · 시각</text><rect x="20" y="215" width="410" height="150" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="225.0" y="271.0" text-anchor="middle">Windows Credential Manager</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="225.0" y="297.0" text-anchor="middle">OS · 응용프로그램 저장소</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="225.0" y="323.0" text-anchor="middle">현재 로그온 문맥과 보호</text><rect x="470" y="215" width="410" height="150" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="675.0" y="271.0" text-anchor="middle">Cobalt Strike Credentials</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="675.0" y="297.0" text-anchor="middle">Team Server의 기록 모델</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="675.0" y="323.0" text-anchor="middle">수동 합성값도 기록 가능</text><rect x="30" y="470" width="840" height="115" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="450.0" y="521.5" text-anchor="middle">서로 다른 저장과 기록의 성공</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="450.0" y="547.5" text-anchor="middle">모델 행 존재는 비밀 획득 · 인증 성공이 아님</text></svg>