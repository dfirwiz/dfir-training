<svg xmlns="http://www.w3.org/2000/svg" width="880" height="323" viewBox="0 0 880 323" role="img" aria-labelledby="title desc"><title id="title">LDAP 검색을 구성하는 네 가지 질문</title><desc id="desc">시작점과 깊이가 후보 범위를 정하고, 필터와 반환 속성은 서로 다른 역할을 합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="323" rx="14" fill="#0e1927"/><polyline points="280,78 310,78" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="570,78 600,78" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="730,125 730,172 560,172 560,219" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="32" width="260" height="93" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="150.0" y="72.5" text-anchor="middle">① 어디서 어디까지?</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="150.0" y="98.5" text-anchor="middle">Base DN · Scope</text><rect x="310" y="32" width="260" height="93" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="72.5" text-anchor="middle">② 어떤 객체가 맞는가?</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="98.5" text-anchor="middle">Filter</text><rect x="600" y="32" width="260" height="93" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="730.0" y="72.5" text-anchor="middle">③ 어떤 값을 요청하는가?</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="730.0" y="98.5" text-anchor="middle">반환 속성 목록</text><rect x="230" y="219" width="420" height="80" rx="12" 