<svg xmlns="http://www.w3.org/2000/svg" width="760" height="635" viewBox="0 0 760 635" role="img" aria-labelledby="title desc"><title id="title">서비스 계정의 두 관점</title><desc id="desc">두 관점을 나누어 아래 판단에서 연결하는 독립 개념도입니다. 실제 제품 화면이나 실행 결과가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="760" height="635" rx="14" fill="#0e1927"/><polyline points="230,115 230,165 192,165 192,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="530,115 530,165 567,165 567,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="192,360 192,420 270,420 270,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="567,360 567,420 490,420 490,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="80" y="25" width="600" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="380.0" y="64.0" text-anchor="middle">서비스 시작 계정 확인</text><text x="380.0" y="90.0" text-anchor="middle">계정 이름과 실행 토큰 연결</text><rect x="20" y="220" width="345" height="140" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="192.5" y="271.0" text-anchor="middle">로컬 관점</text><text x="192.5" y="297.0" text-anchor="middle">LocalService · NetworkService</text><text x="192.5" y="323.0" text-anchor="middle">기본적으로 제한된 권한</text><rect x="395" y="220" width="345" height="140" rx="12" fill="#193345" stroke="#80a7ff"/><text x="567.5" y="271.0" text-anchor="middle">네트워크 관점</text><text x="567.5" y="297.0" text-anchor="middle">익명 또는 컴퓨터 식별</text><text x="567.5" y="323.0" text-anchor="middle">원격 자원의 별도 허가</text><rect x="55" y="490" width="650" height="105" rx="12" fill="#193345" stroke="#80a7ff"/><text x="380.0" y="536.5" text-anchor="middle">LocalSystem도 원격 전체 권한은 아님</text><text x="380.0" y="562.5" text-anchor="middle">인증 주체와 자원 허가는 별도 확인</text></svg>