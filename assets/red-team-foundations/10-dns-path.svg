<svg xmlns="http://www.w3.org/2000/svg" width="700" height="660" viewBox="0 0 700 660" role="img" aria-labelledby="title desc"><title id="title">DNS 재귀 질의와 권한 위임</title><desc id="desc">단말 요청은 재귀 리졸버를 거쳐 위임된 구역의 권한 서버로 이어질 수 있습니다. 상위 DNS의 위임은 권한 경로를 연결하는 정보이며 직접적인 Beacon 통신을 뜻하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="660" rx="14" fill="#0e1927"/><polyline points="310,70 390,70" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="527,115 527,265" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="448.0" y="178" width="158" height="26" rx="4" fill="#0e1927"/><text class="label" x="527" y="195" text-anchor="middle">권한 서버로 질의</text><polyline points="310,315 390,315" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="25" width="275" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="172.5" y="64.0" text-anchor="middle">단말</text><text x="172.5" y="90.0" text-anchor="middle">이름 조회를 요청</text><rect x="390" y="25" width="275" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="527.5" y="64.0" text-anchor="middle">재귀 리졸버</text><text x="527.5" y="90.0" text-anchor="middle">단말 대신 조회</text><rect x="390" y="265" width="275" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="527.5" y="309.0" text-anchor="middle">위임된 구역의 권한 서버</text><text x="527.5" y="335.0" text-anchor="middle">해당 구역의 응답 처리</text><rect x="35" y="265" width="275" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="172.5" y="309.0" text-anchor="middle">상위 DNS의 위임 정보</text><text x="172.5" y="335.0" text-anchor="middle">어느 권한 서버인지 연결</text><rect x="100" y="535" width="500" height="80" rx="12" fill="#193345" stroke="#80a7ff"/><text x="350.0" y="569.0" text-anchor="middle">DNS 질의 유형과 실제 전송 계층은 구별</text><text x="350.0" y="595.0" text-anchor="middle">DoH에서는 관측 경로도 달라짐</text></svg>