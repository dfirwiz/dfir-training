<svg xmlns="http://www.w3.org/2000/svg" width="710" height="261" viewBox="0 0 880 324" role="img" aria-labelledby="title desc"><title id="title">1644를 볼 수 있는 범위</title><desc id="desc">진단이나 수집 범위 밖의 검색은 보존 로그에서 확인할 수 없습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="324" rx="14" fill="#0e1927"/><polyline points="281,78 311,78" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="569,78 599,78" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="728,131 728,176 580,176 580,218" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="23" y="26" width="258" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="152.0" y="72.5" text-anchor="middle">DC가 처리한 검색</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="152.0" y="98.5" text-anchor="middle">지정 서버 · 시간 구간</text><rect x="311" y="26" width="258" height="105" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="72.5" text-anchor="middle">진단 기록 조건</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="98.5" text-anchor="middle">진단 수준과 임계값</text><rect x="599" y="26" width="258" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="728.0" y="72.5" text-anchor="middle">수집된 보존 로그</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="728.0" y="98.5" text-anchor="middle">DC 목록과 시간대</text><rect x="210" y="218" width="460" height="82" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="266.0" text-anchor="middle">관측한 로그에서 1644 판독</text></svg>