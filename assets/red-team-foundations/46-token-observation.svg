<svg xmlns="http://www.w3.org/2000/svg" width="800" height="316" viewBox="0 0 800 316" role="img" aria-labelledby="title desc"><title id="title">한 도구에서도 조회 지점이 다릅니다</title><desc id="desc">프로세스·스레드·조회 명령의 관측을 구분합니다. 세 결과가 자동으로 같아지지는 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="800" height="316" rx="14" fill="#0e1927"/><polyline points="280,98 280,136 135,136 135,180" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="400,98 400,180" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="520,98 520,136 665,136 665,180" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="200" y="22" width="400" height="76" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="400.0" y="67.0" text-anchor="middle">한 호스트의 작업 문맥</text><rect x="20" y="180" width="230" height="112" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="135.0" y="230.0" text-anchor="middle">프로세스</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="135.0" y="256.0" text-anchor="middle">기본 토큰</text><rect x="285" y="180" width="230" height="112" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="400.0" y="230.0" text-anchor="middle">특정 스레드</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="400.0" y="256.0" text-anchor="middle">가장 토큰 유무</text><rect x="550" y="180" width="230" height="112" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="665.0" y="230.0" text-anchor="middle">조회용 새 프로세스</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="665.0" y="256.0" text-anchor="middle">실행된 문맥의 사용자</text></svg>