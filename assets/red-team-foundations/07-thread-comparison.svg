<svg xmlns="http://www.w3.org/2000/svg" width="720" height="655" viewBox="0 0 720 655" role="img" aria-labelledby="title desc"><title id="title">새 스레드와 기존 스레드 상태 변화의 비교</title><desc id="desc">두 계열을 비교하기 위한 가상 관측 전후 상태입니다. T1과 T2는 설명용 식별자이며 실제 스레드 ID가 아닙니다. 단순한 현재 명령 포인터 차이만으로 문맥 변조를 입증할 수는 없습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="655" rx="14" fill="#0e1927"/><polyline points="180,105 180,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,105 540,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,320 180,440" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="109.0" y="367" width="142" height="26" rx="4" fill="#0e1927"/><text class="label" x="180" y="384" text-anchor="middle">새 T2에 주목</text><polyline points="540,320 540,440" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="429.0" y="367" width="222" height="26" rx="4" fill="#0e1927"/><text class="label" x="540" y="384" text-anchor="middle">같은 T1의 변화에 주목</text><rect x="30" y="25" width="305" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="59.0" text-anchor="middle">새 원격 스레드 계열</text><text x="182.5" y="85.0" text-anchor="middle">대상 B에 새 흐름이 생김</text><rect x="385" y="25" width="305" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="59.0" text-anchor="middle">기존 스레드 변경 계열</text><text x="537.5" y="85.0" text-anchor="middle">기존 흐름의 상태가 바뀜</text><rect x="30" y="215" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="248.5" text-anchor="middle">B의 관측 전 상태</text><text x="182.5" y="274.5" text-anchor="middle">기존 스레드 T1</text><text x="182.5" y="300.5" text-anchor="middle">원래 작업 수행</text><rect x="385" y="215" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="248.5" text-anchor="middle">B의 관측 전 상태</text><text x="537.5" y="274.5" text-anchor="middle">기존 스레드 T1</text><text x="537.5" y="300.5" text-anchor="middle">원래 실행 문맥</text><rect x="30" y="440" width="305" height="110" rx="12" fill="#193345" stroke="#80a7ff"/><text x="182.5" y="476.0" text-anchor="middle">B의 관측 후 상태</text><text x="182.5" y="502.0" text-anchor="middle">T1은 존재 · 새 T2 생성</text><text x="182.5" y="528.0" text-anchor="middle">T2 시작 주소·바이트 확인</text><rect x="385" y="440" width="305" height="110" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="476.0" text-anchor="middle">B의 관측 후 상태</text><text x="537.5" y="502.0" text-anchor="middle">기존 T1의 문맥 변화</text><text x="537.5" y="528.0" text-anchor="middle">이후 실행 위치·바이트 확인</text><rect x="55" y="590" width="610" height="40" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="617.0" text-anchor="middle">새 스레드 생성 기록이 없다는 사실만으로 오른쪽을 배제하지 않음</text></svg>