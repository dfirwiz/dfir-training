<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc"><title id="title">전체 이미지 대체와 진입점 주변 변경의 범위</title><desc id="desc">가능한 변경 범위를 비교하는 개념도이며 실행 순서나 주입 구현 절차가 아닙니다. 정상 적재의 재배치나 쓰기 가능한 데이터 변화 등도 고려하여 단순 바이트 차이와 악성 이미지 변조를 구별합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="620" rx="14" fill="#0e1927"/><polyline points="250,105 250,165 180,165 180,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="470,105 470,165 540,165 540,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,335 180,460" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="125.0" y="382" width="110" height="26" rx="4" fill="#0e1927"/><text class="label" x="180" y="399" text-anchor="middle">원본과 비교</text><polyline points="540,335 540,460" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="485.0" y="382" width="110" height="26" rx="4" fill="#0e1927"/><text class="label" x="540" y="399" text-anchor="middle">원본과 비교</text><rect x="150" y="25" width="420" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="59.0" text-anchor="middle">비교 기준: 디스크의 원래 PE</text><text x="360.0" y="85.0" text-anchor="middle">헤더 · 코드 · 데이터</text><rect x="30" y="225" width="305" height="110" rx="12" fill="#193345" stroke="#80a7ff"/><text x="182.5" y="261.0" text-anchor="middle">메모리 관측 A</text><text x="182.5" y="287.0" text-anchor="middle">원래 이미지 대신 다른 이미지</text><text x="182.5" y="313.0" text-anchor="middle">전체 대체 여부 조사</text><rect x="385" y="225" width="305" height="110" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="261.0" text-anchor="middle">메모리 관측 B</text><text x="537.5" y="287.0" text-anchor="middle">원래 이미지의 큰 틀은 남음</text><text x="537.5" y="313.0" text-anchor="middle">진입점 주변 일부 바이트 변경</text><rect x="30" y="460" width="305" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="496.0" text-anchor="middle">확인할 증거</text><text x="182.5" y="522.0" text-anchor="middle">매핑의 교체·새 이미지 범위</text><text x="182.5" y="548.0" text-anchor="middle">스레드의 실제 실행 위치</text><rect x="385" y="460" width="305" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="496.0" text-anchor="middle">확인할 증거</text><text x="537.5" y="522.0" text-anchor="middle">변경된 바이트·페이지 범위</text><text x="537.5" y="548.0" text-anchor="middle">스레드의 실제 실행 위치</text></svg>