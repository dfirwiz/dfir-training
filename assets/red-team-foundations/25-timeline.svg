<svg xmlns="http://www.w3.org/2000/svg" width="720" height="635" viewBox="0 0 720 635" role="img" aria-labelledby="title desc"><title id="title">정의와 동작 시간표</title><desc id="desc">독립 제작 개념 비교도. 위 조건을 두 관점으로 나누어 아래 판단에 연결합니다. 실제 실행 결과가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="635" rx="14" fill="#0e1927"/><polyline points="250,115 250,175 180,175 180,235" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="470,115 470,175 540,175 540,235" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,365 180,425 260,425 260,495" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,365 540,425 460,425 460,495" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="125" y="25" width="470" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="64.0" text-anchor="middle">설정 발견과 과거 변경</text><text x="360.0" y="90.0" text-anchor="middle">대상 사용자 · 시간대를 고정</text><rect x="30" y="235" width="305" height="130" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="281.0" text-anchor="middle">작업 정의의 정적 내용</text><text x="182.5" y="307.0" text-anchor="middle">활성 · 트리거 · 동작</text><text x="182.5" y="333.0" text-anchor="middle">실행 계정 · 경로</text><rect x="385" y="235" width="305" height="130" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="281.0" text-anchor="middle">시간표의 관측</text><text x="537.5" y="307.0" text-anchor="middle">로그온 · 실행 · 프로세스</text><text x="537.5" y="333.0" text-anchor="middle">수집 범위 · 누락·종료</text><rect x="95" y="495" width="530" height="100" rx="12" fill="#193345" stroke="#80a7ff"/><text x="360.0" y="539.0" text-anchor="middle">같은 작업·호스트·시간으로 연결?</text><text x="360.0" y="565.0" text-anchor="middle">가상 자료 결론을 실제 환경으로 확대 금지</text></svg>