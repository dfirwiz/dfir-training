<svg xmlns="http://www.w3.org/2000/svg" width="760" height="635" viewBox="0 0 760 635" role="img" aria-labelledby="title desc"><title id="title">서비스 주변의 서로 다른 객체</title><desc id="desc">두 관점을 나누어 아래 판단에서 연결하는 독립 개념도입니다. 실제 제품 화면이나 실행 결과가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="760" height="635" rx="14" fill="#0e1927"/><polyline points="230,115 230,165 192,165 192,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="530,115 530,165 567,165 567,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="192,360 192,420 270,420 270,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="567,360 567,420 490,420 490,490" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="80" y="25" width="600" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="380.0" y="64.0" text-anchor="middle">하나의 서비스에 대한 조사</text><text x="380.0" y="90.0" text-anchor="middle">서비스 이름을 기준으로 연결</text><rect x="20" y="220" width="345" height="140" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="192.5" y="271.0" text-anchor="middle">관리 객체</text><text x="192.5" y="297.0" text-anchor="middle">서비스 객체의 보안 설명자</text><text x="192.5" y="323.0" text-anchor="middle">레지스트리 키의 보안 설명자</text><rect x="395" y="220" width="345" height="140" rx="12" fill="#193345" stroke="#80a7ff"/><text x="567.5" y="271.0" text-anchor="middle">파일 시스템 객체</text><text x="567.5" y="297.0" text-anchor="middle">실행 파일의 접근 규칙</text><text x="567.5" y="323.0" text-anchor="middle">부모 폴더의 자식 생성·삭제</text><rect x="55" y="490" width="650" height="105" rx="12" fill="#193345" stroke="#80a7ff"/><text x="380.0" y="536.5" text-anchor="middle">각 객체의 조회·변경 권한은 다름</text><text x="380.0" y="562.5" text-anchor="middle">파일 쓰기로 서비스 중지를 추론 금지</text></svg>