<svg xmlns="http://www.w3.org/2000/svg" width="710" height="257" viewBox="0 0 880 319" role="img" aria-labelledby="title desc"><title id="title">비활성화 비트를 분리해서 읽기</title><desc id="desc">정수 전체 값이 달라도 비활성화 비트 2는 그대로 남을 수 있습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="319" rx="14" fill="#0e1927"/><polyline points="213,133 213,173 330,173 330,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="667,133 667,173 550,173 550,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="30" y="28" width="365" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="212.5" y="74.5" text-anchor="middle">512 · 0x0200</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="212.5" y="100.5" text-anchor="middle">정상 사용자 계정 유형</text><rect x="485" y="28" width="365" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="667.5" y="74.5" text-anchor="middle">2 · 0x0002</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="667.5" y="100.5" text-anchor="middle">계정 비활성화</text><rect x="225" y="215" width="430" height="80" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="249.0" text-anchor="middle">514 · 0x0202</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="275.0" text-anchor="middle">두 비트가 켜진 합성 값</text></svg>