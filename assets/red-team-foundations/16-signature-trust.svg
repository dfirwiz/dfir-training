<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">서명·평판·행동은 서로 다른 신뢰 질문</title><desc id="desc">독립된 세 질문과 각각의 근거를 비교합니다. 서명이 유효해도 다운로드 평판이나 실제 행위의 안전성을 자동 보증하지 않습니다. 평판과 경고는 제품·정책·현재 상태에 따라 달라질 수 있습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="650" rx="14" fill="#0e1927"/><polyline points="130,145 130,310" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="360,145 360,310" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="590,145 590,310" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="130,405 130,475 245,475 245,535" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="360,405 360,535" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="590,405 590,475 475,475 475,535" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="25" y="25" width="210" height="120" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="130.0" y="66.0" text-anchor="middle">서명 유효성</text><text x="130.0" y="92.0" text-anchor="middle">무결성 · 인증서 체인</text><text x="130.0" y="118.0" text-anchor="middle">시점·정책 조건</text><rect x="255" y="25" width="210" height="120" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="66.0" text-anchor="middle">다운로드 평판</text><text x="360.0" y="92.0" text-anchor="middle">파일·발행자 평판</text><text x="360.0" y="118.0" text-anchor="middle">제품의 경고·판정</text><rect x="485" y="25" width="210" height="120" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="590.0" y="66.0" text-anchor="middle">실제 동작의 정당성</text><text x="590.0" y="92.0" text-anchor="middle">승인된 업무인가?</text><text x="590.0" y="118.0" text-anchor="middle">배포 출처와 행위</text><rect x="25" y="310" width="210" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="130.0" y="351.5" text-anchor="middle">서명 검증 자료</text><text x="130.0" y="377.5" text-anchor="middle">서명자 · 타임스탬프</text><rect x="255" y="310" width="210" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="351.5" text-anchor="middle">평판 관련 자료</text><text x="360.0" y="377.5" text-anchor="middle">현재 정책·알림</text><rect x="485" y="310" width="210" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="590.0" y="351.5" text-anchor="middle">행동·출처 자료</text><text x="590.0" y="377.5" text-anchor="middle">배포 기준선 · 관측</text><rect x="105" y="535" width="510" height="75" rx="12" fill="#193345" stroke="#80a7ff"/><text x="360.0" y="566.5" text-anchor="middle">Valid 서명 하나로 평판과 안전성을 보장하지 않음</text><text x="360.0" y="592.5" text-anchor="middle">EV도 SmartScreen 경고 제거를 보장하지 않음</text></svg>