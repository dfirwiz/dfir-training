<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" role="img" aria-labelledby="title desc"><title id="title">출처·실행·악성 판단의 독립 질문</title><desc id="desc">서로 독립적으로 확인해야 할 질문을 나란히 놓았습니다. 인터넷 영역은 감염 점수가 아니고 메타데이터 부재는 안전이 아니며 실행 관측도 그 자체로 악성을 뜻하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="580" rx="14" fill="#0e1927"/><polyline points="125,135 125,285" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="360,135 360,285" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="595,135 595,285" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="25" width="210" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="125.0" y="61.0" text-anchor="middle">질문 1: 출처</text><text x="125.0" y="87.0" text-anchor="middle">메타데이터가 있나?</text><text x="125.0" y="113.0" text-anchor="middle">어떤 값 · 어떤 문맥?</text><rect x="255" y="25" width="210" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="61.0" text-anchor="middle">질문 2: 실행</text><text x="360.0" y="87.0" text-anchor="middle">코드가 실행됐나?</text><text x="360.0" y="113.0" text-anchor="middle">어느 프로세스 · 시각?</text><rect x="490" y="25" width="210" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="595.0" y="61.0" text-anchor="middle">질문 3: 판단</text><text x="595.0" y="87.0" text-anchor="middle">악성 근거가 있나?</text><text x="595.0" y="113.0" text-anchor="middle">내용 · 행위 · 정당성?</text><rect x="20" y="285" width="210" height="95" rx="12" fill="#193345" stroke="#80a7ff"/><text x="125.0" y="326.5" text-anchor="middle">존재 · 부재 · 오류</text><text x="125.0" y="352.5" text-anchor="middle">추측으로 채우지 않음</text><rect x="255" y="285" width="210" height="95" rx="12" fill="#193345" stroke="#80a7ff"/><text x="360.0" y="326.5" text-anchor="middle">관측 · 미확인</text><text x="360.0" y="352.5" text-anchor="middle">정적 참조와 구별</text><rect x="490" y="285" width="210" height="95" rx="12" fill="#193345" stroke="#80a7ff"/><text x="595.0" y="326.5" text-anchor="middle">근거에 맞는 판정</text><text x="595.0" y="352.5" text-anchor="middle">범위 · 한계 명시</text><rect x="55" y="470" width="610" height="65" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="509.5" text-anchor="middle">한 질문의 답으로 나머지 질문을 자동으로 해결하지 않습니다</text></svg>