<svg xmlns="http://www.w3.org/2000/svg" width="710" height="248" viewBox="0 0 880 307" role="img" aria-labelledby="title desc"><title id="title">정책 후보에서 실제 적용 증거까지</title><desc id="desc">링크·파일·조건·단말 결과를 각각 확인하고 정책과 관측 시점을 기록합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="307" rx="14" fill="#0e1927"/><polyline points="407,68 473,68" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="664,112 664,195" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="473,239 407,239" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="26" y="24" width="381" height="88" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="216.5" y="62.0" text-anchor="middle">AD의 링크와 GPO 속성</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="216.5" y="88.0" text-anchor="middle">후보 · 식별자 · 버전</text><rect x="473" y="24" width="381" height="88" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="663.5" y="62.0" text-anchor="middle">SYSVOL의 정책 파일</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="663.5" y="88.0" text-anchor="middle">설정 내용과 버전</text><rect x="26" y="195" width="381" height="88" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="216.5" y="233.0" text-anchor="middle">단말 적용과 현재 상태</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="216.5" y="259.0" text-anchor="middle">결과 보고 · 로컬 그룹</text><rect x="473" y="195" width="381" height="88" rx="12" fill="#152d3a