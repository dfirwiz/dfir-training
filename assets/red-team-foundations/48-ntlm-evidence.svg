<svg xmlns="http://www.w3.org/2000/svg" width="880" height="317" viewBox="0 0 880 317" role="img" aria-labelledby="title desc"><title id="title">NTLM 관측 지점 네 가지</title><desc id="desc">화살표는 조사 순서입니다. 각 관측은 별개의 결과이며 출발지와 대상을 시간과 계정으로 연결합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="317" rx="14" fill="#0e1927"/><polyline points="380,69 500,69" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="677,113 677,205" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="500,249 380,249" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="25" y="25" width="355" height="88" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="202.5" y="63.0" text-anchor="middle">① 출발지 단말</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="202.5" y="89.0" text-anchor="middle">프로세스 · 사용 시각 · 네트워크</text><rect x="500" y="25" width="355" height="88" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="677.5" y="63.0" text-anchor="middle">② 권한 있는 검증 주체</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="677.5" y="89.0" text-anchor="middle">4776 · 계정 · 결과</text><rect x="500" y="205" width="355" height="88" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="677.5" y="243.0" text-anchor="middle">③ 대상 서버</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="677.5" y="269.0" text-anchor="middle">4624 · 로그온 유형 · 계정</text><rect x="25" y="205" width="355" height="88" rx="12