<svg xmlns="http://www.w3.org/2000/svg" width="720" height="625" viewBox="0 0 720 625" role="img" aria-labelledby="title desc"><title id="title">같은 프로세스에서 구별해야 할 세 경로</title><desc id="desc">본문의 가상 경로를 간략히 표시한 비교도입니다. 세 화살표는 한 프로세스에 대해 별도로 기록할 정보를 나타내며 DLL이 특정 순서로 이 폴더들을 거친다는 의미가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="625" rx="14" fill="#0e1927"/><polyline points="245,115 245,195 130,195 130,285" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="360,115 360,285" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="313.0" y="193" width="94" height="26" rx="4" fill="#0e1927"/><text class="label" x="360" y="210" text-anchor="middle">별도 속성</text><polyline points="475,115 475,195 590,195 590,285" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="160" y="25" width="400" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="64.0" text-anchor="middle">관측할 프로세스 인스턴스</text><text x="360.0" y="90.0" text-anchor="middle">가상의 ExampleApp.exe</text><rect x="25" y="285" width="210" height="135" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="130.0" y="333.5" text-anchor="middle">실행 이미지 위치</text><text x="130.0" y="359.5" text-anchor="middle">Program Files의</text><text x="130.0" y="385.5" text-anchor="middle">ExampleApp 폴더</text><rect x="255" y="285" width="210" height="135" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="333.5" text-anchor="middle">현재 작업 폴더</text><text x="360.0" y="359.5" text-anchor="middle">사용자의</text><text x="360.0" y="385.5" text-anchor="middle">Documents 폴더</text><rect x="485" y="285" width="210" height="135" rx="12" fill="#193345" stroke="#80a7ff"/><text x="590.0" y="333.5" text-anchor="middle">실제 DLL 적재 경로</text><text x="590.0" y="359.5" text-anchor="middle">추적·모듈 관측으로</text><text x="590.0" y="385.5" text-anchor="middle">선택된 파일 확인</text><rect x="95" y="510" width="530" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="541.5" text-anchor="middle">세 경로는 서로 다른 정보이며 같다고 가정하지 않음</text><text x="360.0" y="567.5" text-anchor="middle">폴더의 쓰기 권한도 별도 확인</text></svg>