<svg xmlns="http://www.w3.org/2000/svg" width="800" height="429" viewBox="0 0 800 429" role="img" aria-labelledby="title desc"><title id="title">로그온 세션과 접근 판단</title><desc id="desc">로그온 문맥에서 로컬 토큰 권한 판단과 대상 서비스의 인증 및 권한 판단이 갈라집니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="800" height="429" rx="14" fill="#0e1927"/><polyline points="400,98 400,145" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="315,221 315,258 195,258 195,300" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="485,221 485,258 605,258 605,300" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="200" y="22" width="400" height="76" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="400.0" y="54.0" text-anchor="middle">Windows 로그온 세션</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="400.0" y="80.0" text-anchor="middle">LUID · 인증 패키지</text><rect x="200" y="145" width="400" height="76" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="400.0" y="177.0" text-anchor="middle">접근 토큰과 인증 문맥</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="400.0" y="203.0" text-anchor="middle">SID · 그룹 · 특권 · 세션 연결</text><rect x="20" y="300" width="355" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="197.5" y="346.5" text-anchor="middle">로컬 객체 접근</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="197.5" y="372.5" text-anchor="middle">유효 토큰과 객체 정책을 비교</text><rect x="425" y="300" width="355" height="105" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="602.5" y="346.5" text-anchor="middle">네트워크 접근</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="602.5" y="372.5" text-anchor="middle">대상 인증 뒤 자원 권한을 평가</text></svg>