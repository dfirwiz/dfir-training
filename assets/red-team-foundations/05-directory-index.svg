<svg xmlns="http://www.w3.org/2000/svg" width="720" height="565" viewBox="0 0 720 565" role="img" aria-labelledby="title desc"><title id="title">데이터 디렉터리는 내용이 아니라 위치 색인</title><desc id="desc">디렉터리는 위치와 크기를 담은 색인입니다. Import의 RVA 참조와 인증서 테이블의 파일 오프셋 예외를 비교하며 둘이 같은 데이터 구조라는 뜻은 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="565" rx="14" fill="#0e1927"/><polyline points="250,115 250,170 180,170 180,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="470,115 470,170 540,170 540,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,330 180,435" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,330 540,435" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="135" y="25" width="450" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="64.0" text-anchor="middle">선택 헤더의 데이터 디렉터리</text><text x="360.0" y="90.0" text-anchor="middle">엔트리 종류 · 위치 · 크기</text><rect x="30" y="225" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="258.5" text-anchor="middle">Import 디렉터리 예</text><text x="182.5" y="284.5" text-anchor="middle">위치 필드를 RVA로 해석</text><text x="182.5" y="310.5" text-anchor="middle">실제 가져오기 구조를 찾아감</text><rect x="385" y="225" width="305" height="105" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="258.5" text-anchor="middle">Certificate Table 예외</text><text x="537.5" y="284.5" text-anchor="middle">위치 필드는 파일 오프셋</text><text x="537.5" y="310.5" text-anchor="middle">같은 RVA 변환을 적용하지 않음</text><rect x="30" y="435" width="305" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="476.5" text-anchor="middle">참조한 DLL·함수 정보</text><text x="182.5" y="502.5" text-anchor="middle">목록의 존재 ≠ 실행 증거</text><rect x="385" y="435" width="305" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="476.5" text-anchor="middle">파일 안 인증서 데이터</text><text x="537.5" y="502.5" text-anchor="middle">위치·크기 범위를 검사</text></svg>