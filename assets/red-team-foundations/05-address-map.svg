<svg xmlns="http://www.w3.org/2000/svg" width="700" height="610" viewBox="0 0 700 610" role="img" aria-labelledby="title desc"><title id="title">파일 위치와 메모리 위치의 대응</title><desc id="desc">두 열은 파일 오프셋과 RVA라는 서로 다른 기준입니다. 상대 위치가 원시 데이터 크기 안일 때 파일 오프셋에 대응하며, 실제 적재 기준 주소에 RVA를 더하면 VA가 됩니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="610" rx="14" fill="#0e1927"/><polyline points="177,125 177,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="74.0" y="173" width="206" height="26" rx="4" fill="#0e1927"/><text class="label" x="177" y="190" text-anchor="middle">내부 위치 +0x120</text><polyline points="522,125 522,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="419.0" y="173" width="206" height="26" rx="4" fill="#0e1927"/><text class="label" x="522" y="190" text-anchor="middle">내부 위치 +0x120</text><polyline points="380,292 320,292" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="522,340 522,430 350,430 350,475" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="30" width="285" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="177.5" y="71.5" text-anchor="middle">파일의 .data 시작</text><text x="177.5" y="97.5" text-anchor="middle">PointerToRawData = 0x200</text><rect x="380" y="30" width="285" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="522.5" y="71.5" text-anchor="middle">이미지의 .data 시작</text><text x="522.5" y="97.5" text-anchor="middle">VirtualAddress = 0x1000</text><rect x="35" y="245" width="285" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="177.5" y="286.5" text-anchor="middle">파일 오프셋 0x320</text><text x="177.5" y="312.5" text-anchor="middle">0x200 + 0x120</text><rect x="380" y="245" width="285" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="522.5" y="286.5" text-anchor="middle">RVA 0x1120</text><text x="522.5" y="312.5" text-anchor="middle">0x1000 + 0x120</text><rect x="115" y="475" width="470" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="516.5" text-anchor="middle">실제 VA = 실제 적재 기준 주소 + RVA</text><text x="350.0" y="542.5" text-anchor="middle">예: 0x0000000140001120</text></svg>