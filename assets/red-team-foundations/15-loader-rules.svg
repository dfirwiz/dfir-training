<svg xmlns="http://www.w3.org/2000/svg" width="720" height="685" viewBox="0 0 720 685" role="img" aria-labelledby="title desc"><title id="title">환경별 로더 규칙과 실제 적재의 구별</title><desc id="desc">요청과 환경별 규칙을 확인한 뒤 후보 탐색과 실제 적재를 서로 다른 관측으로 구별합니다. 양쪽은 조사 관점이며 실패 또는 성공을 모든 경우에 포괄하는 로더 구현도는 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="685" rx="14" fill="#0e1927"/><polyline points="180,115 180,180 260,180 260,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,115 540,180 460,180 460,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="260,375 260,450 180,450 180,530" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="460,375 460,450 540,450 540,530" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="30" y="25" width="305" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="64.0" text-anchor="middle">모듈 로드 요청</text><text x="182.5" y="90.0" text-anchor="middle">이름 또는 전체 경로</text><rect x="385" y="25" width="305" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="64.0" text-anchor="middle">프로세스·환경 조건</text><text x="537.5" y="90.0" text-anchor="middle">앱 유형 · 버전 · 아키텍처</text><rect x="125" y="245" width="470" height="130" rx="12" fill="#193345" stroke="#80a7ff"/><text x="360.0" y="278.0" text-anchor="middle">해당 환경의 로더 규칙 확인</text><text x="360.0" y="304.0" text-anchor="middle">KnownDLLs · API set · SxS</text><text x="360.0" y="330.0" text-anchor="middle">이미 적재된 모듈 · 호출 옵션</text><text x="360.0" y="356.0" text-anchor="middle">한 가지 검색 순서로 고정하지 않음</text><rect x="30" y="530" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="563.5" text-anchor="middle">후보 탐색 기록</text><text x="182.5" y="589.5" text-anchor="middle">NAME NOT FOUND 등</text><text x="182.5" y="615.5" text-anchor="middle">탐색 기록 ≠ 적재 증거</text><rect x="385" y="530" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="563.5" text-anchor="middle">실제 적재 관측</text><text x="537.5" y="589.5" text-anchor="middle">Load Image · 실제 경로</text><text x="537.5" y="615.5" text-anchor="middle">해시·서명·시각을 따로 확인</text></svg>