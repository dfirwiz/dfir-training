<svg xmlns="http://www.w3.org/2000/svg" width="700" height="735" viewBox="0 0 700 735" role="img" aria-labelledby="title desc"><title id="title">HTTP 경로의 중계와 관측 위치</title><desc id="desc">프록시와 훈련 측 redirector가 모두 있는 가상 경로입니다. 모든 환경의 필수 구성은 아니며 앞뒤 포트·관측 주소와 작업의 의미를 구별합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="735" rx="14" fill="#0e1927"/><polyline points="350,105 350,210" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="263.0" y="148" width="174" height="26" rx="4" fill="#0e1927"/><text class="label" x="350" y="165" text-anchor="middle">단말 측 외부 접속</text><polyline points="350,290 350,395" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="223.0" y="333" width="254" height="26" rx="4" fill="#0e1927"/><text class="label" x="350" y="350" text-anchor="middle">관측 주소가 달라질 수 있음</text><polyline points="350,475 350,580" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="231.0" y="518" width="238" height="26" rx="4" fill="#0e1927"/><text class="label" x="350" y="535" text-anchor="middle">뒤쪽 포트는 다를 수 있음</text><rect x="165" y="25" width="370" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="59.0" text-anchor="middle">단말의 Beacon</text><text x="350.0" y="85.0" text-anchor="middle">실행 주체와 연결 확인</text><rect x="165" y="210" width="370" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="244.0" text-anchor="middle">조직의 인터넷 프록시</text><text x="350.0" y="270.0" text-anchor="middle">조직 정책·앞쪽 접속 기록</text><rect x="165" y="395" width="370" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="429.0" text-anchor="middle">훈련 측 Redirector</text><text x="350.0" y="455.0" text-anchor="middle">앞뒤 연결과 전달 확인</text><rect x="165" y="580" width="370" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="624.0" text-anchor="middle">Team Server</text><text x="350.0" y="650.0" text-anchor="middle">작업·결과와 서버 로그</text></svg>