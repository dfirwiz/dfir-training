<svg xmlns="http://www.w3.org/2000/svg" width="880" height="323" viewBox="0 0 880 323" role="img" aria-labelledby="title desc"><title id="title">연결에서 조회 성공까지</title><desc id="desc">번호는 조사 순서이며 보호 방식의 정확한 협상 위치는 프로토콜과 인증 방식에 따라 달라집니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="323" rx="14" fill="#0e1927"/><polyline points="270,75 315,75" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="565,75 610,75" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="735,122 735,206" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="610,252 520,252" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="28" width="250" height="94" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="145.0" y="69.0" text-anchor="middle">① 대상 서버 연결</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="145.0" y="95.0" text-anchor="middle">서버 역할 · 포트</text><rect x="315" y="28" width="250" height="94" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="69.0" text-anchor="middle">② 보호 방식</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="95.0" text-anchor="middle">서명 · TLS · 채널 바인딩</text><rect x="610" y="28" width="250" height="94" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="735.0" y="69.0" text-anchor="middle">③ 인증 문맥</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="735.0" y="95.0" text-anchor="middle">Bind 신원과 결과</text><rect x="610" y="206" width="250" height="93" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="735.0" y="246.5" text-anchor="middle">④ 검색·반환 권한</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="735.0" y="272.5" text-anchor="middle">객체 · 속성 · 정책</text><rect x="20" y="206" width="500" height="93" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="270.0" y="246.5" text-anchor="middle">실패 지점을 단계별로 분리</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="270.0" y="272.5" text-anchor="middle">연결 성공만으로 속성 열람을 확정하지 않음</text></svg>