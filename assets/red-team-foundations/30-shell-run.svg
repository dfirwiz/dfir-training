<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">셸 해석과 직접 실행</title><desc id="desc">위의 질문을 두 관점으로 나누어 아래 확인에 연결한 독립 비교도입니다. 실제 제품 또는 Windows 실행 결과가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="650" rx="14" fill="#0e1927"/><polyline points="230,115 230,175 180,175 180,235" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="490,115 490,175 540,175 540,235" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,365 180,435 260,435 260,510" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,365 540,435 460,435 460,510" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="100" y="25" width="520" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="64.0" text-anchor="middle">같은 사용자 식별 결과</text><text x="360.0" y="90.0" text-anchor="middle">결과 문자열과 실행 경로를 구별</text><rect x="25" y="235" width="310" height="130" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="180.0" y="281.0" text-anchor="middle">shell</text><text x="180.0" y="307.0" text-anchor="middle">cmd.exe /c 해석</text><text x="180.0" y="333.0" text-anchor="middle">내장 명령 · 셸 문법</text><rect x="385" y="235" width="310" height="130" rx="12" fill="#193345" stroke="#80a7ff"/><text x="540.0" y="281.0" text-anchor="middle">run</text><text x="540.0" y="307.0" text-anchor="middle">프로그램 직접 실행</text><text x="540.0" y="333.0" text-anchor="middle">실행 파일 · 인수 · 출력</text><rect x="80" y="510" width="560" height="100" rx="12" fill="#193345" stroke="#80a7ff"/><text x="360.0" y="554.0" text-anchor="middle">execute는 출력 미수집이라는 별도 계약</text><text x="360.0" y="580.0" text-anchor="middle">프로세스 생성·종료·결과를 함께 확인</text></svg>