<svg xmlns="http://www.w3.org/2000/svg" width="700" height="640" viewBox="0 0 700 640" role="img" aria-labelledby="title desc"><title id="title">접근 검사의 개념적 입력과 결과</title><desc id="desc">접근 요청과 적용 토큰을 객체 보안 정보 및 관련 정책에 대조하는 개념도입니다. 실제 판단은 객체와 API별 규칙을 따릅니다. 허용되었다고 모든 작업이 허용되는 것은 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="640" rx="14" fill="#0e1927"/><polyline points="180,130 180,190 260,190 260,250" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="520,130 520,190 440,190 440,250" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="260,365 260,430 180,430 180,500" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="440,365 440,430 520,430 520,500" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="30" width="290" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="180.0" y="74.0" text-anchor="middle">접근 요청</text><text x="180.0" y="100.0" text-anchor="middle">대상 객체 · 요청 권한</text><rect x="375" y="30" width="290" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="520.0" y="74.0" text-anchor="middle">적용 보안 문맥</text><text x="520.0" y="100.0" text-anchor="middle">기본·가장 토큰 확인</text><rect x="120" y="250" width="460" height="115" rx="12" fill="#193345" stroke="#80a7ff"/><text x="350.0" y="288.5" text-anchor="middle">객체의 보안 정보와 규칙에 대조</text><text x="350.0" y="314.5" text-anchor="middle">DACL · 관련 특권 · 기타 정책</text><text x="350.0" y="340.5" text-anchor="middle">완전한 커널 구현도는 아님</text><rect x="35" y="500" width="290" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="180.0" y="536.5" text-anchor="middle">허용된 접근</text><text x="180.0" y="562.5" text-anchor="middle">부여된 범위 안에서 사용</text><rect x="375" y="500" width="290" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="520.0" y="536.5" text-anchor="middle">거부 또는 제한</text><text x="520.0" y="562.5" text-anchor="middle">오류와 실제 상태 확인</text></svg>