<svg xmlns="http://www.w3.org/2000/svg" width="700" height="710" viewBox="0 0 700 710" role="img" aria-labelledby="title desc"><title id="title">초기 staging 단계의 유무</title><desc id="desc">Staged에는 작은 초기 구성에서 본체를 별도로 가져오는 단계가 있고 stageless는 본체를 포함합니다. 두 경우 모두 이후 작업과 결과 통신이 있을 수 있습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="710" rx="14" fill="#0e1927"/><polyline points="180,250 180,355" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="520,250 520,355" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,450 180,565" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="520,450 520,565" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="25" y="25" width="310" height="65" rx="12" fill="#193345" stroke="#80a7ff"/><text x="180.0" y="64.5" text-anchor="middle">Staged</text><rect x="365" y="25" width="310" height="65" rx="12" fill="#193345" stroke="#80a7ff"/><text x="520.0" y="64.5" text-anchor="middle">Stageless</text><rect x="25" y="155" width="310" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="180.0" y="196.5" text-anchor="middle">작은 Stager로 시작</text><text x="180.0" y="222.5" text-anchor="middle">본체를 아직 갖고 있지 않음</text><rect x="365" y="155" width="310" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="520.0" y="209.5" text-anchor="middle">본체를 포함해 시작</text><rect x="25" y="355" width="310" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="180.0" y="396.5" text-anchor="middle">별도 경로로 Stage 가져오기</text><text x="180.0" y="422.5" text-anchor="middle">초기 전달과 검증을 구별</text><rect x="365" y="355" width="310" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="520.0" y="396.5" text-anchor="middle">포함된 본체 적재</text><text x="520.0" y="422.5" text-anchor="middle">구성과 실행 조건 확인</text><rect x="25" y="565" width="310" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="180.0" y="619.5" text-anchor="middle">본체의 작업·결과 통신</text><rect x="365" y="565" width="310" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="520.0" y="619.5" text-anchor="middle">본체의 작업·결과 통신</text></svg>