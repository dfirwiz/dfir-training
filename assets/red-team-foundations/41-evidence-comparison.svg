<svg xmlns="http://www.w3.org/2000/svg" width="900" height="625" viewBox="0 0 900 625" role="img" aria-labelledby="title desc"><title id="title">항목 존재와 외부 사용의 증거</title><desc id="desc">독립 제작 개념도. 두 종류의 조건과 증거를 아래 판단에 연결하며 실제 제품 캡처나 실행 결과가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="900" height="625" rx="14" fill="#0e1927"/><polyline points="230,125 230,170 225,170 225,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="670,125 670,170 675,170 675,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="225,365 225,420 285,420 285,470" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="675,365 675,420 615,420 615,470" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="40" y="25" width="820" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="450.0" y="69.0" text-anchor="middle">사례의 사실표</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="450.0" y="95.0" text-anchor="middle">합성 사례 · 실제 비밀을 포함하지 않음</text><rect x="20" y="215" width="410" height="150" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="225.0" y="271.0" text-anchor="middle">저장 상태</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="225.0" y="297.0" text-anchor="middle">대상 · 사용자 · 자료형</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="225.0" y="323.0" text-anchor="middle">범주 · 수정 시각</text><rect x="470" y="215" width="410" height="150" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="675.0" y="271.0" text-anchor="middle">행위와 결과</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="675.0" y="297.0" text-anchor="middle">주체 프로세스 · 접근</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="675.0" y="323.0" text-anchor="middle">네트워크 · 인증 기록</text><rect x="30" y="470" width="840" height="115" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="450.0" y="521.5" text-anchor="middle">정상 기준선과 인과관계 확인</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="450.0" y="547.5" text-anchor="middle">저장 항목 · 접근 · 인증 성공을 분리 보고</text></svg>