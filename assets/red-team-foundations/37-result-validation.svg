<svg xmlns="http://www.w3.org/2000/svg" width="800" height="625" viewBox="0 0 800 625" role="img" aria-labelledby="title desc"><title id="title">요청과 결과의 증거 연결</title><desc id="desc">독립 개념도. 두 종류의 증거를 대조하여 아래 판단으로 연결하며 실제 제품 화면이나 실행 결과가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="800" height="625" rx="14" fill="#0e1927"/><polyline points="220,115 220,165 200,165 200,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="580,115 580,165 600,165 600,215" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="200,360 200,420 260,420 260,475" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="600,360 600,420 540,420 540,475" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="40" y="25" width="720" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="400.0" y="64.0" text-anchor="middle">승격 요청 기록</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="400.0" y="90.0" text-anchor="middle">원 세션 · 호스트 · 시각 · 선택</text><rect x="15" y="215" width="370" height="145" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="200.0" y="268.5" text-anchor="middle">도구 관측</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="200.0" y="294.5" text-anchor="middle">작업 결과 · 새 세션 ID</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="200.0" y="320.5" text-anchor="middle">연결만으로 High 아님</text><rect x="415" y="215" width="370" height="145" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="600.0" y="268.5" text-anchor="middle">Windows 관측</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="600.0" y="294.5" text-anchor="middle">프로세스 · 사용자 SID</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="600.0" y="320.5" text-anchor="middle">토큰 · 무결성 · 접근 결과</text><rect x="35" y="475" width="730" height="110" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="400.0" y="524.0" text-anchor="middle">같은 요청의 결과인지 교차 대조</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="400.0" y="550.0" text-anchor="middle">High ≠ SYSTEM · 명령 실행 ≠ 새 세션</text></svg>