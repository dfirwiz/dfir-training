<svg xmlns="http://www.w3.org/2000/svg" width="720" height="615" viewBox="0 0 720 615" role="img" aria-labelledby="title desc"><title id="title">관리 코드와 네이티브 코드 사이의 표현 변환</title><desc id="desc">개념적인 호출과 결과의 관계입니다. 모든 형식이 같은 변환을 거친다는 뜻은 아니며, 입력·출력 방향과 메모리 소유권은 함수와 선언의 계약을 따릅니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="615" rx="14" fill="#0e1927"/><polyline points="180,125 180,185 250,185 250,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="163.0" y="167" width="94" height="26" rx="4" fill="#0e1927"/><text class="label" x="210" y="184" text-anchor="middle">인자 전달</text><polyline points="470,245 470,185 540,185 540,125" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,125 665,125 665,485 540,485" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="385,530 335,530" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="30" y="25" width="305" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="56.0" text-anchor="middle">C# 관리 코드</text><text x="182.5" y="82.0" text-anchor="middle">string · uint · IntPtr</text><text x="182.5" y="108.0" text-anchor="middle">C# 선언으로 호출</text><rect x="385" y="25" width="305" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="56.0" text-anchor="middle">Windows 네이티브 함수</text><text x="537.5" y="82.0" text-anchor="middle">포인터 · DWORD 등</text><text x="537.5" y="108.0" text-anchor="middle">공식 함수 원형의 계약</text><rect x="145" y="245" width="430" height="120" rx="12" fill="#193345" stroke="#80a7ff"/><text x="360.0" y="273.0" text-anchor="middle">P/Invoke 마샬링 경계</text><text x="360.0" y="299.0" text-anchor="middle">크기·부호·정렬·문자열 표현</text><text x="360.0" y="325.0" text-anchor="middle">W 문자열은 Windows UTF-16</text><text x="360.0" y="351.0" text-anchor="middle">메모리 수명도 계약에 맞춤</text><rect x="30" y="485" width="305" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="524.0" text-anchor="middle">C#에서 반환값 해석</text><text x="182.5" y="550.0" text-anchor="middle">오류·자원 소유 규칙 확인</text><rect x="385" y="485" width="305" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="524.0" text-anchor="middle">네이티브 호출 결과</text><text x="537.5" y="550.0" text-anchor="middle">반환값 · 출력 인자</text></svg>