<svg xmlns="http://www.w3.org/2000/svg" width="880" height="322" viewBox="0 0 880 322" role="img" aria-labelledby="title desc"><title id="title">등록 정보와 실제 접근의 증거</title><desc id="desc">객체 등록은 단말 온라인 여부와 대상 서비스 접근 권한을 보장하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="322" rx="14" fill="#0e1927"/><polyline points="150,135 150,180 290,180 290,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="440,135 440,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="730,135 730,180 590,180 590,220" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="32" width="260" height="103" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="150.0" y="77.5" text-anchor="middle">AD 디렉터리</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="150.0" y="103.5" text-anchor="middle">객체 · 그룹 · 등록 정보</text><rect x="310" y="32" width="260" height="103" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="77.5" text-anchor="middle">단말 및 네트워크</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="103.5" text-anchor="middle">이름 해석 · 현재 상태</text><rect x="600" y="32" width="260" height="103" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="730.0" y="77.5" text-anchor="middle">대상 서비스</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="730.0" y="103.5" text-anchor="middle">인증 · 자원 권한</text><rect x="195" y="220" width="490" height="78" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="266.0" text-anchor="middle">각 질문에 맞는 근거를 따로 확인</text></svg>