<svg xmlns="http://www.w3.org/2000/svg" width="700" height="780" viewBox="0 0 700 780" role="img" aria-labelledby="title desc"><title id="title">작업 입력에서 결과까지의 확인 지점</title><desc id="desc">작업 입력·등록·전달·결과를 식별자와 시각으로 연결합니다. 전달 전 취소는 가상 모델의 별도 분기입니다. 결과 수신만으로 전체 영향과 정리가 완료되었다고 보지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="780" rx="14" fill="#0e1927"/><polyline points="250,100 250,190" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="250,265 250,355" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="440,227 490,227" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="250,430 250,520" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="250,595 250,670" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="60" y="25" width="380" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="250.0" y="56.5" text-anchor="middle">작업 입력</text><text x="250.0" y="82.5" text-anchor="middle">운영자 · 서버 · 세션 확인</text><rect x="60" y="190" width="380" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="250.0" y="221.5" text-anchor="middle">서버 대기열 등록</text><text x="250.0" y="247.5" text-anchor="middle">작업 ID와 의미 확인</text><rect x="60" y="355" width="380" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="250.0" y="386.5" text-anchor="middle">단말 세션에 전달</text><text x="250.0" y="412.5" text-anchor="middle">전달 시각 확인</text><rect x="60" y="520" width="380" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="250.0" y="551.5" text-anchor="middle">결과 수신</text><text x="250.0" y="577.5" text-anchor="middle">작업 ID로 출력 연결</text><rect x="60" y="670" width="580" height="75" rx="12" fill="#193345" stroke="#80a7ff"/><text x="350.0" y="701.5" text-anchor="middle">완료·영향·정리 상태를 각각 검증</text><text x="350.0" y="727.5" text-anchor="middle">개념도이며 제품 내부 상태 명세가 아님</text><rect x="490" y="190" width="175" height="115" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="577.5" y="228.5" text-anchor="middle">전달 전 취소</text><text x="577.5" y="254.5" text-anchor="middle">이 모델에서는</text><text x="577.5" y="280.5" text-anchor="middle">아직 미수행</text></svg>