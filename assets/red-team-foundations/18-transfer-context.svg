<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">같은 컨테이너와 서로 다른 처리 경로</title><desc id="desc">출처 보존 결과가 달라질 수 있음을 설명하는 가상 사례입니다. 특정 컨테이너·추출 도구가 언제나 출처 표시를 제거한다는 측정 결과가 아닙니다. 미확인은 안전 판정이 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="650" rx="14" fill="#0e1927"/><polyline points="250,105 250,170 180,170 180,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="470,105 470,170 540,170 540,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,335 180,475" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,335 540,475" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="150" y="25" width="420" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="59.0" text-anchor="middle">원본 컨테이너</text><text x="360.0" y="85.0" text-anchor="middle">본문 · 출처 · 수신 문맥 기록</text><rect x="30" y="225" width="305" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="261.0" text-anchor="middle">처리 경로 A</text><text x="182.5" y="287.0" text-anchor="middle">도구 · 버전 · 파일 시스템</text><text x="182.5" y="313.0" text-anchor="middle">추출·마운트·복사 방식</text><rect x="385" y="225" width="305" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="261.0" text-anchor="middle">처리 경로 B</text><text x="537.5" y="287.0" text-anchor="middle">A와 조건이 다를 수 있음</text><text x="537.5" y="313.0" text-anchor="middle">별도 측정이 필요</text><rect x="30" y="475" width="305" height="110" rx="12" fill="#193345" stroke="#80a7ff"/><text x="182.5" y="511.0" text-anchor="middle">가상 사본 A</text><text x="182.5" y="537.0" text-anchor="middle">본문 해시 H</text><text x="182.5" y="563.0" text-anchor="middle">출처 정보가 관측됨</text><rect x="385" y="475" width="305" height="110" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="511.0" text-anchor="middle">가상 사본 B</text><text x="537.5" y="537.0" text-anchor="middle">같은 본문 해시 H</text><text x="537.5" y="563.0" text-anchor="middle">출처 정보가 미확인</text></svg>