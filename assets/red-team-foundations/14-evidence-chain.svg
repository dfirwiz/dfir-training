<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">처음 받은 파일에서 통신까지 입증할 연결</title><desc id="desc">가상 조사에서 입증해야 할 파일·프로세스·통신의 관계입니다. 화살표가 있다고 실제 인과관계나 주입·유출이 확인된 것은 아니며 정상 동작과 수집 한계도 확인합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="650" rx="14" fill="#0e1927"/><polyline points="335,82 385,82" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,135 540,270" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="437.0" y="188" width="206" height="26" rx="4" fill="#0e1927"/><text class="label" x="540" y="205" text-anchor="middle">생성 파일과 실행 연결</text><polyline points="385,325 335,325" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,380 180,455 270,455 270,515" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,380 540,455 450,455 450,515" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="30" y="30" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="76.5" text-anchor="middle">처음 받은 항목</text><text x="182.5" y="102.5" text-anchor="middle">출처 URL · 메시지 · 파일 해시</text><rect x="385" y="30" width="305" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="76.5" text-anchor="middle">다음에 생긴 파일</text><text x="537.5" y="102.5" text-anchor="middle">작성 주체 · 생성 시각 · 해시</text><rect x="385" y="270" width="305" height="110" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="306.0" text-anchor="middle">그 파일의 실행 여부</text><text x="537.5" y="332.0" text-anchor="middle">프로세스 인스턴스 · 명령줄</text><text x="537.5" y="358.0" text-anchor="middle">생성 시각 · 실행 대상</text><rect x="30" y="270" width="305" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="306.0" text-anchor="middle">관측된 외부 통신</text><text x="182.5" y="332.0" text-anchor="middle">소스 프로세스 · 목적지</text><text x="182.5" y="358.0" text-anchor="middle">시각 · 요청·응답 정보</text><rect x="105" y="515" width="510" height="90" rx="12" fill="#193345" stroke="#80a7ff"/><text x="360.0" y="554.0" text-anchor="middle">각 화살표마다 별도의 연결 증거가 필요</text><text x="360.0" y="580.0" text-anchor="middle">저장 ≠ 실행 · 통신 ≠ 유출 완료</text></svg>