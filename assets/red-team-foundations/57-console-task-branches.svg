<svg xmlns="http://www.w3.org/2000/svg" width="710" height="386" viewBox="0 0 880 479" role="img" aria-labelledby="title desc"><title id="title">작업이 목표로 삼는 상태</title><desc id="desc">인수 없는 목록 조회는 모듈을 보여 줍니다. 실제 작업은 별도로 관측합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="479" rx="14" fill="#0e1927"/><polyline points="335,103 335,144 220,144 220,181" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="545,103 545,144 660,144 660,181" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="220,291 220,335 340,335 340,377" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="660,291 660,335 540,335 540,377" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="214" y="28" width="452" height="75" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="72.5" text-anchor="middle">콘솔의 등록된 방법</text><rect x="28" y="181" width="385" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="220.5" y="230.0" text-anchor="middle">jump</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="220.5" y="256.0" text-anchor="middle">새 세션 시작 시도</text><rect x="467" y="181" width="385" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="659.5" y="230.0" text-anchor="middle">remote-exec</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="659.5" y="256.0" text-anchor="middle">원격 명령 실행 시도</text><rect x="211" y="377" width="458" height="78" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="440.0" y="423.0" text-anchor="middle">대상에서 별도 증거 확인</text></svg>