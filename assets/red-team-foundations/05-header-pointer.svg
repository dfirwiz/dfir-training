<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc"><title id="title">필드의 위치와 필드에 저장된 값</title><desc id="desc">가상 예제입니다. 0x3C는 필드가 놓인 파일 위치이고, 그 위치의 80 00 00 00을 리틀 엔디언으로 읽은 0x80은 PE 서명의 파일 위치입니다. 둘을 구별합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="560" rx="14" fill="#0e1927"/><polyline points="180,110 180,200" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="330,252 390,252" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,305 540,370 360,370 360,425" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="289.0" y="350" width="222" height="26" rx="4" fill="#0e1927"/><text class="label" x="400" y="367" text-anchor="middle">파일 범위 확인 후 이동</text><rect x="30" y="25" width="300" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="180.0" y="61.5" text-anchor="middle">파일의 위치</text><text x="180.0" y="87.5" text-anchor="middle">어디에서 바이트를 읽나요?</text><rect x="390" y="25" width="300" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="540.0" y="61.5" text-anchor="middle">읽은 값의 의미</text><text x="540.0" y="87.5" text-anchor="middle">어디로 이동하나요?</text><rect x="30" y="200" width="300" height="105" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="180.0" y="233.5" text-anchor="middle">오프셋 0x3C의 4바이트</text><text x="180.0" y="259.5" text-anchor="middle">80 00 00 00</text><text x="180.0" y="285.5" text-anchor="middle">e_lfanew 필드</text><rect x="390" y="200" width="300" height="105" rx="12" fill="#193345" stroke="#80a7ff"/><text x="540.0" y="233.5" text-anchor="middle">리틀 엔디언으로 해석</text><text x="540.0" y="259.5" text-anchor="middle">값 = 0x00000080</text><text x="540.0" y="285.5" text-anchor="middle">파일 시작부터 128바이트</text><rect x="195" y="425" width="330" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="466.5" text-anchor="middle">파일 오프셋 0x80 확인</text><text x="360.0" y="492.5" text-anchor="middle">50 45 00 00 = PE 서명</text></svg>