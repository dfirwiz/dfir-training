<svg xmlns="http://www.w3.org/2000/svg" width="710" height="252" viewBox="0 0 880 312" role="img" aria-labelledby="title desc"><title id="title">WinRM 응답과 원격 작업의 경계</title><desc id="desc">리스너가 응답해도 특정 신원의 PowerShell 작업은 인가와 실행이 필요합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="880" height="312" rx="14" fill="#0e1927"/><polyline points="408,69 472,69" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="662,114 662,198" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="472,243 408,243" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="28" y="24" width="380" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="218.0" y="63.0" text-anchor="middle">리스너 응답</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="218.0" y="89.0" text-anchor="middle">TCP · WS-Management</text><rect x="472" y="24" width="380" height="90" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="662.0" y="63.0" text-anchor="middle">인증과 서버 신원</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="662.0" y="89.0" text-anchor="middle">이름 · 인증 방식 · 정책</text><rect x="28" y="198" width="380" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="218.0" y="237.0" text-anchor="middle">실행과 응답</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="218.0" y="263.0" text-anchor="middle">런스페이스 · 이벤트 · 반환</text><rect x="472" y="198" width="380" height="90" rx="12" fill="#193