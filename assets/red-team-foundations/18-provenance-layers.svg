<svg xmlns="http://www.w3.org/2000/svg" width="720" height="635" viewBox="0 0 720 635" role="img" aria-labelledby="title desc"><title id="title">파일 본문·출처 메타데이터·실행 기록</title><desc id="desc">정보의 층을 비교한 개념도입니다. 본문 해시의 일치가 별도 메타데이터나 실행 이력의 일치를 보장하지는 않습니다. 연결선이 없는 실행 기록은 따로 수집해야 할 증거를 뜻합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="635" rx="14" fill="#0e1927"/><polyline points="250,100 250,165 180,165 180,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="470,100 470,165 540,165 540,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="150" y="25" width="420" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="56.5" text-anchor="middle">하나의 분석 대상</text><text x="360.0" y="82.5" text-anchor="middle">수집 경로와 시각을 함께 기록</text><rect x="30" y="225" width="305" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="261.0" text-anchor="middle">파일 본문</text><text x="182.5" y="287.0" text-anchor="middle">일반 본문 SHA256 계산</text><text x="182.5" y="313.0" text-anchor="middle">내용이 같은지 비교</text><rect x="385" y="225" width="305" height="110" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="261.0" text-anchor="middle">출처 메타데이터</text><text x="537.5" y="287.0" text-anchor="middle">Zone.Identifier 등</text><text x="537.5" y="313.0" text-anchor="middle">존재 · 값 · 보존 여부 확인</text><rect x="100" y="480" width="520" height="100" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="360.0" y="511.0" text-anchor="middle">실제 실행 기록은 별도</text><text x="360.0" y="537.0" text-anchor="middle">프로세스 · 명령줄 · 모듈 · 시각</text><text x="360.0" y="563.0" text-anchor="middle">본문이나 ZoneId만으로 실행을 입증하지 않음</text></svg>