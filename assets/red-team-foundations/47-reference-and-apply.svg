<svg xmlns="http://www.w3.org/2000/svg" width="800" height="312" viewBox="0 0 800 312" role="img" aria-labelledby="title desc"><title id="title">프로세스 관측에서 가장 적용까지</title><desc id="desc">번호는 관측을 점검하는 순서입니다. 각 단계의 성공에는 그 단계의 증거가 필요합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="800" height="312" rx="14" fill="#0e1927"/><polyline points="355,69 445,69" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="610,113 610,200" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="445,244 355,244" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="25" y="25" width="330" height="88" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="190.0" y="63.0" text-anchor="middle">① 프로세스 관측·접근</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="190.0" y="89.0" text-anchor="middle">PID · 생성 시각 · 핸들</text><rect x="445" y="25" width="330" height="88" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="610.0" y="63.0" text-anchor="middle">② 토큰 참조</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="610.0" y="89.0" text-anchor="middle">대상 토큰과 요청 권한</text><rect x="445" y="200" width="330" height="88" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="610.0" y="238.0" text-anchor="middle">③ 적합성 확인</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="610.0" y="264.0" text-anchor="middle">토큰 유형 · 가장 수준</text><rect x="25" y="200" width="330" height="88" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="190.0" y="238.0" text-anchor="middle">④ 스레드 적용</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="190.0" y="264.0" text-anchor="middle">결과와 유효 문맥 확인</text></svg>