<svg xmlns="http://www.w3.org/2000/svg" width="790" height="400" viewBox="0 0 790 400" role="img" aria-labelledby="title desc"><title id="title">사전 인증 요구와 예외</title><desc id="desc">자료가 없는 초기 요청은 정상 협상일 수 있습니다. 요구되는 계정과 예외의 응답을 비교합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="790" height="400" rx="14" fill="#0e1927"/><polyline points="280,97 280,130 190,130 190,165" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="510,97 510,130 600,130 600,165" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="190,259 190,289 265,289 265,320" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="600,259 600,289 525,289 525,320" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="230" y="25" width="330" height="72" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="395.0" y="68.0" text-anchor="middle">AS-REQ에 사전 인증 자료 없음</text><rect x="20" y="165" width="340" height="94" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="190.0" y="206.0" text-anchor="middle">사전 인증을 요구하는 계정</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="190.0" y="232.0" text-anchor="middle">필요한 방식 안내 가능</text><rect x="430" y="165" width="340" height="94" rx="12" fill="#152d3a" stroke="#426c7c"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="600.0" y="206.0" text-anchor="middle">사전 인증을 요구하지 않는 계정</text><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="600.0" y="232.0" text-anchor="middle">다른 조건이 맞으면 AS-REP 발급</text><rect x="185" y="320" width="420" height="60" rx="12" fill="#193345" stroke="#80a7ff"/><text fill="#deeee9" font-size="18" font-family="Arial,sans-serif" x="395.0" y="357.0" text-anchor="middle">응답 결과 · 계정 설정 · 출발지를 대조</text></svg>