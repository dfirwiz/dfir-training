<svg xmlns="http://www.w3.org/2000/svg" width="700" height="660" viewBox="0 0 700 660" role="img" aria-labelledby="title desc"><title id="title">분기 연결과 직렬 연결의 차이</title><desc id="desc">화살표는 서버에 이르는 상위 논리 경로를 가리킵니다. 왼쪽에서는 B와 C가 A의 독립 자식이고, 오른쪽에서는 C가 B를 거칩니다. 프로세스 생성 관계나 최초 소켓 방향이 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="660" rx="14" fill="#0e1927"/><polyline points="95,430 95,325 140,325 140,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="265,430 265,325 220,325 220,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="520,350 520,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="520,530 520,425" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="25" y="25" width="310" height="70" rx="12" fill="#193345" stroke="#80a7ff"/><text x="180.0" y="67.0" text-anchor="middle">구조 1: 분기</text><rect x="365" y="25" width="310" height="70" rx="12" fill="#193345" stroke="#80a7ff"/><text x="520.0" y="67.0" text-anchor="middle">구조 2: 직렬</text><rect x="65" y="170" width="230" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="180.0" y="214.5" text-anchor="middle">A: egress 경로</text><rect x="405" y="170" width="230" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="520.0" y="214.5" text-anchor="middle">A: egress 경로</text><rect x="25" y="430" width="140" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="95.0" y="477.0" text-anchor="middle">B</text><rect x="195" y="430" width="140" height="80" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="265.0" y="477.0" text-anchor="middle">C</text><rect x="405" y="350" width="230" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="520.0" y="394.5" text-anchor="middle">B: 중계 역할</text><rect x="405" y="530" width="230" height="75" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="520.0" y="574.5" text-anchor="middle">C</text></svg>