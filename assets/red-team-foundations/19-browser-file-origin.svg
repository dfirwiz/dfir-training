<svg xmlns="http://www.w3.org/2000/svg" width="720" height="675" viewBox="0 0 720 675" role="img" aria-labelledby="title desc"><title id="title">직접 다운로드와 브라우저 내부 파일 구성</title><desc id="desc">가능한 전달 구조를 비교한 개념도입니다. 오른쪽에서도 최초 데이터 전달은 관측 대상이며 네트워크 활동이 없다는 뜻은 아닙니다. 정상 웹 기능인지 악용인지는 별도 근거로 판단합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="720" height="675" rx="14" fill="#0e1927"/><polyline points="180,120 180,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,120 540,245" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="180,355 180,495" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="540,355 540,495" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="30" y="25" width="305" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="66.5" text-anchor="middle">직접 다운로드 경로</text><text x="182.5" y="92.5" text-anchor="middle">서버의 파일 응답</text><rect x="385" y="25" width="305" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="66.5" text-anchor="middle">브라우저 내부 구성 경로</text><text x="537.5" y="92.5" text-anchor="middle">HTML · 데이터 등의 응답</text><rect x="30" y="245" width="305" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="281.0" text-anchor="middle">브라우저가 응답을 받음</text><text x="182.5" y="307.0" text-anchor="middle">파일 요청 · 응답을 연결</text><text x="182.5" y="333.0" text-anchor="middle">최종 파일 바이트 저장</text><rect x="385" y="245" width="305" height="110" rx="12" fill="#193345" stroke="#80a7ff"/><text x="537.5" y="281.0" text-anchor="middle">브라우저가 데이터를 처리</text><text x="537.5" y="307.0" text-anchor="middle">객체 · 조립 · 저장 관계</text><text x="537.5" y="333.0" text-anchor="middle">추가 요청 여부도 확인</text><rect x="30" y="495" width="305" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="182.5" y="531.0" text-anchor="middle">클라이언트의 저장 파일</text><text x="182.5" y="557.0" text-anchor="middle">본문 · 해시 · 출처</text><text x="182.5" y="583.0" text-anchor="middle">실행 여부는 별도 확인</text><rect x="385" y="495" width="305" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="537.5" y="531.0" text-anchor="middle">클라이언트의 저장 파일</text><text x="537.5" y="557.0" text-anchor="middle">페이지와 파일의 연결 증거</text><text x="537.5" y="583.0" text-anchor="middle">실행 여부는 별도 확인</text></svg>