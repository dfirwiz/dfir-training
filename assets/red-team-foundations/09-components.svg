<svg xmlns="http://www.w3.org/2000/svg" width="700" height="590" viewBox="0 0 700 590" role="img" aria-labelledby="title desc"><title id="title">Client·Team Server·Beacon의 역할</title><desc id="desc">Client와 Beacon은 Team Server를 중심으로 서로 다른 역할을 수행합니다. 연결선은 논리적인 상호작용이며 최초 TCP 연결 방향을 나타내지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="590" rx="14" fill="#0e1927"/><polyline points="177,125 177,210 260,210 260,300" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="130.0" y="173" width="94" height="26" rx="4" fill="#0e1927"/><text class="label" x="177" y="190" text-anchor="middle">입력·표시</text><polyline points="522,125 522,210 440,210 440,300" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="475.0" y="173" width="94" height="26" rx="4" fill="#0e1927"/><text class="label" x="522" y="190" text-anchor="middle">작업·결과</text><rect x="35" y="30" width="285" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="177.5" y="71.5" text-anchor="middle">Client</text><text x="177.5" y="97.5" text-anchor="middle">운영자의 인터페이스</text><rect x="380" y="30" width="285" height="95" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="522.5" y="71.5" text-anchor="middle">Beacon</text><text x="522.5" y="97.5" text-anchor="middle">단말에서 작업과 결과 처리</text><rect x="140" y="300" width="420" height="115" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="351.5" text-anchor="middle">Team Server</text><text x="350.0" y="377.5" text-anchor="middle">작업 · 결과 · 공유 기록 관리</text><rect x="75" y="495" width="550" height="60" rx="12" fill="#193345" stroke="#80a7ff"/><text x="350.0" y="532.0" text-anchor="middle">역할 관계도: 소켓 최초 연결 방향과 구별</text></svg>