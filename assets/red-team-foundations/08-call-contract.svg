<svg xmlns="http://www.w3.org/2000/svg" width="700" height="690" viewBox="0 0 700 690" role="img" aria-labelledby="title desc"><title id="title">P/Invoke 호출 계약을 확인하는 순서</title><desc id="desc">네이티브 공식 원형에서 C# 자료형과 문자열·오류 설정으로 대응시키고 반환값을 해석하는 관계입니다. 선언만 작성했다고 실제 실행까지 검증한 것은 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78e3c5" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,Arial,sans-serif;fill:#deeee9;font-size:18px}.label{font-size:16px;fill:#a8c9d5}</style><rect width="700" height="690" rx="14" fill="#0e1927"/><polyline points="350,110 350,225" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="199.0" y="155" width="302" height="26" rx="4" fill="#0e1927"/><text class="label" x="350" y="172" text-anchor="middle">이름뿐 아니라 자료 표현까지 대응</text><polyline points="350,335 350,450" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="223.0" y="383" width="254" height="26" rx="4" fill="#0e1927"/><text class="label" x="350" y="400" text-anchor="middle">대상 플랫폼 · 런타임 확인</text><polyline points="350,540 350,600" fill="none" stroke="#78e3c5" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="55" y="25" width="590" height="85" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="61.5" text-anchor="middle">Windows 공식 함수 원형</text><text x="350.0" y="87.5" text-anchor="middle">DLL · 반환형 · 인자 · 실패 규칙</text><rect x="55" y="225" width="590" height="110" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="261.0" text-anchor="middle">C# 선언으로 대응</text><text x="350.0" y="287.0" text-anchor="middle">고정 크기와 포인터 크기 구분</text><text x="350.0" y="313.0" text-anchor="middle">문자열 인코딩 · 오류 보존 설정</text><rect x="55" y="450" width="590" height="90" rx="12" fill="#152d3a" stroke="#426c7c"/><text x="350.0" y="489.0" text-anchor="middle">호출 후 반환값을 계약대로 검사</text><text x="350.0" y="515.0" text-anchor="middle">실패일 때 보존된 오류를 즉시 확인</text><rect x="55" y="600" width="590" height="60" rx="12" fill="#193345" stroke="#80a7ff"/><text x="350.0" y="637.0" text-anchor="middle">실제 결과와 아직 미검증인 가정을 분리해 기록</text></svg>